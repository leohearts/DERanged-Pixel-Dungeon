###buffs
actors.buffs.thunderimbue.name=雷电同化
actors.buffs.thunderimbue.desc=你已获得雷电之力，可召唤天雷惩戒敌人！\n\n所有物理攻击都将引发追加雷电伤害，并获得电火花免疫效果。\n\n雷电同化状态将持续%s回合。

actors.buffs.evasivemove.name=闪避机动
actors.buffs.evasivemove.desc=你已获得迅捷身法，可预判并回避所有敌方攻击！\n\n剩余回合：%s。

actors.buffs.enduring.name=不屈
actors.buffs.enduring.desc=你正以顽强意志抵抗致命攻击，不屈状态下生命值不会低于1点。\n\n剩余回合：%s。
actors.buffs.warp.name=扭曲
actors.buffs.warp.desc=屈从于黑暗魔法从未如此轻松！\n\n扭曲魔法会腐蚀你的心智，在你处于扭曲状态时引发#各种精神效应#。扭曲会根据造成它的魔法强度缓慢#消退#。\n\n若放任黑暗将你包围，就会引发#更强烈的效应#，最终_腐蚀你所经之处的一切_。\n\n当前扭曲：_%s_\n消退速率：_%s_
actors.buffs.warpedenemy.name=扭曲
actors.buffs.warpedenemy.desc=黑暗魔法扭曲了这个生物，令它的行为变得错乱。\n\n这个扭曲魔法会腐蚀它接触到的所有怪物，令它们#变得失控且更具有攻击性#，还能使用超常的魔法。\n\n只有当地牢中存在#扭曲之源#的时候，扭曲生物才会出现……
actors.buffs.scam.name=骗局
actors.buffs.scam.desc=承蒙我的[仁慈]，每个店主都会把你当成[回头客浣熊]，为了你的[利益]把店里的价钱[随便乱开]！\n\n[特价]剩余时间：%s。
actors.buffs.nodeath.name=不许死
actors.buffs.nodeath.desc=只要这瓶[饮料]还在[替你解渴]，你就[停不下来]，但你得[还]一笔[债]！\n\n[兜里]剩余时间：%s。

actors.buffs.enhancedringscombo.name=戒指强化
actors.buffs.enhancedringscombo.desc=格斗家的攻击激发戒指的力量获得了临时强化效果。+%2$s的强化将持续%1$d回合

actors.hero.talent$quickfollowupcooldown.name= 冷却时间：速切疾斩
actors.hero.talent$quickfollowupcooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

actors.hero.talent$maxragecooldown.name= 冷却时间：怒火中烧
actors.hero.talent$maxragecooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

actors.hero.talent$chasecooldown.name= 冷却时间：遁入阴影
actors.hero.talent$chasecooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

actors.hero.talent$chaincooldown.name= 冷却时间：连携影遁
actors.hero.talent$chaincooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

actors.hero.talent$lethalcooldown.name= 冷却时间：致命惊喜
actors.hero.talent$lethalcooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

actors.buffs.magicalcombo.name=魔法连击
actors.buffs.magicalcombo.action_name=魔法连击
actors.buffs.magicalcombo.combo=%d连击！
actors.buffs.magicalcombo.bad_target=必须攻击攻击范围内的敌人
actors.buffs.magicalcombo.prompt=选择攻击目标
actors.buffs.magicalcombo.desc=战斗法师每次使用老魔杖近战攻击时都会积累特殊魔力。每次攻击增加1点魔法连击值。但若一段时间内未能成功攻击，魔法连击值将重置为0。\n\n发动魔法连击后，可使用必定命中的终结技，其威力随当前魔法连击值提升。部分终结技需提升天赋等级解锁。\n\n当前魔法连击：%1$d。\n\n魔法连击消失剩余回合：%2$s。
actors.buffs.magicalcombo$combomove.blast_desc=_第1阶段：魔力震荡_对敌人造成60%%点伤害，并引爆凝聚的魔力将敌人击退_%d_(1+魔法连击*50%%)格。
actors.buffs.magicalcombo$combomove.stab_desc=_阶段1：魔杖突刺_可进行快速攻击，且不消耗回合数，以_%d%%_(魔法连击*10%%)的伤害攻击敌人。
actors.buffs.magicalcombo$combomove.mana_amp_desc=_阶段2：魔力增幅_对敌人造成60%%点伤害，并提纯凝聚的魔力，为接下来_%1$d_(天赋等级)次发射额外附加_+%2$d_(1+魔法连击*50%%，最大_+%3$d_)的强化值。
actors.buffs.magicalcombo$combomove.emmit_desc=_阶段2：魔力释放_以30度角度和半径_%1$d_(魔法连击)格为范围的锥形区域释放凝聚的魔力，造成_10~20_伤害，并根据受伤害敌人数量获得遗物充能效果。
actors.buffs.magicalcombo$combomove.unleash_desc=_阶段3：魔力爆发_具有_%1$d%%_(魔法连击*10%%)的伤害，在半径_%2$d_(3+魔法连击*50%%)格的范围内触发与法师法杖融合的_元素风暴_效果。
actors.buffs.magicalcombo$combomove.power_desc=_阶段3：魔力解放_将消耗法杖所有充能，并将魔力扩散至周围，接下来_%d_((消耗充能量+魔法连击)*50%%)回合内获得_激素涌动_和_祝福_效果。

actors.buffs.magicalempower.name=魔力强化
actors.buffs.magicalempower.desc=你的法杖获得力量暂时强化了！战斗法师用法杖攻击敌人也会消耗发射次数。\n\n强化数值增加量：+%1$d\n剩余发射次数：%2$d

actors.buffs.magicalcircle.name=奥术法阵
actors.buffs.magicalcircle.desc=你的周围出现了蓝色魔法阵，你所持有的法杖正持续从魔法阵中获得巨大魔法能量！\n\n魔法阵拥有相当强的力量在向你传递魔法能量，但如果你离开魔法阵，魔法阵会立即失去力量并消失。\n剩余回合：%s。

actors.hero.talent$kickcooldown.name= 冷却时间：夺矢环踢
actors.hero.talent$kickcooldown.desc=你最近使用了这个特性，需要等待一段时间才能再次使用。\n\n剩余回合: %s。

actors.buffs.tackle.tackle=肩撞

actors.hero.talent$parrytracker.name=反击姿态
actors.hero.talent$parrytracker.desc=你已经准备好格挡下一次受到的攻击。下次受到攻击时将格挡该攻击并反击那个敌人。

actors.buffs.fatigue.name=疲劳
actors.buffs.fatigue.desc=你逐渐感到身体疲劳，行动变得困难。\n\n每次对敌人发动物理攻击或受到物理攻击时，都会积累疲劳值。如果持续积累疲劳值，可能会受到不良效果影响！\n\n疲劳会随时间缓慢消除，也可以通过进食或使用有害效果清除手段立即消除。

actors.buffs.rouletteofdeath.name=死亡轮盘
actors.buffs.rouletteofdeath.desc=敌人的死亡正逐渐临近...\n\n每次你命中子弹时，死亡轮盘的持续时间会延长且叠加1层，当叠加到6层时，下一发子弹将造成普通敌人剩余生命值的伤害。\n\n当前叠加：_%1$s_/6\n剩余回合：_%2$s_。

actors.buffs.infinitebullet.name=无限弹药
actors.buffs.infinitebullet.desc=神秘魔法力量包裹着你手中枪械的弹匣，在无限弹药效果持续期间，射击不会消耗弹药。\n\n无限弹药效果持续%s回合。
actors.hero.talent$bulletsavingcooldown.name=冷却：额外子弹
actors.hero.talent$bulletsavingcooldown.desc=你最近使用过这个天赋，需要一段时间才能再次使用。\n\n剩余回合：%s。

actors.buffs.frostbullet.name=极冻弹
actors.buffs.frostbullet.desc=你已装填极冻弹，在重新装弹或极冻弹效果随时间消失前，可发射附带寒冰之力的子弹。极冻弹会赋予敌人冻伤，偶尔会冻结目标。\n\n极冻弹效果持续%s回合。

actors.buffs.firebullet.name=爆炎弹
actors.buffs.firebullet.desc=你已装填爆炎弹，在重新装弹或爆炎弹效果随时间消失前，可发射附带烈焰之力的子弹。爆炎弹会焚烧敌人，并使已燃烧的敌人持续燃烧更长时间。\n\n爆炎弹效果持续%s回合。

actors.buffs.electrobullet.name=电击弹
actors.buffs.electrobullet.desc=你已装填电击弹，在重新装弹或电击弹效果随时间消失前，可发射附带雷电之力的子弹。电击弹会使敌人触电短暂麻痹，但持续时间不长。\n\n电击弹效果持续%s回合。

actors.hero.talent$skillfulrunnercooldown.name= 冷却时间：幽灵突袭
actors.hero.talent$skillfulrunnercooldown.desc=你最近使用了这个特性，需要等待一段时间才能再次使用。\n\n剩余回合: %s。

actors.hero.talent$intotheshadowcooldown.name= 冷却时间：影子战术
actors.hero.talent$intotheshadowcooldown.desc=你最近使用了这个特性，需要等待一段时间才能再次使用。\n\n剩余回合: %s。

actors.buffs.cloaking.name=隐蔽行动
actors.buffs.cloaking.desc=你已与周围环境最大程度同化，使周围无法察觉你的存在。隐蔽在静止状态下会持续维持，但攻击敌人或移动时会立即解除。

actors.buffs.swordaura.name=剑气充能
actors.buffs.swordaura.action_name=发射剑气
actors.buffs.swordaura.desc=你从之前的攻击中汲取力量，将造成伤害的一部分储存为能量！\n\n使用能量释放剑气时，可对剑气路径上的所有敌人造成与消耗能量等量的伤害。\n\n储存的能量：_%1$d/%2$d_。\n能量使用量：_%3$d_。

actors.buffs.awakening.name=鬼人化
actors.buffs.awakening.action_name=鬼人化
actors.buffs.awakening.desc_on=你将自己逼至极限状态，获得鬼神般的能力。鬼人化期间可获得与额外闪避率等比的额外暴击率，攻击速度提升2倍，但攻击力减半。\n\n鬼人化持续期间，体力会持续减少，对长时间活动造成极大负担。当体力仅剩1时，鬼人化将自动解除。\n\n解除鬼人化后，会暂时陷入易伤状态。
actors.buffs.awakening.desc_off=你已解除鬼人化状态，若鬼人化没有处于冷却时间，可随时再次发动鬼人化。
actors.buffs.awakening.not_prepared=鬼人化尚未准备完成！
actors.buffs.awakening$awakeningcooldown.name=冷却时间：鬼人化
actors.buffs.awakening$awakeningcooldown.desc=你需要充分休息才能再次使用鬼人化。\n\n剩余回合：%s。

###mobs

actors.mobs.rebel.name=叛军首领
actors.mobs.rebel.desc=叛军首领是很久以前获得护身符力量、制造这个地下城所有事件的未来元凶。\n\n他通过时间跳跃扭曲时空，回到数百年前的过去企图统治全宇宙。为了执行这个计划，他故意让某个矮人魔法师获得护身符，等待古代黑魔法被研究出来。\n\n领悟了黑魔法和死灵术的矮人魔法师虽然警惕护身符的力量，但逐渐被全能护身符的力量吸引，开始被黑暗侵蚀，自立为王开始统治。\n\n而后，觊觎矮人王身上黑暗力量的Yog-Dzewa在矮人城市下方制造化身，为了夺取护身符力量开始制造恶魔军团。\n\n矮人王为了守护护身符与恶魔长期战争，虽然成功大幅削弱恶魔军团并将它们封印在城市地下，但战争过程中损失极其惨重。\n\n当矮人王逐渐被黑暗力量腐蚀最终丧失理智，无法继续为叛军进行研究时，叛军从虚弱的他手中直接回收了护身符，现在这个护身符正给予你面前之人巨大的力量。\n\n但他的力量只是接近全能而非完美，必定存在某种弱点。你可以做到！
actors.mobs.rebel.notice=看来你就是最近四处剿杀我军的元凶。就让我用这护身符的力量亲手了结你。
actors.mobs.rebel.defeated=不可能...我竟然...输了...
actors.mobs.rebel.rankings_desc=被叛军首领阻拦
actors.mobs.rebel.telling_1=看吧！这才是真正的力量！
actors.mobs.rebel.telling_2=哈，哈，哈！可笑，太可笑了！
actors.mobs.rebel.telling_3=你当真以为能战胜拥有神明般视角的存在吗？
actors.mobs.rebel.telling_4=哼！这种程度的攻击算不了什么！
actors.mobs.rebel.telling_5=怎么会这样...我怎么可能输！
actors.mobs.rebel.cleaning=你别想着能从我这里逃走！
actors.mobs.rebel.no_scroll=愚蠢。你以为这种肤浅的伎俩对我有用吗？

actors.mobs.soldier.name=士兵
actors.mobs.soldier.desc=叛军士兵中最常见的敌人，会千方百计避免近战，倾向于在远距离向你射击。

actors.mobs.swat.name=特种部队成员
actors.mobs.swat.sniper_desc=这是叛军中经过少数精锐训练的战斗部队成员，会千方百计避免近战，极倾向于在远距离向你射击。\n\n当前该特种部队成员持有_战术狙击步枪_，发射高命中高伤害弹药，但射速极慢。
actors.mobs.swat.handgun_desc=这是叛军中经过少数精锐训练的战斗部队成员，会千方百计避免近战，极倾向于在远距离向你射击。\n\n当前该特种部队成员持有_战术手枪_，移动速度非常快。
actors.mobs.swat.machinegun_desc=这是叛军中经过少数精锐训练的战斗部队成员，会千方百计避免近战，极倾向于在远距离向你射击。\n\n当前该特种部队成员持有_强化型重机枪_，移速极慢，发射低命中低伤害弹药，但射速极快。

actors.mobs.researcher.name=研究员
actors.mobs.researcher.desc=负责叛军科技研究的职员，手中拿着装有黑色液体的烧瓶。

actors.mobs.tank.name=战车
actors.mobs.tank.desc=装有长炮管的巨型战车，在无法接近目标或距离足够时，会偶尔发射强力主炮。
actors.mobs.tank.cannon_kill=你被战车主炮击中爆裂而亡...

actors.mobs.suppression.name=镇压部队
actors.mobs.suppression.desc=这是为镇压反抗势力而投入的战斗人员。会尽可能与其他队员协同行动，似乎穿着非常坚固的护甲。

actors.mobs.medic.name=医护兵
actors.mobs.medic.desc=负责叛军医疗支援的战斗人员。战斗能力相对较弱，但每次攻击时会向周围喷洒医疗药剂治疗友军。

actors.mobs.npcs.shopkeeper.talk_labs=那些累死累活的研究员都在这儿花钱。\n\n这些人都富得流油哦，就我这个出价他们也乐意买。就好像钱是风吹来的似的！\n\n哈哈，开玩笑的。
actors.mobs.npcs.shopkeeper.talk_ascent_shopkeeper=看起来你摊上大事咯。照说随便哪个商人到这个点都该溜了，不过我自有对策，所以不遑你操心。\n\n要不多花点钱呗？反正你之后也没地儿用了不是么。

actors.mobs.npcs.shopkeeper.talk_prison_gunner=若有需要之物，请在此尽数购去。
actors.mobs.npcs.shopkeeper.talk_prison_samurai=若有需要之物，请在此尽数购去。
actors.mobs.npcs.shopkeeper.talk_prison_adventurer=若有需要之物，请在此尽数购去。
actors.mobs.npcs.shopkeeper.talk_prison_knight=若有需要之物，请在此尽数购去。
actors.mobs.npcs.shopkeeper.talk_prison_medic=若有需要之物，请在此尽数购去。
actors.mobs.npcs.shopkeeper.talk_prison_archer=若有需要之物，请在此尽数购去。

actors.mobs.npcs.blacksmith.intro_quest_gunner=喂，人类！
actors.mobs.npcs.blacksmith.intro_quest_samurai=喂，人类！
actors.mobs.npcs.blacksmith.intro_quest_adventurer=喂，人类！
actors.mobs.npcs.blacksmith.intro_quest_knight=喂，人类！
actors.mobs.npcs.blacksmith.intro_quest_medic=喂，人类！
actors.mobs.npcs.blacksmith.intro_quest_archer=喂，人类！

actors.mobs.npcs.wandmaker.intro_gunner=噢，欢迎你，异乡人！虽然我懂魔法，但还是第一次见到带着如此古怪武器的人。不知你能否帮助这位老人，我这里有个请求。
actors.mobs.npcs.wandmaker.intro_samurai=哦，没想到像我这么老的人也会找到这种地方。真是意想不到！若您有意协助在下，在下在此有一个请求。
actors.mobs.npcs.wandmaker.intro_adventurer=哦，连这种荒凉地方都有探险家到访，真厉害！我这儿正好有个小请求，能不能帮帮我呢？
actors.mobs.npcs.wandmaker.intro_knight=啊，欢迎，阁下！真没想到你们王国会派人到这种地方。我这有点小困难，能否帮帮我？
actors.mobs.npcs.wandmaker.intro_medic=哦，欢迎你，女士。不知为何总觉得你不属于这个时代...啊失礼了。请忘了吧。总之，能否帮助这位陷入困境的老人呢？
actors.mobs.npcs.wandmaker.intro_archer=啊，幸会啊，异乡人！老夫似乎记得见过与你相貌相似之人...不过想必是记错了。眼下正有件棘手之事，不知可否相助一臂之力？

### new subclasses
###warrior
actors.hero.herosubclass.veteran=老兵
actors.hero.herosubclass.veteran_short_desc=_老兵_每次攻击近处敌人时，可发动与防御力成比例的肩撞伤害并击退敌人。
actors.hero.herosubclass.veteran_desc=身经百战的老兵是运用身体战术的专家。老兵在近战攻击后可使用肩撞。\n\n肩撞将造成当前防御力40%的伤害，同时击退目标1格，并立即从破损纹章获得1点护盾。\n\n肩撞无法将目标击落悬崖。\n肩撞可触发武器附魔效果。
###mage
actors.hero.herosubclass.wizard=大魔法师
actors.hero.herosubclass.wizard_short_desc=_大魔法师_在施放魔法书咒文时，可在短时间内大幅提升法杖伤害。
actors.hero.herosubclass.wizard_desc=大魔法师每持有一本魔法书，法杖充能速度提升5%。此外，阅读魔法书后5回合内，获得使伤害型法杖伤害提升20%的魔力增幅效果。
###rouge
actors.hero.herosubclass.chaser=追猎者
actors.hero.herosubclass.chaser_short_desc=_追猎者_等待时会与周围环境同化，获得隐身状态。
actors.hero.herosubclass.chaser_desc=追猎者是隐身专家，等待时会与周围环境同化，获得5回合隐身状态。拥有15回合的冷却时间。
###huntress
actors.hero.herosubclass.fighter=格斗家
actors.hero.herosubclass.fighter_short_desc=_格斗家_在不持有武器时可获得额外攻击力，并能通过天赋提升近战战斗能力。
actors.hero.herosubclass.fighter_desc=格斗家在徒手状态不持武器时，可获得等同于当前等级的额外攻击力。\n\n若格斗家拥有追加打击天赋，用拳头攻击被弓箭或投掷武器命中的敌人时，可施加1回合的_麻痹_效果。
###duelist
actors.hero.herosubclass.fencer=击剑士
actors.hero.herosubclass.fencer_short_desc=_击剑士_可使用武器充能进行瞬间冲刺，调整自己的位置来更好地攻击敌人。
actors.hero.herosubclass.fencer_desc=击剑士精通瞬间移动。击剑士可消耗1点武器充能，无需回合消耗即可冲刺最多2格。冲刺可越过危险要素，但无法穿过坚固地形或敌人。\n\n冲刺后立即攻击敌人时，攻击必定命中并造成10%额外伤害。

###classes
actors.hero.heroclass.gunner=枪手
actors.hero.heroclass.gunner_desc_short=枪手是枪械专家，可_分解_装备获取液金。
actors.hero.heroclass.gunner_desc=枪手可分解装备获得液金和少量炼金能量，并使用液态金属随机制造枪械。\n\n枪手能从弹链获得更多弹药。\n\n同时，枪手初始携带_老旧突击步枪_、5个弹链、布甲、水袋与绒布包。\n\n枪手开局鉴定的物品有：\n_-_ 鉴定卷轴\n_-_ 极速药剂\n_-_ 传送卷轴
actors.hero.heroclass.gunner_unlock=要解锁枪手，_用枪械改造工具改造枪械1次。_

actors.hero.herosubclass.outlaw=漠法
actors.hero.herosubclass.outlaw_short_desc=在乱战中掌握生存技巧的_漠法_，对敌人命中6发子弹后，可发射强力子弹。
actors.hero.herosubclass.outlaw_desc=漠法每次命中敌人子弹时都会更加专注战斗，积累死亡轮盘叠加层数。当死亡轮盘叠加到6层时，下一发子弹将造成等同于敌人剩余生命值的伤害，并立即重新装填当前装备的枪械。\n\n强大的敌人会抵抗即死伤害，此时不会触发重新装填。
actors.hero.herosubclass.gunslinger=突击手
actors.hero.herosubclass.gunslinger_short_desc=精通枪械的_突击手_在移动后投掷武器或射击时不消耗回合，但命中率大幅下降。
actors.hero.herosubclass.gunslinger_desc=突击手在移动后投掷武器或射击时不消耗回合，但命中率降低75%。该攻击可触发伏击。
actors.hero.herosubclass.specialist=特战专家
actors.hero.herosubclass.specialist_short_desc=精通隐蔽技术的_特战专家_可在长草丛中隐身。
actors.hero.herosubclass.specialist_desc=特战专家不会踩踏长草丛，当没有敌人接近时，若在未踩踏的草丛中等待，可获得隐蔽状态来躲避敌人视线。此外，隐身状态下开枪不会产生噪音。隐蔽会在攻击敌人或移动时解除。

actors.hero.heroclass.samurai=武士
actors.hero.heroclass.samurai_desc_short=武士是致命攻击的大师，攻击时具有暴击概率。
actors.hero.heroclass.samurai_desc=武士在攻击敌人时，可以概率性地发动暴击造成更高伤害。\n\n武士拥有特殊的_武士刀鞘_。使用刀鞘可以纳刀强化下一次攻击。\n\n同时，武士初始携带_旧刀_、3把飞刀、布甲、水袋与绒布包。\n\n武士开局鉴定的物品有：\n_-_ 鉴定卷轴\n_-_ 力量药剂\n_-_ 复仇卷轴
actors.hero.heroclass.samurai_unlock=要解锁武士，需_获得新添加的刀类武器。_

actors.hero.herosubclass.slasher=剑客
actors.hero.herosubclass.slasher_short_desc=_剑客_在攻击命中敌人时会积蓄能量，可以消耗能量对远端敌人施放剑气。
actors.hero.herosubclass.slasher_desc=剑客每次攻击时将20%伤害值转化为剑气储能，可用全部储能释放剑气，对直线轨迹上所有敌人造成等同于储能值的物理伤害。\n\n剑气储能上限为60点。
actors.hero.herosubclass.master=剑圣
actors.hero.herosubclass.master_short_desc=_剑圣_可以施展2种强力的拔刀攻击。
actors.hero.herosubclass.master_desc=_剑圣_可在纳刀期间使用燕返闪，瞬间移动至可到达的敌人位置进行攻击，甚至可指定视野外的位置。若瞬移后目标位置没有敌人，则产生100回合的冷却时间。\n\n_剑圣_还能不消耗回合数施展更高暴击率的普通拔刀攻击一闪。若一闪未触发暴击，则产生30回合的冷却时间。
actors.hero.herosubclass.slayer=剑鬼
actors.hero.herosubclass.slayer_short_desc=_剑鬼_可以使用鬼人化获得各种额外效果。
actors.hero.herosubclass.slayer_desc=剑鬼可以使用提升攻击性能的鬼人化。\n使用鬼人化时，每回合受到1点伤害，物理攻击速度变为2倍，物理攻击力减少50%。\n鬼人化期间，英雄每获得1点额外闪避就增加1%暴击概率，暴击时不消耗回合。\n鬼人化期间体力变为1或中途解除时，鬼人化会解除并获得50回合的冷却时间。

###abilities
actors.hero.abilities.gunner.riot.name=压制扫射
actors.hero.abilities.gunner.riot.short_desc=枪手可以在一定时间内将枪械的发射速度提升2倍，向周围_压制扫射_倾泻子弹。
actors.hero.abilities.gunner.riot.desc=枪手使用_压制扫射_，在10回合内子弹发射速度变为2倍，但子弹伤害量减少50%。
actors.hero.abilities.gunner.riot$riottracker.name=压制扫射
actors.hero.abilities.gunner.riot$riottracker.desc=枪手短时间内发挥高度集中力，瞬间倾泻大量子弹！\n\n压制扫射持续期间枪械发射速度提升2倍，但子弹伤害减少50%%。\n\n剩余回合：%s。
actors.hero.abilities.gunner.reinforcedarmor.name=碳纤背心
actors.hero.abilities.gunner.reinforcedarmor.short_desc=枪手通过穿着_碳纤背心_暂时提升防御力。
actors.hero.abilities.gunner.reinforcedarmor.desc=枪手穿着特殊制作的强化防弹背心，在20回合内获得5-20点额外防御力。
actors.hero.abilities.gunner.reinforcedarmor$reinforcedarmortracker.name=碳纤背心
actors.hero.abilities.gunner.reinforcedarmor$reinforcedarmortracker.desc=枪手为他的防弹衣加装了额外防护装置，提升了防御能力！这样制成的防弹衣虽然坚固，但装置中蕴含的力量无法持久，最终会失去防护效能。\n\n剩余回合：%s。
actors.hero.abilities.gunner.firstaidkit.name=急救套件
actors.hero.abilities.gunner.firstaidkit.short_desc=枪手可以使用_急救套件_进行简单治疗。
actors.hero.abilities.gunner.firstaidkit.desc=枪手在需要恢复手段时，可以使用战术急救套件，每回合恢复1点体力，总共可恢复20点。

actors.hero.abilities.samurai.abil_kunai.name=影蚀苦无
actors.hero.abilities.samurai.abil_kunai.short_desc=武士可以投掷强力的_影蚀苦无_对敌人造成伤害并使其陷入易伤状态。
actors.hero.abilities.samurai.abil_kunai.desc=武士可以投掷造成当前装备武器攻击力等值伤害的苦无，被命中的敌人不仅受到伤害，还会被附加20回合的易伤状态。
actors.hero.abilities.samurai.shadowblade.name=暗影之刃
actors.hero.abilities.samurai.shadowblade.short_desc=武士可以从持有的武器影子中取出_暗影之刃_双持，进行更快速的攻击。
actors.hero.abilities.samurai.shadowblade.desc=武士可以使用_暗影之刃_，在10回合内以当前装备武器攻击力的一半作为伤害值，以2倍的攻击速度进行攻击。\n\n影刃持续期间，攻击时有50%的概率无视敌人防御力造成伤害。
actors.hero.abilities.samurai.shadowblade$shadowbladetracker.name=暗影之刃
actors.hero.abilities.samurai.shadowblade$shadowbladetracker.desc=武士剥离武器之影，获得更快速的攻击能力！\n\n影刃持续期间攻击速度提升2倍，伤害减少50%%。但攻击时有50%%概率穿透敌人防御造成伤害。\n\n剩余回合：%s。
actors.hero.abilities.samurai.awake.name=潜能觉醒
actors.hero.abilities.samurai.awake.short_desc=武士引出内在力量，暂时_潜能觉醒_，造成的物理伤害提升1.2倍，但受到的物理伤害也增加1.2倍。
actors.hero.abilities.samurai.awake.desc=武士可引导内在力量进行_潜能觉醒_。觉醒期间造成物理伤害提升至1.2倍，受到物理伤害也增至1.2倍。
actors.hero.abilities.samurai.awake$awaketracker.name=潜能觉醒
actors.hero.abilities.samurai.awake$awaketracker.desc=武士激发体内潜在的力量，对所有敌人造成的物理伤害增加，但受到的物理伤害也增加了！\n\n剩余回合：%s。

###talents

#warrior new talent
actors.hero.talent.max_health.title=体能训练
actors.hero.talent.max_health.desc=_+1:_ 最大体力增加_5_点\n\n_+2:_ 最大体力增加_10_点
actors.hero.talent.parry.title=防御反击
actors.hero.talent.parry.desc=_+1:_ 每_70回合_可自动防御1次攻击并立即进行反击\n_+2:_ 每_50回合_可自动防御1次攻击并立即进行反击

actors.hero.talent.lethal_rage.title=杀意回涌
actors.hero.talent.lethal_rage.desc=_+1:_ 击杀敌人时获得_7%_怒气。\n\n_+2:_ 击杀敌人时获得_13%_怒气。\n\n_+3:_ 击杀敌人时获得_20%_怒气。
actors.hero.talent.max_rage.title=怒火中烧
actors.hero.talent.max_rage.desc=_+1:_ 怒气值达上限时，将_10%_怒气转化为激素涌动。\n\n_+2:_ 怒气值达上限时，将_20%_怒气转化为激素涌动。\n\n_+3:_ 怒气值达上限时，将_30%_怒气转化为激素涌动。\n\n该技能有_50回合_的冷却时间。
actors.hero.talent.endurance.title=怒极反静
actors.hero.talent.endurance.desc=_+1:_ 将受击获得怒气的_33%_转化为战士护盾冷却缩减。\n\n_+2:_ 将受击获得怒气的_67%_转化为战士护盾冷却缩减。\n\n_+3:_ 将受击获得怒气的_100%_转化为战士护盾冷却缩减。

actors.hero.talent.light_weapon.title=速战速决
actors.hero.talent.light_weapon.desc=_+1:_ 力量每超过武器所需力量1点，攻速提升_+5%_。\n\n_+2:_ 力量每超过武器所需力量1点，攻速提升_+10%_。\n\n_+3:_ 力量每超过武器所需力量1点，攻速提升_+15%_。
actors.hero.talent.offensive_defense.title=战守相济
actors.hero.talent.offensive_defense.desc=_+1:_ 遭受物理攻击时，有_33%_的概率累积连击次数。\n\n_+2:_ 遭受物理攻击时，有_67%_的概率累积连击次数。\n\n_+3:_ 遭受物理攻击时，有_100%_的概率累积连击次数。
actors.hero.talent.skill_repeat.title=连战不息
actors.hero.talent.skill_repeat.desc=_+1:_ _用冲击击杀敌人后_，可再次使用冲击。\n\n_+2:_ 除+1效果外，_用招架击杀敌人后_，可再次使用招架。\n\n_+3:_ 除+2效果外，_击杀敌人后_，可再次使用冲击招架。

actors.hero.talent.powerful_tackle.title=重甲撞击
actors.hero.talent.powerful_tackle.desc=_+1:_ 肩撞造成当前护甲_60%_的伤害。\n\n_+2:_ 肩撞造成当前护甲_80%_的伤害。\n\n_+3:_ 肩撞造成当前护甲_100%_的伤害。
actors.hero.talent.mystical_tackle.title=奥术冲袭
actors.hero.talent.mystical_tackle.desc=_+1:_ 肩撞触发的武器附魔强度提升_+50%_。\n\n_+2:_ 肩撞触发的武器附魔强度提升_+100%_。\n\n_+3:_ 肩撞触发的武器附魔强度提升_+150%_。
actors.hero.talent.delayed_grenade.title=崩劲爆罡
actors.hero.talent.delayed_grenade.desc=_+1:_ 通过肩撞击杀敌人时，在目标周围3x3范围内引发造成_5-20伤害_的爆炸。\n\n_+2:_ 通过肩撞击杀敌人时，在目标周围3x3范围内引发造成_8-30伤害_的爆炸。\n\n_+3:_ 通过肩撞击杀敌人时，在目标周围3x3范围内引发造成_10-40伤害_的爆炸。\n\n英雄和友方不受爆炸伤害影响。
actors.hero.talent.incapacitation.title=破势肩撞
actors.hero.talent.incapacitation.desc=_+1:_ 肩撞使目标陷入2回合_恍惚_。\n\n_+2:_ 在+1效果基础上，肩撞时还会使目标陷入_虚弱_状态2回合。\n\n_+3:_ 在+2效果基础上，肩撞时额外再使目标陷入_易伤_状态2回合。
actors.hero.talent.super_armor.title=刚躯绝御
actors.hero.talent.super_armor.desc=_+1:_ 肩撞期间所受伤害减少_33%_。\n\n_+2:_ 肩撞期间所受伤害减少_67%_。\n\n_+3:_ 肩撞期间所受伤害减少_100%_。
actors.hero.talent.improved_tackle.title=蓄势强撞
actors.hero.talent.improved_tackle.desc=_+1:_ 肩撞时从纹章中获得_2点护盾_。\n\n_+2:_ 在+1效果基础上，肩撞击退距离_+1_。\n\n_+3:_ 在+2效果基础上，肩撞可将敌人击落_深渊_。

#mage new talent
actors.hero.talent.charge_preserve.title=充能守恒
actors.hero.talent.charge_preserve.desc=_+1:_ 使用魔杖有_5%_概率不消耗充能\n_+2:_ 使用魔杖有_10%_概率不消耗充能
actors.hero.talent.faster_charger.title=魔磁感应
actors.hero.talent.faster_charger.desc=_+1:_ 魔杖充能速度提升_+10%_。\n\n_+2:_ 魔杖充能速度提升_+20%_。

actors.hero.talent.battle_magic.title=魔法战技
actors.hero.talent.battle_magic.desc=_+1:_ 老魔杖近战攻击时可触发_魔法连击_来使用各类连击技能，并解锁魔法连击的_1阶_连击技能。\n\n_+2:_ 在+1效果基础上，额外解锁魔法连击的_2阶_连击技能。\n\n_+3:_ 在+2效果基础上，额外解锁魔法连击的_3阶_连击技能。
actors.hero.talent.magic_rush.title=充能回涌
actors.hero.talent.magic_rush.desc=_+1:_ 阅读卷轴将立即为老魔杖充能_1_点。\n\n_+2:_ 阅读卷轴将立即为老魔杖充能_2_点。\n\n_+3:_ 阅读卷轴将立即为老魔杖充能_3_点。
actors.hero.talent.magical_circle.title=奥术法阵
actors.hero.talent.magical_circle.desc=_+1:_ 通过天赋_储能护盾_获得护盾时，在当前位置生成法阵，使魔杖充能速度_+100%_。\n_+2:_ 在+1效果基础上，法阵内施法时有_50%概率_不消耗充能。\n_+3:_ 在+1、+2效果基础上，后续生成的法阵范围扩大至_3x3_。

actors.hero.talent.madness.title=狂乱邪咒
actors.hero.talent.madness.desc=_+1:_ 攻击敌人时有_10%_概率施加3回合_狂乱_状态。\n_+2:_ 攻击敌人时有_20%_概率施加3回合_狂乱_状态。\n_+3:_ 攻击敌人时有_30%_概率施加3回合_狂乱_状态。
actors.hero.talent.enhanced_mark.title=强力烙印
actors.hero.talent.enhanced_mark.desc=_+1:_ 灵魂标记的概率及持续时间增加_1阶_。\n\n_+2:_ 灵魂标记的概率及持续时间增加_2阶_。\n\n_+3:_ 灵魂标记的概率及持续时间增加_3阶_。
actors.hero.talent.mark_of_weakness.title=疲惫咒痕
actors.hero.talent.mark_of_weakness.desc=_+1:_ 被施加灵魂烙印的敌人造成的伤害降低_10%_\n\n_+2:_ 被施加灵魂烙印的敌人造成的伤害降低_19%_\n\n_+3:_ 被施加灵魂烙印的敌人造成的伤害降低_27%_

actors.hero.talent.spell_enhance.title=法术强化
actors.hero.talent.spell_enhance.desc=_+1:_ 魔法书效果_+50%_。\n\n_+2:_ 魔法书效果_+100%_。\n\n_+3:_ 魔法书效果_+150%_。
actors.hero.talent.brig_boost.title=吟唱加速
actors.hero.talent.brig_boost.desc=_+1:_ 每次物理攻击命中敌人时魔法书冷却时间减少 _1回合_。\n\n_+2:_ 每次物理攻击命中敌人时魔法书冷却时间减少 _2回合_。\n\n_+3:_ 每次物理攻击命中敌人时魔法书冷却时间减少 _3回合_。
actors.hero.talent.energy_remains.title=能量残留
actors.hero.talent.energy_remains.desc=_+1:_ 击杀敌人时17%概率在该位置生成短暂的充能区域提供_法杖充能_效果。\n_+2:_ 击杀敌人时17%概率在该位置生成短暂的充能区域提供_神器充能_效果。\n_+3:_ 击杀敌人时17%概率在该位置生成短暂的充能区域提供相当于英雄生命上限10%的_护盾_效果。\n\n各效果触发概率不叠加。
actors.hero.talent.magic_empower.title=魔能充沛
actors.hero.talent.magic_empower.desc=_+1:_ 魔力增强持续时间_+100%_。\n\n_+2:_ 魔力增强持续时间_+200%_。\n\n_+3:_ 魔力增强持续时间_+300%_。
actors.hero.talent.second_effect.title=魔法共鸣
actors.hero.talent.second_effect.desc=_+1:_ 当从魔法书中施放法术时，有_33%概率_会额外激活灌注到老魔杖中的法杖相对应的魔法书效果。\n\n_+2:_ 当从魔法书中施放法术时，有_67%概率_会额外激活灌注到老魔杖中的法杖相对应的魔法书效果。\n\n_+3:_ 当从魔法书中施放法术时，有_100%概率_会额外激活灌注到老魔杖中的法杖相对应的魔法书效果。
actors.hero.talent.life_energy.title=能流回溯
actors.hero.talent.life_energy.desc=_+1:_ 对敌人施法命中时，恢复命中目标数与使用充能量的乘积的_1倍_的生命。\n\n_+2:_ 对敌人施法命中时，恢复命中目标数与使用充能量的乘积的_2倍_的生命。\n\n_+3:_ 对敌人施法命中时，恢复命中目标数与使用充能量的乘积的_3倍_的生命。

#rouge new talent
actors.hero.talent.emergency_escape.title=紧急逃脱
actors.hero.talent.emergency_escape.desc=_+1:_ 受到敌人攻击时_2%_概率获得3回合隐身效果 。\n\n_+2:_ 受到敌人攻击时_4%_概率获得3回合隐身效果 。
actors.hero.talent.movespeed_enhance.title=快速移动
actors.hero.talent.movespeed_enhance.desc=_+1:_ 移动速度增加_+10%_。\n\n_+2:_ 移动速度增加_+20%_。

actors.hero.talent.energy_draw.title=暗影回流
actors.hero.talent.energy_draw.desc=_+1:_ 暗杀敌人时_33%_概率恢复斗篷充能1点。可超过最大充能上限。\n_+2:_ 暗杀敌人时_67%_概率恢复斗篷充能1点。可超过最大充能上限。\n_+3:_ 暗杀敌人时_100%_概率恢复斗篷充能1点。可超过最大充能上限。
actors.hero.talent.perfect_assassin.title=完美暗杀
actors.hero.talent.perfect_assassin.desc=_+1:_ 每个暗杀准备阶段造成的额外伤害增加_10%_。\n\n_+2:_ 每个暗杀准备阶段造成的额外伤害增加_20%_。\n\n_+3:_ 每个暗杀准备阶段造成的额外伤害增加_30%_。
actors.hero.talent.cautious_prep.title=精心准备
actors.hero.talent.cautious_prep.desc=_+1:_ 暗影斗篷提供的潜行持续时间增加_1回合_。\n\n_+2:_ 暗影斗篷提供的潜行持续时间增加_2回合_。\n\n_+3:_ 暗影斗篷提供的潜行持续时间增加_3回合_。

actors.hero.talent.quick_prep.title=加速准备
actors.hero.talent.quick_prep.desc=_+1:_ 每次闪避敌人攻击时逸动的冷却时间减少_1回合_。\n\n_+2:_ 每次闪避敌人攻击时逸动的冷却时间减少_2回合_。\n\n_+3:_ 每次闪避敌人攻击时逸动的冷却时间减少_3回合_。
actors.hero.talent.overcoming.title=绝处逢生
actors.hero.talent.overcoming.desc=_+1:_ 处于逸动状态时，疾行者遭受攻击后获得2回合的_极速_。\n\n_+2:_ 除获得+1的增益外，处于逸动状态时，疾行者遭受攻击后获得2回合的_激素涌动_。\n\n_+3:_ 除获得+1，+2的增益外，处于逸动状态时，疾行者遭受攻击后获得2回合的闪避机动。
actors.hero.talent.momentary_focusing.title=瞬时警觉
actors.hero.talent.momentary_focusing.desc=_+1:_ 进入逸动状态时，疾行者获得_1回合_的闪避机动。\n\n_+2:_ 进入逸动状态时，疾行者获得_2回合_的闪避机动。\n\n_+3:_ 进入逸动状态时，疾行者获得_3回合_的闪避机动。

actors.hero.talent.poisonous_blade.title=淬毒锋刃
actors.hero.talent.poisonous_blade.desc=_+1:_ 伏击一名敌人时，追猎者对其造成_3回合_的中毒效果。\n\n_+2:_ 伏击一名敌人时，追猎者对其造成_4回合_的中毒效果。\n\n_+3:_ 伏击一名敌人时，追猎者对其造成_5回合_的中毒效果。
actors.hero.talent.lethal_surprise.title=致命惊喜
actors.hero.talent.lethal_surprise.desc=_+1:_ 用伏击击败一名敌人时，追猎者对视野内所有敌人造成1回合的_易伤_效果。\n\n_+2:_ 除获得+1的增益外，用伏击击败一名敌人时，追猎者对视野内所有敌人造成1回合的_麻痹_效果。\n\n_+3:_ 除获得+1，+2的增益外，用伏击击败一名敌人时，追猎者获得2回合的_时间气泡_效果。\n\n这个天赋有_5回合_的冷却时间。
actors.hero.talent.chain_clock.title=连携影遁
actors.hero.talent.chain_clock.desc=_+1:_ 伏击一名敌人时，追猎者获得_1回合_的隐身和极速效果。\n\n_+2:_ 伏击一名敌人时，追猎者获得_2回合_的隐身和极速效果。\n\n_+3:_ 伏击一名敌人时，追猎者获得_3回合_的隐身和极速效果。\n\n这个天赋有_10回合_的冷却时间。
actors.hero.talent.soul_collect.title=汲魂猎手
actors.hero.talent.soul_collect.desc=_+1:_ 用伏击击败一名敌人时，追猎者恢复_3点_生命。\n\n_+2:_ 用伏击击败一名敌人时，追猎者恢复_6点_生命。\n\n_+3:_ 用伏击击败一名敌人时，追猎者恢复_9点_生命。
actors.hero.talent.trail_tracking.title=步步紧逼
actors.hero.talent.trail_tracking.desc=_+1:_ 用伏击击败一名敌人时，追猎者获得_1回合_的灵视。\n\n_+2:_ 用伏击击败一名敌人时，追猎者获得_2回合_的灵视。\n\n_+3:_ 用伏击击败一名敌人时，追猎者获得_3回合_的灵视。
actors.hero.talent.master_of_cloaking.title=隐身行家
actors.hero.talent.master_of_cloaking.desc=_+1:_ 通过等待获得的隐身时长增加 _1回合_。\n\n_+2:_ 除获得+1的增益外，通过等待获得的隐身冷却减少_5回合_。\n\n_+3:_ 除获得+1，+2的增益外，每次伏击使追猎者专精与天赋的冷却减少_1回合_。

#huntress new talent
actors.hero.talent.water_friendly.title=亲水体质
actors.hero.talent.water_friendly.desc=_+1:_ 当女猎手站在水潭中时，攻击将造成_1点额外伤害_。\n\n_+2:_ 当女猎手站在水潭中时，攻击将造成_1-2点额外伤害_。
actors.hero.talent.added_meal.title=食效倍升
actors.hero.talent.added_meal.desc=_+1:_ 所有食物恢复的饥饿值_+15%_。\n\n_+2:_ 所有食物恢复的饥饿值_+25%_。

actors.hero.talent.kick.title=夺矢环踢
actors.hero.talent.kick.desc=_+1:_ 当狙击手对身上插有投掷武器的敌人进行近战攻击时，取回敌人身上的一件投掷武器并将其击退_1格_。\n\n_+2:_ 当狙击手对身上插有投掷武器的敌人进行近战攻击时，取回敌人身上的一件投掷武器并将其击退_2格_。\n\n_+3:_ 当狙击手对身上插有投掷武器的敌人进行近战攻击时，取回敌人身上的一件投掷武器并将其击退_3格_。\n\n这个天赋有10回合的冷却时间。
actors.hero.talent.shooting_eyes.title=正中牛眼
actors.hero.talent.shooting_eyes.desc=_+1:_ 初次用投掷武器击中一名敌人时，狙击手有_33%_的几率对其造成2回合的致盲效果。\n\n_+2:_ 初次用投掷武器击中一名敌人时，狙击手有_67%_的几率对其造成2回合的致盲效果。\n\n_+3:_ 初次用投掷武器击中一名敌人时，狙击手有_100%_的几率对其造成2回合的致盲效果。
actors.hero.talent.target_spotting.title=目标锁定
actors.hero.talent.target_spotting.desc=_+1:_ 狙击手对带有狙击标记的敌人的攻击_+10%额外伤害_。\n\n_+2:_ 狙击手对带有狙击标记的敌人的攻击_+20%额外伤害_。\n\n_+3:_ 狙击手对带有狙击标记的敌人的攻击_+30%额外伤害_。

actors.hero.talent.living_grass.title=勃勃生机
actors.hero.talent.living_grass.desc=_+1:_ 守望者扔出或种植的种子有_10%_的概率长出高草而非矮草。\n\n_+2:_ 守望者扔出或种植的种子有_20%_的概率长出高草而非矮草。\n\n_+3:_ 守望者扔出或种植的种子有_30%_的概率长出高草而非矮草。
actors.hero.talent.attraction.title=诱敌之矢
actors.hero.talent.attraction.desc=_+1:_ 当守望者射箭击中地面时，距离落点_1格_内且未在追踪的的敌人将向落点移动。\n\n_+2:_ 当守望者射箭击中地面时，距离落点_2格_内且未在追踪的的敌人将向落点移动。\n\n_+3:_ 当守望者射箭击中地面时，距离落点_3格_内且未在追踪的的敌人将向落点移动。
actors.hero.talent.healing_dew.title=灵愈甘露
actors.hero.talent.healing_dew.desc=_+1:_ 每颗露珠恢复的生命增加_1_点。\n\n_+2:_ 每颗露珠恢复的生命增加_2_点。\n\n_+3:_ 每颗露珠恢复的生命增加_3_点。

actors.hero.talent.swift_movement.title=敏捷身手
actors.hero.talent.swift_movement.desc=_+1:_ 超过10力量的每1点力量都使格斗家的闪避增加_1点_。\n\n_+2:_ 除获得+1的增益外，格斗家每次空手攻击未击中都有_20%_的概率获得闪避机动。\n\n_+3:_ 除获得+1，+2的增益外，格斗家每次闪避都会获得_1回合_的隐身效果。
actors.hero.talent.less_resist.title=无拘无束
actors.hero.talent.less_resist.desc=_+1:_ 每点超过护甲力量需求的力量都使格斗家的攻击速度_+5%_。\n\n_+2:_ 每点超过护甲力量需求的力量都使格斗家的攻击速度_+10%_。\n\n_+3:_ 每点超过护甲力量需求的力量都使格斗家的攻击速度_+15%_。
actors.hero.talent.ring_knuckle.title=戒箍指虎
actors.hero.talent.ring_knuckle.desc=_+1:_ 佩戴戒指时进行徒手攻击命中 戒指等级临时增加 _+1_，最高可提升至 _+1_。\n\n_+2:_ 在+1效果基础上 戒指强化效果持续时间增加 _+100%_，且戒指强化效果的最大等级提升至 _+2_。\n\n_+3:_ 在+2效果基础上 徒手攻击力将随佩戴戒指的_等级提升而增加_，且戒指强化效果的最大等级提升至 _+3_\n\n若装备为"武力戒指"时，此天赋不生效。
actors.hero.talent.mystical_punch.title=玄戒拳涌
actors.hero.talent.mystical_punch.desc=_+1:_ 徒手攻击敌人时 _33%_概率触发装备戒指的附加效果 。\n\n_+2:_ 徒手攻击敌人时 _67%_概率触发装备戒指的附加效果 。\n\n_+3:_ 徒手攻击敌人时 _100%_概率触发装备戒指的附加效果 。
actors.hero.talent.quick_step.title=猎犬步伐
actors.hero.talent.quick_step.desc=_+1:_ 徒手攻击后 _33%_概率可不消耗回合移动1格 。\n\n_+2:_ 徒手攻击后 _67%_概率可不消耗回合移动1格 。\n\n_+3:_ 徒手攻击后 _100%_概率可不消耗回合移动1格 。
actors.hero.talent.counter_attack.title=逸击反制
actors.hero.talent.counter_attack.desc=_+1:_ 成功闪避敌人攻击后 _20%_概率使下次徒手攻击不消耗回合。\n\n_+2:_ 成功闪避敌人攻击后 _40%_概率使下次徒手攻击不消耗回合。\n\n_+3:_ 成功闪避敌人攻击后 _60%_概率使下次徒手攻击不消耗回合。 

#duelist new talent
actors.hero.talent.skilled_hand.title=熟能生巧
actors.hero.talent.skilled_hand.desc=_+1:_ 使用武技攻击敌人时造成_2_点额外伤害 。\n\n_+2:_ 使用武技攻击敌人时造成_3_点额外伤害 。\n\n使用非攻击型武技将使下次近战攻击附带_2/3_点额外伤害。
actors.hero.talent.skilled_hand.meta_desc=_如果这个天赋被其他英雄获得_，那么它会使英雄在攻击时造成0-2/0-3点额外伤害。
actors.hero.talent.accumulation.title=武器蓄能
actors.hero.talent.accumulation.desc=_+1:_ 决斗家武技的最大充能_+1_。\n\n_+2:_ 决斗家武技的最大充能_+2_。
actors.hero.talent.accumulation.meta_desc=_如果这个天赋被其他英雄获得_，那么它会使英雄的自然恢复速度x1.1/x1.2。

actors.hero.talent.faster_charge.title=武勇聚能
actors.hero.talent.faster_charge.desc=_+1:_ 武器充能速度提升_8%_。\n\n_+2:_ 武器充能速度提升_17%_。\n\n_+3:_ 武器充能速度提升_25%_。
actors.hero.talent.quick_followup.title=速切疾斩
actors.hero.talent.quick_followup.desc=_+1:_ 切换武器后的首次近战攻击攻速提升_33%_。\n\n_+2:_ 切换武器后的首次近战攻击攻速提升_67%_。\n\n_+3:_ 切换武器后的首次近战攻击攻速提升_100%_。\n\n这个天赋有10回合的冷却时间。\n\n如果不攻击就再次切换武器，则攻速提升会被取消。
actors.hero.talent.twin_sword.title=双持专精
actors.hero.talent.twin_sword.desc=_+1:_ 装备两把同类武器会使_武器充能速度提升25%_。\n\n_+2:_ 除获得+1的增益外，装备两把同类武器会使_近战攻击同时触发两把武器的效果_。\n\n_+3:_ 除获得+1，+2的增益外，装备两把同类武器会使_攻速翻倍_。

actors.hero.talent.restored_energy.title=气沉丹田
actors.hero.talent.restored_energy.desc=_+1:_ 武僧每_100回合_获得1点内力。\n\n_+2:_ 武僧每_80回合_获得1点内力。\n\n_+3:_ 武僧每_67回合_获得1点内力。
actors.hero.talent.energy_barrier.title=金钟铁衫
actors.hero.talent.energy_barrier.desc=_+1:_ 武僧施展武功时，每消耗1点内力，获得_5_点护盾。\n\n_+2:_ 武僧施展武功时，每消耗1点内力，获得_7_点护盾。\n\n_+3:_ 武僧施展武功时，每消耗1点内力，获得_9_点护盾。
actors.hero.talent.harmony.title=天地人和
actors.hero.talent.harmony.desc=_+1:_ 如果武僧的生命与内力都不低于_100%_，她的移速与攻速都会增加50%。\n\n_+2:_ 如果武僧的生命与内力都不低于_80%_，她的移速与攻速都会增加50%。\n\n_+3:_ 如果武僧的生命与内力都不低于_60%_，她的移速与攻速都会增加50%。

actors.hero.talent.clam_steps.title=沉着上步
actors.hero.talent.clam_steps.desc=_+1:_ 冲刺所需武器充能减少_20%_。\n\n_+2:_ 冲刺所需武器充能减少_37%_。\n\n_+3:_ 冲刺所需武器充能减少_50%_。
actors.hero.talent.critical_momentum.title=会心飞刺
actors.hero.talent.critical_momentum.desc=_+1:_ 冲刺后紧接着的攻击伤害_+6%_。\n\n_+2:_ 冲刺后紧接着的攻击伤害_+11%_。\n\n_+3:_ 冲刺后紧接着的攻击伤害_+17%_。
actors.hero.talent.kinetic_movement.title=借势滑步
actors.hero.talent.kinetic_movement.desc=_+1:_ 冲刺后的_1回合_内，冲刺所需武器充能减少50%。\n\n_+2:_ 冲刺后的_2回合_内，冲刺所需武器充能减少50%。\n\n_+3:_ 冲刺后的_3回合_内，冲刺所需武器充能减少50%。
actors.hero.talent.aggressive_movement.title=凌厉续进
actors.hero.talent.aggressive_movement.desc=_+1:_ 使用武技后首次冲刺所需武器充能减少_50%_。\n\n_+2:_ 除获得+1的增益外，冲刺使邻近敌人受到_10%_武器伤害。\n\n_+3:_ 除获得+1,+2的增益外，冲刺使邻近敌人受到_3回合_的易伤效果。
actors.hero.talent.unencumbered_movement.title=轻装上阵
actors.hero.talent.unencumbered_movement.desc=_+1:_ 每点超过武器与护甲力量需求的力量都使击剑士的闪避增加_0.5_。\n\n_+2:_ 每点超过武器与护甲力量需求的力量都使击剑士的闪避增加_1_。\n\n_+3:_ 每点超过武器与护甲力量需求的力量都使击剑士的闪避增加_1.5_。
actors.hero.talent.soulize.title=移形换影
actors.hero.talent.soulize.desc=_+1:_ 最大冲刺距离增加_1格_。\n\n_+2:_ 除获得+1的增益外，冲刺能穿过敌人。\n\n_+3:_ 除获得+1，+2的增益外，冲刺能穿过坚固地形。

#universal new talent
actors.hero.talent.atk_speed_enhance.title=攻速提升
actors.hero.talent.atk_speed_enhance.desc=_+1:_ 攻击速度_+5%_。\n\n_+2:_ 攻击速度_+10%_。\n\n_+3:_ 攻击速度_+15%_。\n\n_+4:_ 攻击速度_+20%_。
actors.hero.talent.acc_enhance.title=精准提升
actors.hero.talent.acc_enhance.desc=_+1:_ 精准属性_+5%_。\n\n_+2:_ 精准属性_+10%_。\n\n_+3:_ 精准属性_+15%_。\n\n_+4:_ 精准属性_+20%_。
actors.hero.talent.eva_enhance.title=闪避提升
actors.hero.talent.eva_enhance.desc=_+1:_ 闪避属性_+5%_。\n\n_+2:_ 闪避属性_+10%_。\n\n_+3:_ 闪避属性_+15%_。\n\n_+4:_ 闪避属性_+20%_。
actors.hero.talent.better_choice.title=超值选择
actors.hero.talent.better_choice.desc=_+1:_ 获得1个_附魔符石_。\n\n_+2:_ 获得1张_注魔秘卷_。\n\n_+3:_ 获得1张_升级卷轴_。

#gunner talent
actors.hero.talent.reloading_meal.title=补给一餐
actors.hero.talent.reloading_meal.desc=_+1:_ 进餐时自动为当前装备枪械_装弹_，且不消耗子弹。\n\n_+2:_ 在+1效果基础上额外_多装填1发_弹药。
actors.hero.talent.gunners_intuition.title=枪手直觉
actors.hero.talent.gunners_intuition.desc=_+1:_ 枪械在装备时立即完成_鉴定_。\n\n_+2:_ 枪械在拾取时立即得知_是否被诅咒_。
actors.hero.talent.speedy_move.title=快速转移
actors.hero.talent.speedy_move.desc=_+1:_ 初次攻击一名敌人后，枪手可以瞬间移动_2回合_。\n\n_+2:_ 初次攻击一名敌人后，枪手可以瞬间移动_3回合_。
actors.hero.talent.safe_reload.title=安全装填
actors.hero.talent.safe_reload.desc=_+1:_ 装填时获得_3点护盾_。\n\n_+2:_ 装填时获得_5点护盾_。
actors.hero.talent.close_combat.title=枪托搏斗
actors.hero.talent.close_combat.desc=_+1:_ 枪械近战伤害增加_0-2_。\n\n_+2:_ 枪械近战伤害增加_0-4_。

actors.hero.talent.infinite_bullet_meal.title=激战一餐
actors.hero.talent.infinite_bullet_meal.desc=_+1:_ 枪手进食只花费1回合，并获得_2回合_的无限弹药。\n\n_+2:_ 枪手进食只花费1回合，并获得_3回合_的无限弹药。
actors.hero.talent.inscribed_bullet.title=卷藏弹药
actors.hero.talent.inscribed_bullet.desc=_+1:_ 当枪手阅读卷轴时可获得_5_发弹药 。\n\n_+2:_ 当枪手阅读卷轴时可获得_10_发弹药 。\n\n如果使用的是升级卷轴、嬗变卷轴或须用前述卷轴为炼制的炼金物品时，子弹获取量会翻倍。\n\n对于产量较高的炼金术物品（如大多数结晶），该天赋会根据成果数量来改变子弹获取量。
actors.hero.talent.mind_vision.title=全神洞察
actors.hero.talent.mind_vision.desc=_+1:_ 每移动1格有_1%_概率获得1回合灵视。\n\n_+2:_ 每移动1格有_2%_概率获得1回合灵视。 
actors.hero.talent.camouflage.title=丛林迷彩
actors.hero.talent.camouflage.desc=_+1:_ 踩踏高草丛时获得_2回合_隐身状态 。\n\n_+2:_ 踩踏高草丛时获得_3回合_隐身状态 。
actors.hero.talent.larger_magazine.title=扩容弹匣
actors.hero.talent.larger_magazine.desc=_+1:_ 枪械最大弹容量增加 _1发_。\n\n_+2:_ 枪械最大弹容量增加 _2发_。
actors.hero.talent.bullet_collect.title=探囊取弹
actors.hero.talent.bullet_collect.desc=_+1:_ 近战攻击有_5%_几率装填一发子弹到已装备枪械中。\n\n_+2:_ 近战攻击有_10%_几率装填一发子弹到已装备枪械中。\n\n以此法装填的弹药可超过弹药上限1发。

actors.hero.talent.street_battle.title=巷战穿透
actors.hero.talent.street_battle.desc=_+1:_ 子弹可射穿_1格_坚固地形。\n\n_+2:_ 子弹可射穿_2格_坚固地形。\n\n_+3:_ 子弹可射穿_3格_坚固地形。
actors.hero.talent.fast_reload.title=装填熟手
actors.hero.talent.fast_reload.desc=_+1:_ 装填耗时减少_1回合_。\n\n_+2:_ 装填耗时减少_2回合_。\n\n_+3:_ 装填耗时减少_3回合_。\n\n这个天赋不会将装填耗时减少到0回合以下。

actors.hero.talent.rolling.title=翻滚上弹
actors.hero.talent.rolling.desc=_+1:_ 在射击后的_1回合_内移动能为已装备的枪械装填1发子弹。\n\n_+2:_ 在射击后的_2回合_内移动能为已装备的枪械装填1发子弹。\n\n_+3:_ 在射击后的_3回合_内移动能为已装备的枪械装填1发子弹。\n\n若身上并无弹药，则此天赋不会触发。
actors.hero.talent.perfect_focusing.title=死神之眼
actors.hero.talent.perfect_focusing.desc=_+1:_ 死亡轮盘的持续时间增加 _33%_。\n\n_+2:_ 死亡轮盘的持续时间增加 _67%_。\n\n_+3:_ 死亡轮盘的持续时间增加 _100%_。
actors.hero.talent.honorable_shot.title=处决射击
actors.hero.talent.honorable_shot.desc=_+1:_ 当死亡轮盘叠加3层以上时，闪避敌人攻击后发射的子弹将斩杀生命值低于_13%_的敌人。\n\n_+2:_ 当死亡轮盘叠加3层以上时，闪避敌人攻击后发射的子弹将斩杀生命值低于_27%_的敌人。\n\n_+3:_ 当死亡轮盘叠加3层以上时，闪避敌人攻击后发射的子弹将斩杀生命值低于_40%_的敌人 。\n\n强力的敌人可抵抗此效果
actors.hero.talent.bullet_time.title=子弹时间
actors.hero.talent.bullet_time.desc=_+1:_ 通过死亡轮盘秒杀敌人时，使视野内所有敌人减速_4回合_。\n\n_+2:_ 通过死亡轮盘秒杀敌人时，使视野内所有敌人减速_8回合_。\n\n_+3:_ 通过死亡轮盘秒杀敌人时，使视野内所有敌人减速_12回合_。
actors.hero.talent.inevitable_death.title=午时已到
actors.hero.talent.inevitable_death.desc=_+1:_ 当死亡轮盘叠加6层时，下次物理攻击获得_2倍_命中率。\n\n_+2:_ 当死亡轮盘叠加6层时，下次物理攻击获得_3倍_命中率。\n\n_+3:_ 当死亡轮盘叠加6层时，下次物理攻击获得_4倍_命中率。
actors.hero.talent.headshot.title=颅骨公证
actors.hero.talent.headshot.desc=_+1:_ 子弹有 _1%_ 概率秒杀敌人。\n\n_+2:_ 子弹有 _2%_ 概率秒杀敌人。\n\n_+3:_ 子弹有 _3%_ 概率秒杀敌人。\n\n强力敌人可抵抗此效果

actors.hero.talent.quick_reload.title=移动装填
actors.hero.talent.quick_reload.desc=_+1:_ 移动时 _3%_ 概率为装备着的枪械装填1发弹药。\n\n_+2:_ 移动时 _6%_ 概率为装备着的枪械装填1发弹药。\n\n_+3:_ 移动时 _9%_ 概率为装备着的枪械装填1发弹药。\n\n持有的弹药不足时不会触发。
actors.hero.talent.moving_shot.title=精准奔袭
actors.hero.talent.moving_shot.desc=_+1:_ 移动后远程攻击命中率惩罚减少 _17%_。\n\n_+2:_ 移动后远程攻击命中率惩罚减少 _33%_。\n\n_+3:_ 移动后远程攻击命中率惩罚减少 _50%_。
actors.hero.talent.elemental_bullet.title=元素弹药
actors.hero.talent.elemental_bullet.desc=_+1:_ 当枪械弹药耗尽重新装填时，17%概率装填可冻结敌人的_极冻弹_。\n_+2:_ 当枪械弹药耗尽重新装填时，17%概率装填可燃烧敌人的_爆炎弹_。\n_+3:_ 当枪械弹药耗尽重新装填时，17%概率装填可击晕敌人的_电击弹_。\n\n各概率效果不叠加。
actors.hero.talent.improvisation.title=随机应变
actors.hero.talent.improvisation.desc=_+1:_ 弹匣全部耗尽时获得 _8_ 点护盾。\n\n_+2:_ 弹匣全部耗尽时获得 _16_ 点护盾。\n\n_+3:_ 弹匣全部耗尽时获得 _24_ 点护盾。
actors.hero.talent.soul_bullet.title=歼敌补给
actors.hero.talent.soul_bullet.desc=_+1:_ 击杀敌人后获得 _1回合_ 无限弹药。\n\n_+2:_ 击杀敌人后获得 _2回合_ 无限弹药。\n\n_+3:_ 击杀敌人后获得 _3回合_ 无限弹药。
actors.hero.talent.light_movement.title=轻载行军
actors.hero.talent.light_movement.desc=_+1:_ 每超出护甲力量需求 _3_ 点力量，移动速度增加5%。\n\n_+2:_ 每超出护甲力量需求 _2_ 点力量，移动速度增加5%。\n\n_+3:_ 每超出护甲力量需求 _1_ 点力量，移动速度增加5%。

actors.hero.talent.stealth_master.title=影刃行动
actors.hero.talent.stealth_master.desc=_+1:_ 射击时_不会产生噪音_。\n\n_+2:_ 在+1效果基础上，_即使敌人在附近也能保持隐蔽_。\n\n_+3:_ 在+2效果基础上，隐蔽期间_不消耗饥饿值_。
actors.hero.talent.skillful_runner.title=幽灵突袭
actors.hero.talent.skillful_runner.desc=_+1:_ 隐蔽解除时获得 _2回合_ 迅捷状态。\n\n_+2:_ 隐蔽解除时获得 _4回合_ 迅捷状态 。\n\n_+3:_ 隐蔽解除时获得 _6回合_ 迅捷状态 。\n\n该天赋有30回合冷却时间。
actors.hero.talent.stealth.title=隐蔽行动
actors.hero.talent.stealth.desc=_+1:_ 被敌人发现的概率降低 _1级_。\n\n_+2:_ 被敌人发现的概率降低 _2级_。\n\n_+3:_ 被敌人发现的概率降低 _3级_。
actors.hero.talent.into_the_shadow.title=影子战术
actors.hero.talent.into_the_shadow.desc=_+1:_ 进行隐蔽时，获得_3回合_隐身效果而非普通隐蔽。\n\n_+2:_ 进行隐蔽时，获得_6回合_隐身效果而非普通隐蔽。\n\n_+3:_ 进行隐蔽时，获得_9回合_隐身效果而非普通隐蔽。\n\n此天赋有15回合冷却时间。
actors.hero.talent.ranged_sniping.title=超距穿刺
actors.hero.talent.ranged_sniping.desc=_+1:_ 与敌人每间隔1格，子弹伤害提升 _2.5%_。\n\n_+2:_ 与敌人每间隔1格，子弹伤害提升 _5%_。\n\n_+3:_ 与敌人每间隔1格，子弹伤害提升 _7.5%_。\n\n伤害加成上限为+150%。
actors.hero.talent.telescope.title=鹰眼系统
actors.hero.talent.telescope.desc=_+1:_ 视野范围扩大 _25%_。\n\n_+2:_ 视野范围扩大 _50%_。\n\n_+3:_ 视野范围扩大 _75%_。

actors.hero.talent.haste_move.title=冲锋射击
actors.hero.talent.haste_move.desc=_+1:_ 压制扫射期间移动速度提升 _+25%_。\n\n_+2:_ 压制扫射期间移动速度提升 _+50%_。\n\n_+3:_ 压制扫射期间移动速度提升 _+75%_。\n\n_+4:_ 压制扫射期间移动速度提升 _+100%_。
actors.hero.talent.shot_concentration.title=枪林弹雨
actors.hero.talent.shot_concentration.desc=_+1:_ 子弹命中时有_25%_概率使扫射时间延长1回合。\n\n_+2:_ 子弹命中时有_50%_概率使扫射时间延长1回合。\n\n_+3:_ 子弹命中时有_75%_概率使扫射时间延长1回合。\n\n_+4:_ 子弹命中时有_100%_概率使扫射时间延长1回合。\n\n压制扫射最大可延长+10回合。
actors.hero.talent.round_preserve.title=余弹管理
actors.hero.talent.round_preserve.desc=_+1:_ 扫射期间开枪有_10%_概率不消耗弹药。\n\n_+2:_ 扫射期间开枪有_20%_概率不消耗弹药。\n\n_+3:_ 扫射期间开枪有_30%_概率不消耗弹药。\n\n_+4:_ 扫射期间开枪有_40%_概率不消耗弹药。

actors.hero.talent.bayonet.title=合金刺刀
actors.hero.talent.bayonet.desc=_+1:_ 碳纤背心激活期间，近战攻击对敌人造成_5回合_的流血效果。\n\n_+2:_ 碳纤背心激活期间，近战攻击对敌人造成_6回合_的流血效果。\n\n_+3:_ 碳纤背心激活期间，近战攻击对敌人造成_7回合_的流血效果。\n\n_+4:_ 碳纤背心激活期间，近战攻击对敌人造成_8回合_的流血效果。
actors.hero.talent.tactical_sight.title=战术视野
actors.hero.talent.tactical_sight.desc=_+1:_ 碳纤背心激活期间，对_2格_内所有敌人获得灵视效果。\n\n_+2:_ 碳纤背心激活期间，对_3格_内所有敌人获得灵视效果。\n\n_+3:_ 碳纤背心激活期间，对_4格_内所有敌人获得灵视效果。\n\n_+4:_ 碳纤背心激活期间，对_5格_内所有敌人获得灵视效果。
actors.hero.talent.plate_add.title=防弹插板
actors.hero.talent.plate_add.desc=_+1:_ 碳纤背心激活期间，枪手的移速减少_13%_，但防御增加_10-25。_\n\n_+2:_ 碳纤背心激活期间，枪手的移速减少_25%_，但防御增加_15-30。_\n\n_+3:_ 碳纤背心激活期间，枪手的移速减少_38%_，但防御增加_20-35。_\n\n_+4:_ 碳纤背心激活期间，枪手的移速减少_50%_，但防御增加_25-40。_

actors.hero.talent.additional_meds.title=超额药量
actors.hero.talent.additional_meds.desc=_+1:_ 急救套件的总治疗量增加_25_。\n\n_+2:_ 急救套件的总治疗量增加_30_。\n\n_+3:_ 急救套件的总治疗量增加_35_。\n\n_+4:_ 急救套件的总治疗量增加_40_。
actors.hero.talent.therapeutic_bandage.title=复合绷带
actors.hero.talent.therapeutic_bandage.desc=_+1:_ 急救套件能消除_恍惚_与_虚弱_。\n\n_+2:_ 急救套件能消除_迟缓_与_易伤_。\n\n_+3:_ 急救套件能消除_残废_与_失明_。\n\n_+4:_ 急救套件能消除_中毒_与_流血_。
actors.hero.talent.faster_healing.title=紧急治疗
actors.hero.talent.faster_healing.desc=_+1:_ 急救套件的单回合治疗量增加_2点_。\n\n_+2:_ 急救套件的单回合治疗量增加_3点_。\n\n_+3:_ 急救套件的单回合治疗量增加_4点_。\n\n_+4:_ 急救套件的单回合治疗量增加_5点_。

actors.hero.talent.basic_practice.title=基础训练
actors.hero.talent.basic_practice.desc=_+1:_ 物理攻击暴击率_+2%_。\n\n_+2:_ 物理攻击暴击率_+4%_。
actors.hero.talent.masters_intuition.title=宗师直觉
actors.hero.talent.masters_intuition.desc=_+1:_ 武士能在装备非枪械武器时将其直接鉴定。\n\n_+2:_ 武士能在捡起非枪械武器时确定其是否被诅咒。
actors.hero.talent.drawing_enhance.title=熟练纳刀
actors.hero.talent.drawing_enhance.desc=_+1:_ 纳刀攻击额外造成_2点_伤害。\n\n_+2:_ 纳刀攻击额外造成_3点_伤害。
actors.hero.talent.drawing_enhance.meta_desc=_如果这个天赋被其他英雄获得_，则它使英雄首次攻击敌人时额外造成_+1-2/+2_点伤害。
actors.hero.talent.parring.title=格反架势
actors.hero.talent.parring.desc=_+1:_ 护甲值增加_0-2_。\n\n_+2:_ 护甲值增加_0-3_。
actors.hero.talent.adrenaline_surge.title=激素狂飙
actors.hero.talent.adrenaline_surge.desc=_+1:_ 击败敌人可获得_3回合_的激素涌动效果。\n\n_+2:_ 击败敌人可获得_5回合_的激素涌动效果。

actors.hero.talent.critical_meal.title=见红一餐
actors.hero.talent.critical_meal.desc=_+1:_ 武士进食只花费1回合，且接下来的_首次物理攻击_暴击率+100%。\n\n_+2:_武士进食只花费1回合，且接下来的_2次物理攻击_暴击率+100%。
actors.hero.talent.inscribed_lethality.title=卷藏锋锐
actors.hero.talent.inscribed_lethality.desc=_+1:_ 当武士阅读卷轴或使用法术结晶后，他接下来的_首次物理攻击_暴击率+100%。\n\n_+2:_ 当武士阅读卷轴或使用法术结晶后，他接下来的_2次物理攻击_暴击率+100%。\n\n如果使用的是升级卷轴、嬗变卷轴或须用前述卷轴炼制的炼金物品，则获得暴击加成的攻击次数翻倍。\n\n对产量较高的炼金物品（如大多数结晶），这项天赋会基于该物品的单次产出数量概率触发。
actors.hero.talent.unexpected_slash.title=意外斩击
actors.hero.talent.unexpected_slash.desc=_+1:_ 纳刀时暴击概率增加_+10%_。\n\n_+2:_ 纳刀时暴击概率增加_+20%_。
actors.hero.talent.dragons_eye.title=龙瞳探敌
actors.hero.talent.dragons_eye.desc=_+1:_ 纳刀时，获得对周围_3格_内所有敌人的灵视效果。\n\n_+2:_ 纳刀时，获得对周围_4格_内所有敌人的灵视效果。
actors.hero.talent.dragons_eye.meta_desc=_其他职业获取此天赋时:_改为获得周围2/3格内所有敌人的灵视效果。
actors.hero.talent.weapon_mastery.title=武器大师
actors.hero.talent.weapon_mastery.desc=_+1:_ 力量每超过武器需求1点，该武器获得_+0.5%_额外暴击率。\n\n_+2:_ 力量每超过武器需求1点，该武器获得_+1%_额外暴击率。
actors.hero.talent.critical_throw.title=致命投掷
actors.hero.talent.critical_throw.desc=_+1:_ 投掷武器与弹药的暴击率提升_+13%_。\n\n_+2:_ 投掷武器与弹药的暴击率提升_+25%_。

actors.hero.talent.quick_sheathing.title=顺斩纳刀
actors.hero.talent.quick_sheathing.desc=_+1:_ 拔刀攻击击杀敌人时，有_33%_概率立即收刀。\n\n_+2:_ 拔刀攻击击杀敌人时，有_67%_概率立即收刀。\n\n_+3:_ 拔刀攻击击杀敌人时，有_100%_概率立即收刀。
actors.hero.talent.quick_sheathing.meta_desc=_其他职业获取此天赋时:_改为击杀敌人后获得3/6/9回合的极速状态。
actors.hero.talent.lethal_power.title=致命力量
actors.hero.talent.lethal_power.desc=_+1:_ 暴击伤害提升_+5%_。\n\n_+2:_ 暴击伤害提升_+10%_。\n\n_+3:_ 暴击伤害提升_+15%_。

actors.hero.talent.mind_focusing.title=剑心凝神
actors.hero.talent.mind_focusing.desc=_+1:_ 获得的剑气能量增加_33%_。\n\n_+2:_ 获得的剑气能量增加_67%_。\n\n_+3:_ 获得的剑气能量增加_100%_。
actors.hero.talent.stored_power.title=剑气凌霄
actors.hero.talent.stored_power.desc=_+1:_ 可储存的最大剑气能量提升_50%_。\n\n_+2:_ 可储存的最大剑气能量提升_100%_。\n\n_+3:_ 可储存的最大剑气能量提升_150%_。
actors.hero.talent.arcane_power.title=玄天剑炁
actors.hero.talent.arcane_power.desc=_+1:_ 被剑气击中的敌人有_33%_概率触发装备武器的附魔效果。\n\n_+2:_ 被剑气击中的敌人有_67%_概率触发装备武器的附魔效果。\n\n_+3:_ 被剑气击中的敌人有_100%_概率触发装备武器的附魔效果。\n\n若武器附有索敌附魔，剑气可贯穿墙壁。
actors.hero.talent.energy_collect.title=剑气回元
actors.hero.talent.energy_collect.desc=_+1:_ 将造成剑气伤害的_13%_转化为剑气能量储存。\n\n_+2:_ 将造成剑气伤害的_20%_转化为剑气能量储存。\n\n_+3:_ 将造成剑气伤害的_25%_转化为剑气能量储存。
actors.hero.talent.energy_saving.title=敛气藏锋
actors.hero.talent.energy_saving.desc=_+1:_ 使用剑气时仅消耗储存剑气能量的_80%_。\n\n_+2:_ 使用剑气时仅消耗储存剑气能量的_70%_。\n\n_+3:_ 使用剑气时仅消耗储存剑气能量的_60%_。\n\n剑气仍造成当前能量值的全额伤害
actors.hero.talent.wind_blast.title=风裂剑罡
actors.hero.talent.wind_blast.desc=_+1:_ 纳刀时使用剑气，将造成额外_5_点魔法伤害。\n\n_+2:_ 纳刀时使用剑气，将造成额外_10_点魔法伤害。\n\n_+3:_ 纳刀时使用剑气，将造成额外_15_点魔法伤害。

actors.hero.talent.enhanced_crit.title=看破要害
actors.hero.talent.enhanced_crit.desc=_+1:_ 一闪的暴击概率_x1.6_。\n\n_+2:_ 一闪的暴击概率_x1.75_。\n\n_+3:_ 一闪的暴击概率_x2_。
actors.hero.talent.powerful_slash.title=心如止水
actors.hero.talent.powerful_slash.desc=_+1:_ 一闪触发暴击时，伤害量提升_15%_。\n\n_+2:_ 一闪触发暴击时，伤害量提升_30%_。\n\n_+3:_ 一闪触发暴击时，伤害量提升_45%_。
actors.hero.talent.static_preparation.title=静极思动
actors.hero.talent.static_preparation.desc=_+1:_ 一闪的冷却时间减少_17%_。\n\n_+2:_ 一闪的冷却时间减少_33%_。\n\n_+3:_ 一闪的冷却时间减少_50%_。
actors.hero.talent.acceleration.title=燕翎叠锋
actors.hero.talent.acceleration.desc=_+1:_ 燕返闪每次命中时，攻击力+5%，最高可叠加至 _25%_。\n\n_+2:_ 燕返闪每次命中时，攻击力+5%，最高可叠加至 _50%_。\n\n_+3:_ 燕返闪每次命中时，攻击力+5%，最高可叠加至 _75%_。\n\n加成随时间推移或触发冷却时清零。
actors.hero.talent.inner_eye.title=心斋坐忘
actors.hero.talent.inner_eye.desc=_+1:_ 燕返闪命中后，获得周围 _3格_ 所有敌人的灵视效果2回合。\n\n_+2:_ 燕返闪命中后，获得周围 _6格_ 所有敌人的灵视效果2回合。\n\n_+3:_ 燕返闪命中后，获得周围 _9格_ 所有敌人的灵视效果2回合。
actors.hero.talent.dynamic_preparation.title=归燕疾驰
actors.hero.talent.dynamic_preparation.desc=_+1:_ 燕返闪的冷却时间减少 _10%_。\n\n_+2:_ 燕返闪的冷却时间减少 _20%_。\n\n_+3:_ 燕返闪的冷却时间减少 _30%_。

actors.hero.talent.faster_than_light.title=超越光速
actors.hero.talent.faster_than_light.desc=_+1:_ 鬼人化时获得 _1回合_ 的闪避机动。\n\n_+2:_ 鬼人化时获得 _2回合_ 的闪避机动。\n\n_+3:_ 鬼人化时获得 _3回合_ 的闪避机动。
actors.hero.talent.afterimage.title=流光残影
actors.hero.talent.afterimage.desc=_+1:_ 鬼人化期间，每超过护甲力量一点便 _+1 点闪避_。\n\n_+2:_ 鬼人化期间，每超过护甲力量一点便 _+2 点闪避_。\n\n_+3:_ 鬼人化期间，每超过护甲力量一点便 _+3 点闪避_。
actors.hero.talent.quick_recover.title=耐回急复
actors.hero.talent.quick_recover.desc=_+1:_ 鬼人化的冷却时间减少_20%_。\n\n_+2:_ 鬼人化的冷却时间减少_40%_。\n\n_+3:_ 鬼人化的冷却时间减少_60%_。
actors.hero.talent.haste_evasion.title=鬼人闪身
actors.hero.talent.haste_evasion.desc=_+1:_ 鬼人化期间闪避获得 _2回合_ 的极速效果。\n\n_+2:_ 鬼人化期间闪避获得 _3回合_ 的极速效果。\n\n_+3:_ 鬼人化期间闪避获得 _4回合_ 的极速效果。
actors.hero.talent.accelerated_lethality.title=超速会心
actors.hero.talent.accelerated_lethality.desc=_+1:_ 鬼人化期间，暴击率提升_+10%_。\n\n_+2:_ 鬼人化期间，暴击率提升_+20%_。\n\n_+3:_ 鬼人化期间，暴击率提升_+30%_。
actors.hero.talent.stable_barrier.title=快斩汲能
actors.hero.talent.stable_barrier.desc=_+1:_ 鬼人化期间，暴击时获得1点护盾，_最多可获得最大生命值的20%_。\n\n_+2:_ 鬼人化期间，暴击时获得1点护盾，_最多可获得最大生命值的40%_。\n\n_+3:_ 鬼人化期间，暴击时获得1点护盾，_最多可获得最大生命值的60%_。

actors.hero.talent.kunai_of_doom.title=死亡苦无
actors.hero.talent.kunai_of_doom.desc=_+1:_ 苦无有_5%_概率使命中的敌人定命。\n\n_+2:_ 苦无有_10%_概率使命中的敌人定命。\n\n_+3:_ 苦无有_15%_概率使命中的敌人定命。\n\n_+4:_ 苦无有_20%_概率使命中的敌人定命。
actors.hero.talent.mystical_kunai.title=神秘苦无
actors.hero.talent.mystical_kunai.desc=_+1:_ 苦无命中率提升_25%_，且对命中目标获得持续 _5回合_ 的灵视效果。\n\n_+2:_ 苦无命中率提升_50%_，且对命中目标获得持续 _10回合_ 的灵视效果。\n\n_+3:_ 苦无命中率提升_75%_，且对命中目标获得持续 _15回合_ 的灵视效果。\n\n_+4:_ 苦无命中率提升_100%_，且对命中目标获得持续 _20回合_ 的灵视效果。
actors.hero.talent.corrosive_kunai.title=酸蚀苦无
actors.hero.talent.corrosive_kunai.desc=_+1:_ 被苦无命中的敌人将受到基础5点的酸蚀伤害，持续_2回合_。\n\n_+2:_ 被苦无命中的敌人将受到基础5点的酸蚀伤害，持续_4回合_。\n\n_+3:_ 被苦无命中的敌人将受到基础5点的酸蚀伤害，持续_6回合_。\n\n_+4:_ 被苦无命中的敌人将受到基础5点的酸蚀伤害，持续_8回合_。\n\n强力敌人可能会抵抗此效果。

actors.hero.talent.double_blade_practice.title=双刃逐影
actors.hero.talent.double_blade_practice.desc=_+1:_ 手持影刃时攻击速度额外提升_+5%_。\n\n_+2:_ 手持影刃时攻击速度额外提升_+10%_。\n\n_+3:_ 手持影刃时攻击速度额外提升_+15%_。\n\n_+4:_ 手持影刃时攻击速度额外提升_+20%_。
actors.hero.talent.critical_shadow.title=致命阴影
actors.hero.talent.critical_shadow.desc=_+1:_ 攻击穿透防御的伤害值增加 _0-5_ 点伤害。\n\n_+2:_ 攻击穿透防御的伤害值增加 _0-10_ 点伤害。\n\n_+3:_ 攻击穿透防御的伤害值增加 _0-15_ 点伤害。\n\n_+4:_ 攻击穿透防御的伤害值增加 _0-20_ 点伤害。
actors.hero.talent.herbal_shadow.title=暗影之愈
actors.hero.talent.herbal_shadow.desc=_+1:_ 攻击穿透防御时，恢复_1_点生命值。 \n\n_+2:_ 攻击穿透防御时，恢复_2_点生命值。 \n\n_+3:_ 攻击穿透防御时，恢复_3_点生命值。 \n\n_+4:_ 攻击穿透防御时，恢复_4_点生命值。 

actors.hero.talent.awake_limit.title=极限觉醒
actors.hero.talent.awake_limit.desc=_+1:_ 造成和受到物理伤害提升至_1.4倍_。\n\n_+2:_ 造成和受到物理伤害提升至_1.6倍_。\n\n_+3:_ 造成和受到物理伤害提升至_1.8倍_。\n\n_+4:_ 造成和受到物理伤害提升至_2.0倍_。
actors.hero.talent.awake_duration.title=持续觉醒
actors.hero.talent.awake_duration.desc=_+1:_ 觉醒状态的持续时间延长至_15回合_。\n\n_+2:_ 觉醒状态的持续时间延长至_20回合_。\n\n_+3:_ 觉醒状态的持续时间延长至_25回合_。\n\n_+4:_ 觉醒状态的持续时间延长至_30回合_。
actors.hero.talent.insurance.title=安全觉醒
actors.hero.talent.insurance.desc=_+1:_ 觉醒触发时，获得_10_点护盾。 \n\n_+2:_ 觉醒触发时，获得_20_点护盾。 \n\n_+3:_ 觉醒触发时，获得_30_点护盾。 \n\n_+4:_ 觉醒触发时，获得_40_点护盾。 

###v3.3.0
actors.hero.heroclass.adventurer=探险家
actors.hero.heroclass.adventurer_desc_short=探险家不会践踏高草。
actors.hero.heroclass.adventurer_desc=探险家可以使用砍刀_砍掉周围的草_并将其用作绳索。\n\n探险者_不践踏_高草。\n\n探险家初始拥有_探险家的铲子_、3块投石、布甲、水袋与绒布包。\n\n探险家开局鉴定的物品有:\n_-_ 鉴定卷轴\n_-_ 净化药剂\n_-_ 探地卷轴
actors.hero.heroclass.adventurer_unlock=_触发植物交互10次_解锁探险家。

actors.hero.herosubclass.engineer=工程师
actors.hero.herosubclass.engineer_short_desc=_工程师_ 是建筑专家，可以破坏或建造木质路障和地板，还能通过天赋解锁多种建筑。
actors.hero.herosubclass.engineer_desc=工程师可以使用藤蔓绳索建造多种建筑。通过天赋可以增加新的建筑种类。\n\n工程师行动消耗2回合时间和6回合饥饿值，当持有镐子或采矿工具时，时间和饥饿值消耗减半。
actors.hero.herosubclass.explorer=探索者
actors.hero.herosubclass.explorer_short_desc=_探索者_ 是环境探索的专家，可以使用藤蔓绳索攻击更远距离的目标。
actors.hero.herosubclass.explorer_desc=_探索者_当背包中持有藤蔓绳索时，每拥有1根藤蔓绳索可增加1格近战攻击范围，攻击时将消耗等同于超出原始攻击范围格数的藤蔓绳索。
actors.hero.herosubclass.researcher=研究员
actors.hero.herosubclass.researcher_short_desc=_研究员_对植物有着相当权威地研究，他可以从植物获得额外效果，并在攻击时概率对敌人施加腐蚀淤泥。
actors.hero.herosubclass.researcher_desc=作为植物功能强化研究权威的研究员，在踩踏植物时可获得额外效果，使用物理攻击敌人时有一定概率向该敌人施加5回合的腐蚀淤泥。

actors.buffs.build.action_name=建造
actors.buffs.build.cant_edge=该区域地形不可更改。
actors.buffs.build.invalid=无法那样做。
actors.buffs.build.cant_build=只能选择相邻位置的地点。
actors.buffs.build.cannot_mine=该位置的地板无法被移除。
actors.buffs.build.prompt=选择建造位置
actors.buffs.build.cant_regular=此楼层的地形无法更改。
actors.buffs.build$building.wall.name=木质路障
actors.buffs.build$building.wall.desc=_木质路障_可用来阻碍移动并阻挡视线。
actors.buffs.build$building.floor.name=地板
actors.buffs.build$building.floor.desc=通过拆除_地板_可以制造悬崖，或通过建造地板来跨越悬崖。制造悬崖时需要消耗额外的回合数和饥饿值。
actors.buffs.build$building.barricade.name=沙障
actors.buffs.build$building.barricade.desc=可以建造_沙障_来阻碍移动。可立即拆除。
actors.buffs.build$building.wire.name=钢丝陷阱
actors.buffs.build$building.wire.desc=可以设置_钢丝陷阱_来阻碍经过敌人的移动并造成出血伤害。
actors.buffs.build$building.watchtower.name=瞭望塔
actors.buffs.build$building.watchtower.desc=可以建造_瞭望塔_来获取周围视野并吸引敌人注意。可立即拆除。
actors.buffs.build$building.cannon.name=加农炮
actors.buffs.build$building.cannon.desc=可以部署_加农炮_来发射强力炮击。
actors.buffs.build$building.machinegun.name=机枪塔
actors.buffs.build$building.machinegun.desc=可以设置_机枪塔_来自动攻击周围的敌人。
actors.buffs.build$building.mortar.name=迫击炮
actors.buffs.build$building.mortar.desc=可以部署_迫击炮_来攻击障碍物另一侧的敌人。

actors.mobs.npcs.building.barricade.name=沙袋路障
actors.mobs.npcs.building.barricade.desc=这是用沙袋制作的障碍物。沙障设立的地方无法通行，敌人会尽可能优先最后攻击沙障。机枪塔的子弹可以穿透该障碍物。

actors.mobs.npcs.building.watchtower.name=瞭望塔
actors.mobs.npcs.building.watchtower.desc=这是为了监视周边而建立的瞭望塔。在瞭望塔存在期间，它会持续为你提供周围的视野，但如果敌人发现瞭望塔，会优先对其进行攻击。

actors.mobs.npcs.building.cannon.name=加农炮
actors.mobs.npcs.building.cannon.desc=这是可部署发射的火炮。使用弹药可以向指定位置发射威力极强的炮弹。\n\n野战炮发射的炮弹会爆炸，并破坏周围的地形和物品。
actors.mobs.npcs.building.cannon.no_bullet=没有足够的弹药来发射加农炮。

actors.mobs.npcs.building.machinegun.name=机枪塔
actors.mobs.npcs.building.machinegun.desc=这是自动射击视野内目标的机枪塔。可以发射穿透攻击路径上的角色或障碍物的子弹。

actors.mobs.npcs.building.mortar.name=迫击炮
actors.mobs.npcs.building.mortar.desc=这是可部署发射的迫击炮。使用弹药可以向指定位置投掷必定到达的炸弹。\n\n迫击炮发射的炸弹会爆炸，并破坏周围的地形和物品。
actors.mobs.npcs.building.mortar.no_bullet=没有足够的弹药来发射迫击炮

actors.mobs.npcs.building.building.dismiss_title=是否要拆除该建筑？
actors.mobs.npcs.building.building.dismiss_body=当您认为不再需要维持该建筑时，可以将其拆除。此操作将立即摧毁建筑。\n\n确定要拆除建筑吗？
actors.mobs.npcs.building.building.dismiss_confirm=是
actors.mobs.npcs.building.building.dismiss_cancel=否

actors.hero.talent.harvest_berry.title=浆果采集
actors.hero.talent.harvest_berry.desc=_+1:_ 探险家在探索后续几层地牢时，砍伐长草或穿越草丛时可以发现_4个浆果_。\n\n_+2:_ 探险家在探索后续几层地牢时，砍伐长草或穿越草丛时可以发现_6个浆果_。
actors.hero.talent.safe_potion.title=安心饮用
actors.hero.talent.safe_potion.desc=_+1:_ 饮用_未鉴定药剂_时，获得3回合的净化护盾。\n\n_+2:_ 在+1效果基础上，饮用_危险药剂_时额外获得3回合的净化护盾。\n\n投掷药剂时不会触发此天赋。
actors.hero.talent.root.title=根蔓束缚
actors.hero.talent.root.desc=_+1:_ 当敌人位置生长出植物时，束缚该敌人_2回合_。\n\n_+2:_ 当敌人位置生长出植物时，束缚该敌人_3回合_。
actors.hero.talent.protective_slash.title=远距护盾
actors.hero.talent.protective_slash.desc=_+1:_ 攻击非近战范围内的敌人时，获得_3_点护盾。\n\n_+2:_ 攻击非近战范围内的敌人时，获得_5_点护盾。\n\n该天赋有10回合的冷却时间。
actors.hero.talent.kinetic_attack.title=荡势打击
actors.hero.talent.kinetic_attack.desc=_+1:_ 使用绳索后的物理攻击造成_1-2_点额外伤害。\n\n_+2:_ 使用绳索后的物理攻击造成_2_点额外伤害。

actors.hero.talent.natures_meal.title=自然一餐
actors.hero.talent.natures_meal.desc=_+1:_ 探险家进食只花费1回合，并在周围_4格_范围内种植长草。\n\n_+2:_ 探险家进食只花费1回合，并在周围_8格_范围内种植长草。
actors.hero.talent.pharmaceutics.title=液蕴生机
actors.hero.talent.pharmaceutics.desc=_+1:_ 消耗药剂时恢复_5_点生命值。\n\n_+2:_ 消耗药剂时恢复_8_点生命值。\n\n如果使用的是力量药剂、经验药剂或须用前述药剂炼制的炼金物品，则获得的生命值翻倍。\n\n对于产量较高的炼金物品（如水爆魔药），这项天赋会基于制成该物品的多少改变回复量。
actors.hero.talent.herb_extraction.title=草本萃取
actors.hero.talent.herb_extraction.desc=_+1:_ 饮用水袋的露水时，消耗种子获得_额外效果_。\n\n_+2:_ 在+1效果基础上，使用水袋时有_50%概率_不消耗种子。\n\n腐莓的种子不会被消耗。
actors.hero.talent.firewatch.title=山火预防
actors.hero.talent.firewatch.desc=_+1:_ 掉落在地面的_露水_不会被烧毁。\n\n_+2:_ 掉落在地面的_露水_和_卷轴_不会被烧毁。
actors.hero.talent.rope_rebound.title=荡摆借力
actors.hero.talent.rope_rebound.desc=_+1:_ 使用藤蔓绳索后获得_2回合_的极速效果。\n\n_+2:_ 使用藤蔓绳索后获得_3回合_的极速效果。
actors.hero.talent.weakening_poison.title=弱化毒素
actors.hero.talent.weakening_poison.desc=_+1:_ 当敌人踩踏植物时，施加_4回合_的虚弱和易伤效果。\n\n_+2:_ 当敌人踩踏植物时，施加_6回合_的虚弱和易伤效果。

actors.hero.talent.long_machete.title=长柄砍刀
actors.hero.talent.long_machete.desc=_+1:_ 砍刀的攻击范围增加_1格_。\n\n_+2:_ 砍刀的攻击范围增加_2格_。\n\n_+3:_ 砍刀的攻击范围增加_3格_。
actors.hero.talent.long_machete.meta_desc=_当其他职业获得此天赋时_，武器的攻击范围增加1/2/3格，但根据与目标的距离，攻击伤害最多减少-20/-36/-49%。
actors.hero.talent.blooming_weapon.title=繁茂武器
actors.hero.talent.blooming_weapon.desc=_+1:_ 攻击时有_5%_概率使周围生长出长草。\n\n_+2:_ 攻击时有_10%_概率使周围生长出长草。\n\n_+3:_ 攻击时有_15%_概率使周围生长出长草。

actors.hero.talent.barricade.title=沙袋路障
actors.hero.talent.barricade.desc=_+1:_ 可以建造阻碍敌人移动的_沙袋路障_。\n\n_+2:_ 在+1效果基础上，沙袋路障的_体力和防御力增强_。\n\n_+3:_ 在+2效果基础上，建造沙袋路障所需的藤蔓绳索减少_50%_。
actors.hero.talent.wire.title=钢丝陷阱
actors.hero.talent.wire.desc=_+1:_ 可以建造阻碍敌人移动并造成流血的_钢丝陷阱_。\n\n_+2:_ 在+1效果基础上，钢丝陷阱造成的_流血量增加_。\n\n_+3:_ 在+2效果基础上，建造钢丝陷阱所需的藤蔓绳索减少_50%_。
actors.hero.talent.watchtower.title=瞭望高塔
actors.hero.talent.watchtower.desc=_+1:_ 可以建造持续提供周围视野的_瞭望塔_。\n\n_+2:_ 在+1效果基础上，瞭望塔的视野范围_增加50%_。\n\n_+3:_ 在+2效果基础上，建造瞭望塔所需的藤蔓绳索减少_50%_。
actors.hero.talent.cannon.title=加农火炮
actors.hero.talent.cannon.desc=_+1:_ 可以建造消耗6发弹药发射强力炮弹的_加农炮_。\n\n_+2:_ 在+1效果基础上，加农炮的_最大伤害提升50%_。\n\n_+3:_ 在+2效果基础上，加农炮发射所需的弹药_减少50%_。
actors.hero.talent.machinegun.title=哨戒机枪
actors.hero.talent.machinegun.desc=_+1:_ 可以建造自动攻击周围4格内敌人的_机枪塔_。\n\n_+2:_ 在+1效果基础上，机枪塔的_伤害提升50%_。\n\n_+3:_ 在+2效果基础上，机枪塔的_视野范围扩大50%_。
actors.hero.talent.mortar.title=迫击炮台
actors.hero.talent.mortar.desc=_+1:_ 可以建造消耗10发弹药对指定位置实施轰炸的_迫击炮_。\n\n_+2:_ 在+1效果基础上，迫击炮的_最大伤害提升50%_。\n\n_+3:_ 在+2效果基础上，迫击炮发射所需的弹药_减少50%_。

actors.hero.talent.jungle_explore.title=丛林探险
actors.hero.talent.jungle_explore.desc=_+1:_ 在穿越草丛时移动速度增加_20%_。\n\n_+2:_ 在穿越草丛时移动速度增加_44%_。\n\n_+3:_ 在穿越草丛时移动速度增加_73%_。
actors.hero.talent.durable_rope.title=结实藤条
actors.hero.talent.durable_rope.desc=_+1:_ 攻击消耗的藤蔓绳索数量减少_20%_。\n\n_+2:_ 攻击消耗的藤蔓绳索数量减少_30%_。\n\n_+3:_ 攻击消耗的藤蔓绳索数量减少_40%_。
actors.hero.talent.lasso.title=绊索投掷
actors.hero.talent.lasso.desc=_+1:_ 用藤蔓绳索拉拽敌人时，施加_2回合_的残废效果。\n\n_+2:_ 用藤蔓绳索拉拽敌人时，施加_3回合_的残废效果。\n\n_+3:_ 用藤蔓绳索拉拽敌人时，施加_4回合_的残废效果。
actors.hero.talent.rope_collector.title=藤蔓收集
actors.hero.talent.rope_collector.desc=_+1:_ 使用砍刀获取藤蔓绳索的概率增加_20%_。\n\n_+2:_ 使用砍刀获取藤蔓绳索的概率增加_40%_。\n\n_+3:_ 使用砍刀获取藤蔓绳索的概率增加_60%_。
actors.hero.talent.rope_master.title=绳索大师
actors.hero.talent.rope_master.desc=_+1:_ 使用藤蔓绳索时消耗的绳索数量_减少50%_。\n\n_+2:_ 在+1效果基础上，使用藤蔓绳索时_不消耗回合_。\n\n_+3:_ 在+2效果基础上，可以_隔墙使用藤蔓绳索_。
actors.hero.talent.vine_bind.title=藤条束缚
actors.hero.talent.vine_bind.desc=_+1:_ 可以使用5根藤蔓绳索束缚邻近敌人_3回合_。\n\n_+2:_ 可以使用5根藤蔓绳索束缚邻近敌人_6回合_。\n\n_+3:_ 可以使用5根藤蔓绳索束缚邻近敌人_9回合_。\n\n此天赋的藤蔓绳索消耗量不会减少。

actors.hero.talent.biology_project.title=生物工程
actors.hero.talent.biology_project.desc=_+1:_ 对非亡灵或非无机生物敌人造成的物理伤害增加_+10%_。\n\n_+2:_ 对非亡灵或非无机生物敌人造成的物理伤害增加_+20%_。\n\n_+3:_ 对非亡灵或非无机生物敌人造成的物理伤害增加_+30%_。
actors.hero.talent.rapid_growth.title=植物再生
actors.hero.talent.rapid_growth.desc=_+1:_ 用铲子挖除草皮有 _20%_ 概率长出长草。\n\n_+2:_ 用铲子挖除草皮有 _40%_ 概率长出长草。\n\n_+3:_ 用铲子挖除草皮有 _60%_ 概率长出长草。
actors.hero.talent.bio_energy.title=高草蓄能
actors.hero.talent.bio_energy.desc=_+1:_ 踩踏长草时获得_0.2回合_的神器充能效果。\n\n_+2:_ 踩踏长草时获得_0.4回合_的神器充能效果。\n\n_+3:_ 踩踏长草时获得_0.6回合_的神器充能效果。
actors.hero.talent.water_absorb.title=水分蒸馏
actors.hero.talent.water_absorb.desc=_+1:_ 铲子可清除水格，并有_5%_概率在该格产生露水。\n\n_+2:_ 铲子可清除水格，并有_10%_概率在该格产生露水。\n\n_+3:_ 铲子可清除水格，并有_15%_概率在该格产生露水。
actors.hero.talent.powerful_acid.title=长效腐蚀
actors.hero.talent.powerful_acid.desc=_+1:_ 通过攻击施加的腐蚀淤泥持续时间_+50%_。\n\n_+2:_ 通过攻击施加的腐蚀淤泥持续时间_+100%_。\n\n_+3:_ 通过攻击施加的腐蚀淤泥持续时间_+150%_。
actors.hero.talent.sticky_ooze.title=黏性淤泥
actors.hero.talent.sticky_ooze.desc=_+1:_ 被施加腐蚀淤泥的敌人移动速度减少_10%_。\n\n_+2:_ 被施加腐蚀淤泥的敌人移动速度减少_20%_。\n\n_+3:_ 被施加腐蚀淤泥的敌人移动速度减少_30%_。

actors.hero.talent.jungle.title=野蛮生长
actors.hero.talent.jungle.desc=_+1:_ 植物生长频率_+20%_。\n\n_+2:_ 植物生长频率_+40%_。\n\n_+3:_ 植物生长频率_+60%_。\n\n_+4:_ 植物生长频率_+80%_。
actors.hero.talent.forest.title=创造森林
actors.hero.talent.forest.desc=_+1:_ 发芽的效果范围增加_+25%_。\n\n_+2:_ 发芽的效果范围增加_+50%_。\n\n_+3:_ 发芽的效果范围增加_+75%_。\n\n_+4:_ 发芽的效果范围增加_+100%_。
actors.hero.talent.regrowth.title=再生催化
actors.hero.talent.regrowth.desc=_+1:_ 发芽有_5%_概率生长出随机植物而非长草。\n\n_+2:_ 发芽有_10%_概率生长出随机植物而非长草。\n\n_+3:_ 发芽有_15%_概率生长出随机植物而非长草。\n\n_+4:_ 发芽有_20%_概率生长出随机植物而非长草。

actors.hero.talent.long_luck.title=运旺时盛
actors.hero.talent.long_luck.desc=_+1:_ 幸运效果的持续时间增加_+20%_。\n\n_+2:_ 幸运效果的持续时间增加_+40%_。\n\n_+3:_ 幸运效果的持续时间增加_+60%_。\n\n_+4:_ 幸运效果的持续时间增加_+80%_。
actors.hero.talent.foresight.title=逢凶化吉
actors.hero.talent.foresight.desc=_+1:_ 使用宝图时获得_5回合_的危险预知。\n\n_+2:_ 使用宝图时获得_10回合_的危险预知。\n\n_+3:_ 使用宝图时获得_15回合_的危险预知。\n\n_+4:_ 使用宝图时获得_20回合_的危险预知。
actors.hero.talent.gold_hunter.title=财运耀锋
actors.hero.talent.gold_hunter.desc=_+1:_ 幸运持续期间，获得金币的下次物理攻击伤害增加_+10%_。\n\n_+2:_ 幸运持续期间，获得金币的下次物理攻击伤害增加_+20%_。\n\n_+3:_ 幸运持续期间，获得金币的下次物理攻击伤害增加_+30%_。\n\n_+4:_ 幸运持续期间，获得金币的下次物理攻击伤害增加_+40%_。

actors.hero.talent.poisonous_root.title=剧毒根系
actors.hero.talent.poisonous_root.desc=_+1:_ 对被束缚的敌人施加持续_2回合_的中毒效果。\n\n_+2:_ 对被束缚的敌人施加持续_4回合_的中毒效果。\n\n_+3:_ 对被束缚的敌人施加持续_6回合_的中毒效果。\n\n_+4:_ 对被束缚的敌人施加持续_8回合_的中毒效果。
actors.hero.talent.root_spread.title=蔓延根系
actors.hero.talent.root_spread.desc=_+1:_ 向被束缚的敌人周围扩散范围为_30_的束缚根系。\n\n_+2:_ 向被束缚的敌人周围扩散范围为_60_的束缚根系。\n\n_+3:_ 向被束缚的敌人周围扩散范围为_90_的束缚根系。\n\n_+4:_ 向被束缚的敌人周围扩散范围为_120_的束缚根系。\n\n拥有此天赋时，扩散的根须还能将水格转变为草皮。
actors.hero.talent.root_armor.title=护体根系
actors.hero.talent.root_armor.desc=_+1:_ 对自身使用束缚时，消耗双倍充能获得每回合衰减的树肤，提供相当于当前护甲_13%_ 的防御力。\n\n_+2:_ 对对自身使用束缚时，消耗双倍充能获得每回合衰减的树肤，提供相当于当前护甲_25%_ 的防御力。\n\n_+3:_ 对自身使用束缚时，消耗双倍充能获得每回合衰减的树肤，提供相当于当前护甲_38%_ 的防御力。\n\n_+4:_ 对自身使用束缚时，消耗双倍充能获得每回合衰减的树肤，提供相当于当前护甲_50%_ 的防御力。

actors.hero.abilities.adventurer.sprout.name=极速发芽
actors.hero.abilities.adventurer.sprout.short_desc=探险家可以在广阔区域内使用_极速发芽_来大范围长草。
actors.hero.abilities.adventurer.sprout.desc=探险家可以在周围4格半径范围内播撒草种，使长草生长。
actors.hero.abilities.adventurer.treasuremap.name=幸运宝图
actors.hero.abilities.adventurer.treasuremap.short_desc=探险家可以取出_幸运宝图_进行阅读，识别当前楼层所有物品的位置。
actors.hero.abilities.adventurer.treasuremap.desc=探险家可以使用幸运宝图侦测当前楼层所有物品的位置，同时获得20回合击杀敌人可获得额外物品掉落的幸运效果。
actors.hero.abilities.adventurer.treasuremap$lucktracker.name=幸运
actors.hero.abilities.adventurer.treasuremap$lucktracker.desc=强烈的幸运气息萦绕四周，幸运状态持续期间击杀的敌人将掉落额外战利品。
actors.hero.abilities.adventurer.root.name=束缚
actors.hero.abilities.adventurer.root.prompt=请选择要束缚的目标
actors.hero.abilities.adventurer.root.ally_target=你只能束缚敌对目标。
actors.hero.abilities.adventurer.root.no_charge=激活根须护甲所需的充能量不足！
actors.hero.abilities.adventurer.root.short_desc=探险家可以对选定目标施展_根系束缚_。
actors.hero.abilities.adventurer.root.desc=探险家可以用束缚根系将选定目标_束缚_持续20回合。

###v3.11.0
actors.hero.heroclass.knight=骑士
actors.hero.heroclass.knight_desc_short=精通战斗的骑士初始携带_骑士盾牌_，提供与等级成正比的防御力。
actors.hero.heroclass.knight_desc=骑士开局持有特殊的_骑士盾牌_，它持续为你提供护甲，并且可以获得刻印来提供额外效果。\n\n骑士初始还携带_佩剑_、3块投石、布甲、水袋和绒布袋。\n\n骑士开局便已鉴定的道具有：\n_-_ 鉴定卷轴\n_-_ 麻痹药剂\n_-_ 净化卷轴
actors.hero.heroclass.knight_unlock=解锁骑士需_获得板甲_。

actors.hero.herosubclass.deathknight=死亡骑士
actors.hero.herosubclass.deathknight_short_desc=_死亡骑士_可通过吸收击杀敌人的灵魂超越死亡。
actors.hero.herosubclass.deathknight_desc=死亡骑士可以通过击杀敌人吸收并储存灵魂。当生命值降为0时，若储存有灵魂，将消耗1个灵魂恢复部分生命值并抵御死亡。该能力优先于重生十字架触发。
actors.hero.herosubclass.horseman=幽灵骑士
actors.hero.herosubclass.horseman_short_desc=_幽灵骑士_可骑乘灵魂战马席卷战场。
actors.hero.herosubclass.horseman_desc=幽灵骑士在转职的同时获得骑乘效果。骑乘期间可向指定方向冲锋，对路径上所有目标进行攻击，直至撞击墙壁为止。撞击墙壁时根据移动距离比例受到伤害。\n\n骑乘期间英雄受到物理伤害时，灵魂战马的生命值将减少，若骑乘过程中灵魂战马死亡，则会坠马并受到重大伤害。
actors.hero.herosubclass.crusader=圣殿骑士
actors.hero.herosubclass.crusader_short_desc=_圣殿骑士_可通过祈祷获得祝福，在祝福状态下攻击敌人可恢复生命值。
actors.hero.herosubclass.crusader_desc=圣殿骑士可以通过祈祷消耗部分经验值，短暂获得可叠加的祝福。经验值不足时无法从祈祷获得任何效果。\n\n圣殿骑士在祝福状态下对敌人进行物理攻击时，可恢复造成伤害的部分生命值。

actors.hero.abilities.knight.holyshield.name=神圣护盾
actors.hero.abilities.knight.holyshield.short_desc=骑士可通过祈祷获得_神圣护盾_，抵御少量攻击伤害。
actors.hero.abilities.knight.holyshield.desc=骑士凭借崇高信仰进行祈祷，可获得25点护盾。
actors.hero.abilities.knight.stimpack.name=战能药剂
actors.hero.abilities.knight.stimpack.short_desc=骑士可以使用_战能药剂_，消耗部分生命值来大幅提升攻击速度和移动速度。
actors.hero.abilities.knight.stimpack.desc=骑士使用战能药剂将损失最大生命值的30%，并在接下来的20回合内获得激素涌动。
actors.hero.abilities.knight.stimpack.cannot_use=生命值不足，无法使用战能药剂！
actors.hero.abilities.knight.unstableankh.name=无序十字
actors.hero.abilities.knight.unstableankh.short_desc=骑士可以创造_无序十字_，在极短时间内进入无敌状态。
actors.hero.abilities.knight.unstableankh.desc=骑士使用通过信仰之力制造的特殊十字架，获得1回合的无敌状态。
actors.hero.abilities.knight.unstableankh.ankh_dropped=无序十字的混乱力量已经重新稳定！

actors.hero.talent.tough_meal.title=顽强进食
actors.hero.talent.tough_meal.desc=_+1:_ 进食时，接下来_2次_受击获得3-3点额外防御力。\n\n_+2:_ 进食时，接下来_3次_受击获得3-3点额外防御力。
actors.hero.talent.knights_intuition.title=骑士直觉
actors.hero.talent.knights_intuition.desc=_+1:_ _防具在装备时立即完成_鉴定。\n\n_+2:_ 防具在拾取时立即得知_是否被诅咒_。
actors.hero.talent.kinetic_battle.title=战斗惯性
actors.hero.talent.kinetic_battle.desc=_+1:_ 击杀敌人后，获得持续最多 _3回合_ 的+1额外伤害。\n\n_+2:_ 击杀敌人后，获得持续最多 _5回合_ 的+1额外伤害。\n\n额外伤害最多可叠加至5层。
actors.hero.talent.hard_shield.title=坚固盾牌
actors.hero.talent.hard_shield.desc=_+1:_ 骑士盾牌提供的防御力增加_0-2_点。\n\n_+2:_ 骑士盾牌提供的防御力增加_0-4_点。
actors.hero.talent.hard_shield.meta_desc=_当其他职业获得此天赋时_，即使不持有骑士盾牌，防御力也增加0-2/0-4点。
actors.hero.talent.war_cry.title=入场战吼
actors.hero.talent.war_cry.desc=_+1:_ 首次攻击敌人时获得_1回合_的激素涌动效果。\n\n_+2:_ 首次攻击敌人时获得_2回合_的激素涌动效果。

actors.hero.talent.impregnable_meal.title=铁壁一餐
actors.hero.talent.impregnable_meal.desc=_+1:_ 进食仅消耗1回合，且面对下3次物理攻击护甲等级_+1_。\n\n_+2:_ 进食仅消耗1回合，且面对下3次物理攻击护甲等级_+2_。
actors.hero.talent.smithing_spell.title=卷藏冶炼
actors.hero.talent.smithing_spell.desc=_+1:_ 当骑士阅读卷轴或使用法术结晶后，他的武器和护甲分别造成与面对下10次物理攻击时等级_+1_。\n\n_+2:_ 当骑士阅读卷轴或使用法术结晶后，他的武器和护甲分别造成与面对下10次物理攻击时等级_+2_。\n\n如果使用的是升级卷轴、嬗变卷轴或须用前述卷轴炼制的炼金物品，则获得暴击加成的攻击次数翻倍。\n\n对产量较高的炼金物品（如大多数结晶），这项天赋给予的生效次数会基于该物品的多少而触发。
actors.hero.talent.armor_adaption.title=盔甲适配
actors.hero.talent.armor_adaption.desc=_+1:_ 每点超出护甲力量要求的力量值提供 _0-1_ 点额外防御力。\n\n_+2:_ 每点超出护甲力量要求的力量值提供 _0-1.5_ 点额外防御力。
actors.hero.talent.chivalry.title=骑士气概
actors.hero.talent.chivalry.desc=_+1:_ 视野内的友军受到伤害时_由英雄代为承受_。\n\n_+2:_ 在+1效果基础上，代为承受的伤害_减少50%_。
actors.hero.talent.protection.title=王国庇护
actors.hero.talent.protection.desc=_+1:_ 根据已损失生命值的比例，受到的伤害最多减少_17%_。\n\n_+2:_ 根据已损失生命值的比例，受到的伤害最多减少_33%_。
actors.hero.talent.flag_of_conquest.title=征服旗帜
actors.hero.talent.flag_of_conquest.desc=_+1:_ 升级时，对视野内所有敌人造成_该敌人最大生命值50%_的伤害。\n\n_+2:_ 升级时，对视野内所有敌人造成_该敌人最大生命值75%_的伤害。

actors.hero.talent.craftmans_skills.title=工匠手艺
actors.hero.talent.craftmans_skills.desc=_+1:_ 所装备护甲的强化值增加_+1_。\n\n_+2:_ 所装备护甲的强化值增加_+2_。\n\n_+3:_ 所装备护甲的强化值增加_+3_。
actors.hero.talent.tackle.title=铁壁痛击
actors.hero.talent.tackle.desc=_+1:_ 使用近战武器或徒手攻击邻近敌人时，造成当前防御力_5%_的额外伤害。\n\n_+2:_ 使用近战武器或徒手攻击邻近敌人时，造成当前防御力_10%_的额外伤害。\n\n_+3:_ 使用近战武器或徒手攻击邻近敌人时，造成当前防御力_15%_的额外伤害。

actors.hero.talent.army_of_death.title=亡者军团
actors.hero.talent.army_of_death.desc=_+1:_ 击杀敌人时，根据已损失生命值的比例，最多有_10%_概率腐化该敌人。\n\n_+2:_ 击杀敌人时，根据已损失生命值的比例，最多有_20%_概率腐化该敌人。\n\n_+3:_ 击杀敌人时，根据已损失生命值的比例，最多有_30%_概率腐化该敌人。
actors.hero.talent.deaths_chill.title=死亡寒意
actors.hero.talent.deaths_chill.desc=_+1:_ 超越死亡后，获得_20回合寒霜之力_。\n\n_+2:_ 在+1效果基础上，_在视野内所有敌人位置及其周围生成暴风雪_。\n\n_+3:_ 在+2效果基础上，超越死亡后_立即冰冻视野内所有敌人_。
actors.hero.talent.overcome.title=不朽誓约
actors.hero.talent.overcome.desc=_+1:_ 超越死亡时的恢复量增加_+3_。\n\n_+2:_ 超越死亡时的恢复量增加_+6_。\n\n_+3:_ 超越死亡时的恢复量增加_+9_。
actors.hero.talent.resentment.title=冤魂缠身
actors.hero.talent.resentment.desc=_+1:_ 超越死亡时，在周围召唤_1个_堕落亡魂。\n\n_+2:_ 超越死亡时，在周围召唤_2个_堕落亡魂。\n\n_+3:_ 超越死亡时，在周围召唤_4个_堕落亡魂。
actors.hero.talent.undead.title=巫妖之躯
actors.hero.talent.undead.desc=_+1:_ 生命值降为0时，作为巫妖存活_1回合_以延缓死亡。\n\n_+2:_ 生命值降为0时，作为巫妖存活_2回合_以延缓死亡。\n\n_+3:_ 生命值降为0时，作为巫妖存活_3回合_以延缓死亡。\n\n亡灵状态下无法恢复生命值，但也不会损失生命值。
actors.hero.talent.deaths_fear.title=凋零恐惧
actors.hero.talent.deaths_fear.desc=_+1:_ 超越死亡时，对视野内所有敌人施加_10回合的虚弱_。\n\n_+2:_ 在+1效果基础上，超越死亡时对视野内所有敌人施加_10回合的易伤_。\n\n_+3:_ 在+2效果基础上，超越死亡时对视野内所有敌人施加_10回合的恐惧_。

actors.hero.talent.shockwave.title=撞阵冲军
actors.hero.talent.shockwave.desc=_+1:_ 幽灵骑士每冲锋_6格_便在结束后将周围敌人击退1格。\n\n_+2:_ 幽灵骑士每冲锋_4格_便在结束后将周围敌人击退1格。\n\n_+3:_ 幽灵骑士每冲锋_2格_便在结束后将周围敌人击退1格。
actors.hero.talent.armored_horse.title=重装战马
actors.hero.talent.armored_horse.desc=_+1:_ 灵魂战马的防御力_+1-8_。\n\n_+2:_ 灵魂战马的防御力_+2-16_。\n\n_+3:_ 灵魂战马的防御力_+3-24_。\n\n幽灵战马初始有2-16点防御，用于减免受到的伤害。
actors.hero.talent.dash_enhance.title=一骑当千
actors.hero.talent.dash_enhance.desc=_+1:_ 冲锋造成的伤害增加_+20%_。\n\n_+2:_ 冲锋造成的伤害增加_+40%_。\n\n_+3:_ 冲锋造成的伤害增加_+60%_。
actors.hero.talent.buffer.title=缓冲肉垫
actors.hero.talent.buffer.desc=_+1:_ 冲锋每伤害1个敌人，冲锋对自身的伤害减少_1-3_。\n\n_+2:_ 冲锋每伤害1个敌人，冲锋对自身的伤害减少_2-6_。\n\n_+3:_ 冲锋每伤害1个敌人，冲锋对自身的伤害减少_3-9_。
actors.hero.talent.parkour.title=翻身下马
actors.hero.talent.parkour.desc=_+1:_ 坠马受到的伤害减免_25%_。\n\n_+2:_ 坠马受到的伤害减免_50%_。\n\n_+3:_ 坠马受到的伤害减免_75%_。
actors.hero.talent.piloting.title=轻甲逐风
actors.hero.talent.piloting.desc=_+1:_每超出装备护甲所需力量1点，骑乘状态移动速度增加_3%_。\n\n_+2:_每超出装备护甲所需力量1点，骑乘状态移动速度增加_6%_。\n\n_+3:_每超出装备护甲所需力量1点，骑乘状态移动速度增加_9%_。\n\n未装备护甲时此天赋不生效。

actors.hero.talent.holy_shield.title=圣血化盾
actors.hero.talent.holy_shield.desc=_+1:_ 圣殿骑士在生命值全满时通过祝福恢复生命，可获得相当于过量恢复量的护盾，上限为_最大生命值的20%_。\n\n_+2:_ 圣殿骑士在生命值全满时通过祝福恢复生命，可获得相当于过量恢复量的护盾，上限为_最大生命值的40%_。\n\n_+3:_ 圣殿骑士在生命值全满时通过祝福恢复生命，可获得相当于过量恢复量的护盾，上限为_最大生命值的60%_。
actors.hero.talent.pray_for_dead.title=送终祷告
actors.hero.talent.pray_for_dead.desc=_+1:_ 击杀敌人后立即祈祷，可额外获得_3回合祝福_。\n\n_+2:_ 在+1效果基础上，击杀敌人后立即祈祷可_返还消耗的经验值_。\n\n_+3:_ 在+2效果基础上，击杀敌人后立即祈祷可_恢复3点生命值_。
actors.hero.talent.gods_judgement.title=不敬责罚
actors.hero.talent.gods_judgement.desc=_+1:_ 祈祷期间英雄受到物理攻击时，对攻击者施加神之审判效果，攻击带有神之审判的敌人时将移除该效果并斩杀生命值低于_13%_的目标。\n\n_+2:_ 祈祷期间英雄受到物理攻击时，对攻击者施加神之审判效果，攻击带有神之审判的敌人时将移除该效果并斩杀生命值低于_27%_的目标。\n\n_+3:_ 祈祷期间英雄受到物理攻击时，对攻击者施加神之审判效果，攻击带有神之审判的敌人时将移除该效果并斩杀生命值低于_40%_的目标。
actors.hero.talent.cleansing_pray.title=驱邪真言
actors.hero.talent.cleansing_pray.desc=_+1:_ 祈祷期间承受的元素伤害减少_33%_。\n\n_+2:_ 祈祷期间承受的元素伤害减少_67%_。\n\n_+3:_ 祈祷期间承受的元素伤害减少_100%_。
actors.hero.talent.punishment.title=神怒惩戒
actors.hero.talent.punishment.desc=_+1:_ 祈祷期间英雄受到物理攻击时，接下来的_1次_物理攻击将附加雷霆造成额外伤害。\n\n_+2:_ 祈祷期间英雄受到物理攻击时，接下来的_2次_物理攻击将附加雷霆造成额外伤害。\n\n_+3:_ 祈祷期间英雄受到物理攻击时，接下来的_3次_物理攻击将附加雷霆造成额外伤害。\n\n此效果持续期间，祈祷时受到物理攻击不会重置攻击次数。
actors.hero.talent.anti_demon.title=圣裁驱魔
actors.hero.talent.anti_demon.desc=_+1:_ 祝福效果期间，对亡灵和恶魔造成的物理伤害增加_33%_。\n\n_+2:_ 祝福效果期间，对亡灵和恶魔造成的物理伤害增加_67%_。\n\n_+3:_ 祝福效果期间，对亡灵和恶魔造成的物理伤害增加_100%_。

actors.hero.talent.buffer_barrier.title=强化护盾
actors.hero.talent.buffer_barrier.desc=_+1:_ 神圣护盾提供的护盾值增加_20%_。\n\n_+2:_ 神圣护盾提供的护盾值增加_40%_。\n\n_+3:_ 神圣护盾提供的护盾值增加_60%_。\n\n_+4:_ 神圣护盾提供的护盾值增加_80%_。
actors.hero.talent.holy_light.title=圣光驱暗
actors.hero.talent.holy_light.desc=_+1:_ 使用神圣护盾时获得_25回合_的发光效果。\n\n_+2:_ 使用神圣护盾时获得_50回合_的发光效果。\n\n_+3:_ 使用神圣护盾时获得_75回合_的发光效果。\n\n_+4:_ 使用神圣护盾时获得_100回合_的发光效果。
actors.hero.talent.blessing.title=祝福之力
actors.hero.talent.blessing.desc=_+1:_ 使用神圣护盾时获得_5回合_的祝福。\n\n_+2:_ 使用神圣护盾时获得_10回合_的祝福。\n\n_+3:_ 使用神圣护盾时获得_15回合_的祝福。\n\n_+4:_ 使用神圣护盾时获得_20回合_的祝福。

actors.hero.talent.burden_relief.title=减轻负担
actors.hero.talent.burden_relief.desc=_+1:_ 使用战能药剂时损失的生命值降为最大生命值的_25%_。\n\n_+2:_ 使用战能药剂时损失的生命值降为最大生命值的_20%_。\n\n_+3:_ 使用战能药剂时损失的生命值降为最大生命值的_15%_。\n\n_+4:_ 使用战能药剂时损失的生命值降为最大生命值的_10%_。
actors.hero.talent.lasting_pack.title=战意不息
actors.hero.talent.lasting_pack.desc=_+1:_ 从战能药剂获得的激素涌动持续时间增加_25%_。\n\n_+2:_ 从战能药剂获得的激素涌动持续时间增加_50%_。\n\n_+3:_ 从战能药剂获得的激素涌动持续时间增加_75%_。\n\n_+4:_ 从战能药剂获得的激素涌动持续时间增加_100%_。
actors.hero.talent.time_stop.title=战时凝域
actors.hero.talent.time_stop.desc=_+1:_ 使用战能药剂时获得_1回合_的时间气泡。\n\n_+2:_ 使用战能药剂时获得_2回合_的时间气泡。\n\n_+3:_ 使用战能药剂时获得_3回合_的时间气泡。\n\n_+4:_ 使用战能药剂时获得_4回合_的时间气泡。

actors.hero.talent.blessed_ankh.title=赐福十字
actors.hero.talent.blessed_ankh.desc=_+1:_ 使用无序十字时恢复_5_点生命值。\n\n_+2:_ 使用无序十字时恢复_10_点生命值。\n\n_+3:_ 使用无序十字时恢复_15_点生命值。\n\n_+4:_ 使用无序十字时恢复_20_点生命值。
actors.hero.talent.ankh_enhance.title=混乱十字
actors.hero.talent.ankh_enhance.desc=_+1:_ 无序十字提供的无敌时间有_50%_概率增加_1回合_。\n\n_+2:_ 无序十字提供的无敌时间有_100%_概率增加_1回合_。\n\n_+3:_ 无序十字提供的无敌时间有_50%_概率增加_2回合_。\n\n_+4:_ 无序十字提供的无敌时间有_100%_概率增加_2回合_。
actors.hero.talent.complete_ankh.title=完整十字
actors.hero.talent.complete_ankh.desc=_+1:_ 使用无序十字时有_1%_概率生成重生十字架。\n\n_+2:_ 使用无序十字时有_2%_概率生成重生十字架。\n\n_+3:_ 使用无序十字时有_3%_概率生成重生十字架。\n\n_+4:_ 使用无序十字时有_4%_概率生成重生十字架。

actors.hero.talent$armorempower.name=防御强化
actors.hero.talent$armorempower.desc=你的身体经过强化，现在受到的物理伤害降低。\n\n额外防御力：%1$d。\n剩余生效次数：%2$d。
actors.hero.talent$kineticbattle.name=战斗惯性
actors.hero.talent$kineticbattle.desc=你近期经历的战斗正在影响你的攻击能力。\n\n额外攻击力：%1$d。\n剩余回合：%2$s。
actors.hero.talent$judgementtracker.name=不敬责罚
actors.hero.talent$judgementtracker.desc=该角色因在你祈祷期间攻击你而受到审判。攻击带有此效果的角色时，可立即消灭生命值低于一定量的敌人。\n剩余回合：%s。
actors.hero.talent$judgementtracker.executed=审判

actors.buffs.armorenhance.name=护甲强化
actors.buffs.armorenhance.desc=你的防具已获得临时强化！\n\n额外等级：%1$d。\n剩余生效次数：%2$d。

actors.buffs.weaponenhance.name=武器强化
actors.buffs.weaponenhance.desc=你的武器已获得临时强化！\n\n额外等级：%1$d。\n剩余攻击次数：%2$d。

actors.buffs.soulcollect.name=灵魂汲取
actors.buffs.soulcollect.desc=你吸收了之前击杀敌人的灵魂，其能量正在周围萦绕。当你濒临死亡时，将消耗这些灵魂立即恢复生命值以超越死亡。\n\n当前灵魂数量：_%1$d/%2$d_。\n\n超越死亡时恢复生命值：_%3$d_。

actors.buffs.undead.name=巫妖之躯
actors.buffs.undead.desc=你已获得巫妖之力得以抵御死亡，虽为时短暂，却可完成未竟之事。巫妖化期间恢复效果将被阻断，效果结束后英雄将会死亡。\n\n剩余回合：%s。
actors.buffs.undead.rankings_desc=虽竭力抗拒死亡，终告陨落。

actors.buffs.pray.action_name=祈祷
actors.buffs.pray.pray_sucess=天启降临，你的祈祷得到了神圣回应！
actors.buffs.pray.pray_fail=你的祈祷未获回应。

actors.buffs.horseriding.name=骑乘
actors.buffs.horseriding.action_name=骑乘冲刺
actors.buffs.horseriding.desc=你骑在灵魂之马上驰骋战场。\n骑马时，你可以操控马匹进行冲刺，瞬间跨越远距离。\n\n冲刺时，会沿选定方向在1回合内移动至撞墙为止，并穿透路径上的角色。此时会对所有穿透的敌人造成攻击伤害，并根据移动距离按比例承受伤害。若向英雄所在位置尝试冲刺，可从灵魂战马上下马。\n\n骑马期间，若英雄受到任何形式的伤害，灵魂战马的生命值也会相应减少；若骑马时灵魂战马死亡，会坠马并受到巨大伤害。\n\n当前灵魂战马的生命值：%1$d/%2$d。
actors.buffs.horseriding.rankings_desc=因无法控制速度而死亡
actors.buffs.horseriding.ondeath=你撞上墙壁死去了...
actors.buffs.horseriding.direct_prompt=请选择冲刺方向
actors.buffs.horseriding.fall=你从马上摔了下来！
actors.buffs.horseriding$horseally.name=灵魂战马
actors.buffs.horseriding$horseally.desc=这是你召唤的灵魂战马。灵魂战马会跟随你移动，并随着时间推移逐渐恢复少量生命值。\n\n灵魂战马无法主动攻击敌人，但会成为敌人优先攻击的首要目标。
actors.buffs.horseriding$ridefall.rankings_desc=坠马身亡
actors.buffs.horseriding$ridefall.ondeath=你从马上坠落而亡...
actors.buffs.horseriding$ridingcooldown.name=冷却时间：灵魂战马
actors.buffs.horseriding$ridingcooldown.desc=灵魂战马死亡，需要击杀敌人才能重新召唤。\n\n剩余敌人：%1$d/%2$d。

###v3.17.0
actors.hero.heroclass.medic=医务官
actors.hero.heroclass.medic_desc_short=擅长治疗友军的医务官，初始配备可攻击敌军并治疗友军的_伽马射线枪_。
actors.hero.heroclass.medic_desc=医疗官配备特殊的_伽马射线枪_，可对敌人施加中毒效果并为友军进行治疗。\n\n医务官的能力主要侧重于_对敌人施加有害效果_或_治疗友军并赋予增益效果_。\n\n医务官_不消耗回合_即可直接使用药丸，并能投掷药丸_给其他目标_。\n\n同时,医务官初始携带_一把手术刀_、布甲、水袋与绒布包。\n\n医务官开局鉴定的物品有：\n_-_ 鉴定卷轴\n_-_ 治疗药剂\n_-_ 镜像卷轴
actors.hero.heroclass.medic_unlock=_制作5次药丸_解锁医务官。

actors.hero.herosubclass.savior=拯救者
actors.hero.herosubclass.savior_short_desc=_拯救者_对低生命值敌人使用伽马射线发射器时，可将目标转化为友军。
actors.hero.herosubclass.savior_desc=拯救者使用伽马射线发射器对敌人进行照射时，有一定概率将目标永久转化为友军；当目标生命值低于5%时，必定转化为友军。\n\n每层地牢最多可同时存在2名友军单位。
actors.hero.herosubclass.therapist=治疗师
actors.hero.herosubclass.therapist_short_desc=_治疗师_受到伤害后，能通过应急处理快速恢复所受伤害。
actors.hero.herosubclass.therapist_desc=治疗师受到物理伤害时会激活急救措施，应急处理可立即恢复最近一次受到防御力计算前伤害值的40%。\n\n每击杀1名敌人后，该技能可再次使用。
actors.hero.herosubclass.medicalofficer=军务官
actors.hero.herosubclass.medicalofficer_short_desc=_军务官_每次击杀敌人时，可获得指挥点下达多样化战术指令。
actors.hero.herosubclass.medicalofficer_desc=指挥军事行动的军务官每次直接击杀敌人时，可获得军事行动指挥点，用于下达多样化的军事行动指令。\n\n默认可使用的军事行动指令包括：集结指令、医疗支援指令。通过解锁天赋还可获得更多指令类型。

actors.hero.talent.scar_attack.title=伤口撕裂
actors.hero.talent.scar_attack.desc=_+1:_ 敌人身上的每个减益效果使医务官造成_1点_额外伤害。\n\n_+2:_  敌人身上的每个减益效果使医务官造成_1-2点_额外伤害。
actors.hero.talent.doctors_intuition.title=医师直觉
actors.hero.talent.doctors_intuition.desc=_+1:_ 随机鉴定_3瓶_药剂。\n\n_+2:_ 随机鉴定_5瓶_药剂。
actors.hero.talent.finish_attack.title=慈悲关怀
actors.hero.talent.finish_attack.desc=_+1:_ 物理攻击对不高于25%血量的敌人追加_2_点额外伤害。\n\n_+2:_ 物理攻击对不高于25%血量的敌人追加_3_点额外伤害。
actors.hero.talent.first_aid_treat.title=紧急包扎
actors.hero.talent.first_aid_treat.desc=_+1:_ 单次受到超过_8点_伤害时，恢复3点生命值。\n\n_+2:_ 单次受到超过_5点_伤害时，恢复3点生命值。\n\n这个天赋有50回合冷却时间。
actors.hero.talent.breakthrough.title=异常克服
actors.hero.talent.breakthrough.desc=_+1:_ 身上每有一个减益效果使基础闪避率提升_1.2倍_。\n\n_+2:_ 身上每有一个减益效果使基础闪避率提升_1.5倍_。

actors.hero.talent.healing_meal.title=治愈一餐
actors.hero.talent.healing_meal.desc=_+1:_ 进食仅消耗1回合，且进食时_移除所有负面状态_。\n\n_+2:_ 在+1效果基础上，若进食时未移除任何负面状态则_恢复3点生命值_
actors.hero.talent.recycling.title=药剂回收
actors.hero.talent.recycling.desc=_+1:_ 使用药剂时，有几率获得_0-1颗_对应药丸\n\n_+2:_ 使用药剂时，有几率获得_0-2颗_对应药丸\n\n力量药剂和炼金术获得的药水不适用此效果
actors.hero.talent.high_power.title=功率提升
actors.hero.talent.high_power.desc=_+1:_ 伽马射线枪效能提升_+25%_，但冷却时间增加_1回合_。\n\n_+2:_ 伽马射线枪效能提升_+50%_，但冷却时间增加_2回合_。
actors.hero.talent.high_power.meta_desc=_其他职业获得此天赋时，_ 改为使武器附魔效果提升至x1.1/x1.2倍
actors.hero.talent.radiation.title=辐射损伤
actors.hero.talent.radiation.desc=_+1:_ 对敌人发射伽马射线时，会施加辐射损伤效果，使其死亡前，每_5回合_受到1点伤害\n\n_+2:_ 对敌人发射伽马射线时，会施加辐射损伤效果，使其死亡前，每_4回合_受到1点伤害
actors.hero.talent.radiation.meta_desc=_其他职业获得此天赋时，_ 物理攻击有3%概率施加辐射损伤效果：每5/4回合造成1次伤害。
actors.hero.talent.strong_healpower.title=强效恢复
actors.hero.talent.strong_healpower.desc=_+1:_ 生命值自然恢复量提升至_x1.1倍_。\n\n_+2:_ 生命值自然恢复量提升至_x1.2倍_。
actors.hero.talent.diet.title=控制饮食
actors.hero.talent.diet.desc=_+1:_ 饥饿值消耗速度降低_20%_。\n\n_+2:_ 饥饿值消耗速度降低_40%_。

actors.hero.talent.strong_nexus.title=战地联脉
actors.hero.talent.strong_nexus.desc=_+1:_ 物理攻击敌人为周围友军恢复最多_3_点生命值。\n\n_+2:_ 物理攻击敌人为周围友军恢复最多_6_点生命值。\n\n_+3:_ 物理攻击敌人为周围友军恢复最多_9_点生命值。\n\n治疗效果随目标友军与英雄距离增加而递减。\n不在视野范围内的友军无法获得该效果。
actors.hero.talent.target_set.title=指定目标
actors.hero.talent.target_set.desc=_+1:_ 对敌人投掷武器/弹药时会施加_1回合_众矢之的，目标是盟友时效果时间为_5回合_。\n\n_+2:_ 对敌人投掷武器/弹药时会施加_2回合_众矢之的，目标是盟友时效果时间为_10回合_。\n\n_+3:_ 对敌人投掷武器/弹药时会施加_3回合_众矢之的，目标是盟友时效果时间为_15回合_。

actors.hero.talent.recruit.title=征募动员
actors.hero.talent.recruit.desc=_+1:_ 单层最大友军数量_+1名_。\n\n_+2:_ 单层最大友军数量_+2名_。\n\n_+3:_ 单层最大友军数量_+3名_。
actors.hero.talent.delayed_healing.title=持续治疗
actors.hero.talent.delayed_healing.desc=_+1:_ 转化敌人为友军时，为目标缓慢恢复其最大生命值的_20%_。\n\n_+2:_ 转化敌人为友军时，为目标缓慢恢复其最大生命值的_40%_。\n\n_+3:_ 转化敌人为友军时，为目标缓慢恢复其最大生命值的_60%_。
actors.hero.talent.appease.title=怀柔政策
actors.hero.talent.appease.desc=_+1:_ 必定转化为友军的生命值阈值提升至最大生命值的_10%_。\n\n_+2:_ 必定转化为友军的生命值阈值提升至最大生命值的_15%_。\n\n_+3:_ 必定转化为友军的生命值阈值提升至最大生命值的_20%_。
actors.hero.talent.adrenaline.title=过量激素
actors.hero.talent.adrenaline.desc=_+1:_ 对友军使用伽马射线枪时，额外施加_3回合_的中毒和激素涌动效果。\n\n_+2:_ 对友军使用伽马射线枪时，额外施加_6回合_的中毒和激素涌动效果。\n\n_+3:_ 对友军使用伽马射线枪时，额外施加_9回合_的中毒和激素涌动效果。\n\n该效果不可叠加。
actors.hero.talent.stimpack.title=战斗增强
actors.hero.talent.stimpack.desc=_+1:_ 对友军使用伽马射线枪会令其_1回合_内造成的伤害和命中率大幅提升。\n\n_+2:_ 对友军使用伽马射线枪时会令其_2回合_内造成的伤害和命中率大幅提升。\n\n_+3:_ 对友军使用伽马射线枪时会令其_3回合_内造成的伤害和命中率大幅提升。
actors.hero.talent.medical_ray.title=医疗射线
actors.hero.talent.medical_ray.desc=_+1:_ 伽马射线枪的治疗效果_+20%_。\n\n_+2:_ 伽马射线枪的治疗效果_+40%_。\n\n_+3:_ 伽马射线枪的治疗效果_+60%_。

actors.hero.talent.ointment.title=缓释药膏
actors.hero.talent.ointment.desc=_+1:_ 应急处理治疗量_+25%_，但每回合只回复总回复量的_50%_。\n\n_+2:_ 应急处理治疗量_+50%_，但每回合只回复总回复量的_33%_。\n\n_+3:_ 应急处理治疗量_+75%_，但每回合只回复总回复量的_25%_。
actors.hero.talent.compress_bandage.title=加压绷带
actors.hero.talent.compress_bandage.desc=_+1:_ 应急处理后会在接下来_1回合_内受到的伤害减少50%。\n\n_+2:_ 应急处理后会在接下来_2回合_内受到的伤害减少50%。\n\n_+3:_ 应急处理后会在接下来_3回合_内受到的伤害减少50%。
actors.hero.talent.antibiotics.title=抗菌药物
actors.hero.talent.antibiotics.desc=_+1:_ 应急处理会_净化负面状态_。\n\n_+2:_ 在+1效果基础上，应急处理时会获得_3回合的净化屏障_。\n\n_+3:_ 在+2效果基础上，应急处理时会获得_3回合全面净化_。
actors.hero.talent.quick_prepare.title=紧急输血
actors.hero.talent.quick_prepare.desc=_+1:_ 即使未击杀敌人，_50回合_后仍可再次使用应急处理。\n\n_+2:_ 即使未击杀敌人，_30回合_后仍可再次使用应急处理。\n\n_+3:_ 即使未击杀敌人，_20回合_后仍可再次使用应急处理。
actors.hero.talent.splint.title=跃迁夹板
actors.hero.talent.splint.desc=_+1:_ 应急处理可立即获得_1回合_的风驰电掣。\n\n_+2:_ 应急处理可立即获得_2回合_的风驰电掣。\n\n_+3:_ 应急处理可立即获得_3回合_的风驰电掣。
actors.hero.talent.defibrillator.title=除颤电击
actors.hero.talent.defibrillator.desc=_+1:_应急处理会触发连锁闪电对周围敌人造成等同于恢复量_1倍_的伤害。\n\n_+2:_ 应急处理会触发连锁闪电对周围敌人造成等同于恢复量_2倍_的伤害。\n\n_+3:_ 应急处理会触发连锁闪电对周围敌人造成等同于恢复量_3倍_的伤害。

actors.hero.talent.move_cmd.title=行军指令
actors.hero.talent.move_cmd.desc=_+1:_ 获得_行军指令_权限，可将视野内全体友方士兵传送至指定位置。\n\n_+2:_ 在+1效果基础上，行军指令_不消耗指挥点_。\n\n_+3:_ 在+2效果基础上，行军指令可命令_当前层所有友方士兵_。
actors.hero.talent.stimpack_cmd.title=强化指令
actors.hero.talent.stimpack_cmd.desc=_+1:_ 获得_强化指令_权限，5回合内提升视野内所有友军士兵的伤害和命中率。\n\n_+2:_ 在+1效果基础上，战斗强化持续时间延长至10回合。\n\n_+3:_ 在+1效果基础上，战斗强化持续时间延长至15回合。
actors.hero.talent.engineer_cmd.title=工程指令
actors.hero.talent.engineer_cmd.desc=_+1:_ 获得_工程指令_权限，可在指定位置部署_机枪塔_。\n\n_+2:_ 在+1效果基础上，工程指令可额外建造_野战炮_。\n\n_+3:_ 在+1效果基础上，工程指令可额外建造_迫击炮_。
actors.hero.talent.promote_cmd.title=晋升指令
actors.hero.talent.promote_cmd.desc=_+1:_ 获得_晋升指令_权限，可将指定位置的友军士兵转职为_狙击手/盾牌兵/爆破手_之一。\n\n_+2:_ 在+1效果基础上，晋升指令会使目标友军士兵_完全恢复生命值_。\n\n_+3:_ 在+2效果基础上，晋升指令_减少1点指挥点消耗_。
actors.hero.talent.explosion_cmd.title=爆破指令
actors.hero.talent.explosion_cmd.desc=_+1:_ 解锁_爆破指令_，在指定位置设置延时10回合后引爆的爆炸物，爆炸影响范围_3格_。\n\n_+2:_ 在+1效果基础上，爆炸范围扩大至_6格_。\n\n_+3:_ 在+1效果基础上，爆炸范围扩大至_9格_。
actors.hero.talent.cas_cmd.title=空袭指令
actors.hero.talent.cas_cmd.desc=_+1:_ 获得_空袭指令_权限，可呼叫近距空中支援，从英雄位置向指定方向最多_5格_距离处引发爆炸。\n\n_+2:_ 在+1效果基础上，最大可指定距离提升至_8格_。\n\n_+3:_ 在+1效果基础上，最大可指定距离提升至_11格_。

actors.hero.abilities.medic.healinggenerator.name=再生装置
actors.hero.abilities.medic.healinggenerator.short_desc=_医务官_ 可激活_再生装置_，在持续时间内每次攻击敌人都能治疗周围友军
actors.hero.abilities.medic.healinggenerator.desc=医务官启动再生装置，在接下来的20回合每次攻击敌方时，可治疗周围的友军。相邻友军恢复8点生命值，距离越远恢复量越少。
actors.hero.abilities.medic.healinggenerator$regenbuff.name=再生装置
actors.hero.abilities.medic.healinggenerator$regenbuff.desc=当前再生装置已激活。每次近战攻击敌人时，将治疗周围的友军。治疗效果会随着与目标友军距离的增加而减弱。\n\n剩余回合: %s。
actors.hero.abilities.medic.angelwing.name=天使之翼
actors.hero.abilities.medic.angelwing.short_desc=医务官可以使用_天使之翼_在空中高速飞行。
actors.hero.abilities.medic.angelwing.desc=与天使同化，暂时展开天使之翼，在接下来的20回合内可以以3倍速度在空中飞行。
actors.hero.abilities.medic.angelwing$angelwingbuff.name=天使之翼
actors.hero.abilities.medic.angelwing$angelwingbuff.desc=你的背后闪耀着由光构成的天使之翼。当天使之翼的力量持续时，你可以悬浮在空中，并以平时3倍的速度移动。\n\n剩余回合: %s。
actors.hero.abilities.medic.gammarayemmit.name=突变射线
actors.hero.abilities.medic.gammarayemmit.short_desc=医务官可以释放强大的_突变射线_，将敌人转变为其他种类。
actors.hero.abilities.medic.gammarayemmit.desc=医务官可以瞬间增强伽马射线发射器的输出功率，放射出能将敌人彻底转变成其他种类敌人的伽马射线。\n\n被转变的敌人将不考虑原本身份，随机成为1~6大层的敌人之一。

actors.hero.talent.healing_amp.title=增幅装置
actors.hero.talent.healing_amp.desc=_+1:_ 基础恢复量增加 _+2_。\n\n_+2:_ 基础恢复量增加 _+4_ 。\n\n_+3:_ 基础恢复量增加 _+6_。\n\n_+4:_ 基础恢复量增加 _+8_。
actors.hero.talent.shield_gen.title=护盾装置
actors.hero.talent.shield_gen.desc=_+1:_ 每通过再生装置恢复1名友军生命值 获得_1_点护盾。\n\n_+2:_ 每通过再生装置恢复1名友军生命值 获得_2_点护盾。\n\n_+3:_ 每通过再生装置恢复1名友军生命值 获得_3_点护盾。\n\n_+4:_ 每通过再生装置恢复1名友军生命值 获得_4_点护盾。\n\n最多计算8个治疗目标。\n\n• 护盾可叠加至最大生命值的80%
actors.hero.talent.durable_gen.title=持久装置
actors.hero.talent.durable_gen.desc=_+1:_ 再生装置持续时间增加 _+25%_。\n\n_+2:_ 再生装置持续时间增加 _+50%_。\n\n_+3:_ 再生装置持续时间增加 _+75%_。\n\n_+4:_ 再生装置持续时间增加 _+100%_。

actors.hero.talent.light_like_feather.title=身轻如羽
actors.hero.talent.light_like_feather.desc=_+1:_ 天使之翼效果结束后 _2回合_ 内免疫坠落伤害 。\n\n_+2:_ 天使之翼效果结束后 _4回合_ 内免疫坠落伤害 。\n\n_+3:_ 天使之翼效果结束后 _6回合_ 内免疫坠落伤害 。\n\n_+4:_ 天使之翼效果结束后 _8回合_ 内免疫坠落伤害 。
actors.hero.talent.angels_bless.title=天神祝福
actors.hero.talent.angels_bless.desc=_+1:_ 使用天使之翼时获得 _10回合_ 祝福效果 。\n\n_+2:_ 使用天使之翼时获得 _20回合_ 祝福效果 。\n\n_+3:_ 使用天使之翼时获得 _30回合_ 祝福效果 。\n\n_+4:_ 使用天使之翼时获得 _40回合_ 祝福效果 。
actors.hero.talent.healing_wing.title=救赎之翼
actors.hero.talent.healing_wing.desc=_+1:_ 天使之翼效果持续期间 伽马射线发射器性能提升 _2倍_。\n\n_+2:_ 天使之翼效果持续期间 伽马射线发射器性能提升 _3倍_。\n\n_+3:_ 天使之翼效果持续期间 伽马射线发射器性能提升 _4倍_。\n\n_+4:_ 天使之翼效果持续期间 伽马射线发射器性能提升 _5倍_。

actors.hero.talent.transmog_bias.title=变异偏差
actors.hero.talent.transmog_bias.desc=_+1:_ 被强力射线击中的敌人变异为较弱敌人的概率 _小幅提升_。\n\n_+2:_ 被强力射线击中的敌人变异为较弱敌人的概率 _稍微提升_。\n\n_+3:_ 被强力射线击中的敌人变异为较弱敌人的概率 _大幅提升_。\n\n_+4:_ 被强力射线击中的敌人变异为较弱敌人的概率 _极大提升_。
actors.hero.talent.imprinting_effect.title=刻印效应
actors.hero.talent.imprinting_effect.desc=_+1:_ 变异敌人有 _10%_ 概率转化为友方单位。\n\n_+2:_ 变异敌人有 _20%_ 概率转化为友方单位。\n\n_+3:_ 变异敌人有 _30%_ 概率转化为友方单位。\n\n_+4:_ 变异敌人有 _40%_ 概率转化为友方单位。
actors.hero.talent.sheep_transmog.title=绵绵突变
actors.hero.talent.sheep_transmog.desc=_+1:_ 被强力射线击中的敌人有 _1%_ 概率变成魔法绵羊。\n\n_+2:_ 被强力射线击中的敌人有 _2%_ 概率变成魔法绵羊。\n\n_+3:_ 被强力射线击中的敌人有 _3%_ 概率变成魔法绵羊。\n\n_+4:_ 被强力射线击中的敌人有 _4%_ 概率变成魔法绵羊。

actors.hero.talent$firstaidtreatcooldown.name=冷却时间：紧急包扎
actors.hero.talent$firstaidtreatcooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合： %s。
actors.hero.talent$wndidentify.name=医师直觉
actors.hero.talent$wndidentify.desc=下列物品已鉴定：

actors.buffs.radioactivemutation.name=辐射损伤
actors.buffs.radioactivemutation.desc=该目标正暴露在致命辐射下，细胞正逐渐发生变异。\n\n放射性突变会缓慢侵蚀目标，使其逐渐死亡。若你正遭受此效果影响，必须设法找到彻底清除的方法...\n\n下次伤害剩余回合：_%s_。
actors.buffs.radioactivemutation.ondeath=你因放射性突变而死亡...

actors.buffs.stimpack.name=战斗增强
actors.buffs.stimpack.desc=战斗增强能大幅提升目标的战斗能力，使造成的伤害增加30%%，命中率提升60%%\n\n剩余回合：%s。

actors.buffs.firstaidbuff.action_name=应急处理
actors.buffs.firstaidbuff$firstaidbuffcooldown.name=冷却时间：应急处理
actors.buffs.firstaidbuff$firstaidbuffcooldown.desc_kill=你最近已使用过该能力，在下次击杀敌人前无法再次使用。
actors.buffs.firstaidbuff$firstaidbuffcooldown.desc=你最近已使用过该能力，在下次击杀敌人或冷却结束前无法再次使用。\n\n剩余回合：%s。

actors.buffs.painkiller.name=镇痛抵抗
actors.buffs.painkiller.desc=你获得了痛苦抗性，短时间内受到的伤害大幅降低。\n\n痛苦抗性持续期间，所有受到的伤害减少50%%。\n\n剩余回合：%s。

actors.buffs.command.action_name=作战指令
actors.buffs.command.bad_target=该位置无法指定。
actors.buffs.command.prompt=请选择指令位置
actors.buffs.command.title=请选择指令
actors.buffs.command.no_space=周围没有空间。
actors.buffs.command.no_allies=没有需要治疗的友方士兵。
actors.buffs.command.no_allies_to_cmd=没有可执行指令的友方士兵。
actors.buffs.command.charge_req=(%d指挥点)
actors.buffs.command$commandmove.recruit.name=增援指令
actors.buffs.command$commandmove.recruit.desc=集结1名友方士兵。每已有1名已召唤友方士兵，消耗指挥点+1。
actors.buffs.command$commandmove.medical_support.name=医疗指令
actors.buffs.command$commandmove.medical_support.desc=使视野内所有友方士兵恢复最大生命值的_20%_。
actors.buffs.command$commandmove.move.name=行军指令
actors.buffs.command$commandmove.move.desc1=指挥视野内所有友方士兵移动至指定位置。
actors.buffs.command$commandmove.move.desc2=指挥_当前层_所有友方士兵移动至指定位置。
actors.buffs.command$commandmove.stimpack.name=强化指令
actors.buffs.command$commandmove.stimpack.desc=对视野内所有友方士兵赋予持续_%d回合_的战斗强化剂效果。
actors.buffs.command$commandmove.engineer.name=工程指令
actors.buffs.command$commandmove.engineer.desc1=在指定位置部署_机枪塔_。
actors.buffs.command$commandmove.engineer.desc2=在指定位置部署_野战炮_。
actors.buffs.command$commandmove.engineer.desc3=在指定位置部署_迫击炮_。
actors.buffs.command$commandmove.promote.name=晋升指令
actors.buffs.command$commandmove.promote.desc=将指定位置的友方士兵变更为_狙击手、盾牌兵、榴弹兵_之一。
actors.buffs.command$commandmove.explosion.name=爆破指令
actors.buffs.command$commandmove.explosion.desc=在指定位置半径_%d格_范围内安装可引发爆炸的爆炸物。通过此能力击杀敌人可获得指挥点，且可超过上限
actors.buffs.command$commandmove.close_air_support.name=空袭指令
actors.buffs.command$commandmove.close_air_support.desc=从当前位置向指定方向请求最大_%d格_范围的即时爆炸的_空中支援_。通过此能力击杀敌人可获得指挥点，且可超过上限
actors.buffs.command$supportsoldier.name=支援士兵
actors.buffs.command$supportsoldier.desc=这是为支援你而派遣的友方正规军士兵。\n\n通常会优先攻击远处敌人，但也可攻击近处目标。
actors.buffs.command$supportsniper.name=支援狙击手
actors.buffs.command$supportsniper.desc=这是为支援你而派遣的友方正规军狙击手。\n\n通常会优先攻击远处敌人，但也可攻击近处目标。\n\n狙击手相比普通友军士兵，生命值和防御较低，但攻击力和精准度更高。
actors.buffs.command$supportshielder.name=支援盾牌兵
actors.buffs.command$supportshielder.desc=这是为支援你而派遣的友方正规军盾牌兵。\n\n通常会主动近身攻击敌人，并能吸引被攻击敌人的注意力。攻击时有概率击晕目标。\n\n盾牌兵相比普通友军士兵，攻击力较低，但防御力和生命值更高。
actors.buffs.command$supportbomber.name=支援榴弹兵
actors.buffs.command$supportbomber.desc=这是为支援你而派遣的友方正规军榴弹兵。\n\n通常会优先攻击远处敌人，但也可攻击近处目标。\n\n榴弹兵相比普通友军士兵，精准度稍低，但攻击力略高，并能发射爆炸弹药。

#v3.21.0
actors.blobs.thundercloud.desc=此处有引发雷电的乌云正在盘旋。

#3.22.0
actors.buffs.revealedlargearea.name=暴露区域
actors.buffs.revealedlargearea.desc=地牢的部分区域已暂时对你暴露，无论身处何处均可查看。\n\n剩余回合：%s。

### enchanter sentences
actors.hero.herosubclass.enchanter=附魔师
actors.hero.herosubclass.enchanter_short_desc=_附魔师_可获得将敌人减益效果转化为攻击的法术，并通过天赋赋予敌我双方各种减益与增益状态。
actors.hero.herosubclass.enchanter_desc=附魔师专注于学习强化自身与削弱敌人的各类法术。当对敌人使用_神导之光_、_时间扭曲_、_衰弱咒语_、_灵能冲击_时，会额外附加随机减益效果。根据消耗的充能值，可叠加施加多次减益。\n\n附魔师还会获得法术_暗影爆破_，消耗2点充能引爆目标所有减益状态，每个被清除的减益造成基于英雄等级的伤害。若以此法术击杀敌人，则返还消耗的充能值。

### cleric additional talents
actors.hero.talent.warding_light.title=守护之光
actors.hero.talent.warding_light.desc=_+1:_ 对受_神导之光_影响的敌人进行物理攻击时获得_3点护盾_。\n\n_+2:_ 对受_神导之光_影响的敌人进行物理攻击时获得_5点护盾_。
actors.hero.talent.warding_light.meta_desc=_其他职业获取此天赋时_， 对敌人使用法杖或神器后获得3/5点护盾。冷却时间20回合。

actors.hero.talent.divine_blast.title=神圣冲击
actors.hero.talent.divine_blast.desc=_+1:_ 牧师可以释放法术_神圣冲击_。消耗两点充能使指定位置的敌人眩晕并将周围目标击退_1格_。\n\n_+2:_ 牧师可以释放法术_神圣冲击_。消耗两点充能使指定位置的敌人眩晕并将周围目标击退_2格_。
actors.hero.talent.divine_blast.meta_desc=_其他职业获取此天赋时，_ 近战攻击有20%/40%概率将敌人击退1格。

### priest talents
actors.hero.talent.divine_ray.title=辉耀射线
actors.hero.talent.divine_ray.desc=_+1:_ 祭司可以释放法术_辉耀射线_，消耗3点充能发射 _4格_ 距离的射线。射线可穿透角色和地形，对敌人造成8-16点伤害并使其发光，同时为友军恢复8-16点生命值。\n\n_+2:_ 祭司可以释放法术_辉耀射线_，消耗3点充能发射 _8格_ 距离的射线。射线可穿透角色和地形，对敌人造成8-16点伤害并使其发光，同时为友军恢复8-16点生命值\n\n_+3:_ 祭司可以释放法术_辉耀射线_，消耗3点充能发射 _12格_ 距离的射线。射线可穿透角色和地形，对敌人造成8-16点伤害并使其发光，同时为友军恢复8-16点生命值\n\n辉耀射线揭示沿途路径并获得3回合视野。神圣射线对恶魔和亡灵敌人必定造成最大伤害。该法术过量治疗的生命值会转化为护盾。
actors.hero.talent.holy_bomb.title=神圣炸弹
actors.hero.talent.holy_bomb.desc=_+1:_ 祭司可以释放法术_神圣炸弹_，消耗_3_点充能在指定位置引爆一个神圣炸弹，并对敌人施加神导之光效果。\n\n_+2:_ 祭司可以释放法术_神圣炸弹_，消耗_2_点充能在指定位置引爆一个神圣炸弹，并对敌人施加神导之光效果。\n\n_+3:_ 祭司可以释放法术_神圣炸弹_，消耗_1_点充能在指定位置引爆一个神圣炸弹，并对敌人施加神导之光效果。\n\n该天赋有50回合冷却时间。
actors.hero.talent.resurrection.title=复活宣言
actors.hero.talent.resurrection.desc=_+1:_ 祭司可以释放法术_复活宣言_，消耗3点充能对自己施加_3_回合复活宣言复活效果，期间死亡会立刻复活。\n\n_+2:_ 祭司可以释放法术_复活宣言_，消耗3点充能对自己施加_4_回合复活宣言复活效果，期间死亡会立刻复活。\n\n_+3:_ 祭司可以释放法术_复活宣言_，消耗3点充能对自己施加_5_回合复活宣言复活效果，期间死亡会立刻复活。\n\n复活时恢复如同使用被祝福十字架的40%治疗量，成功触发复活后进入300回合冷却。

### paladin talents
actors.hero.talent.holy_mantle.title=庇佑帷幕
actors.hero.talent.holy_mantle.desc=_+1:_ 圣骑士可以释放法术_庇佑帷幕_，消耗1点充能使目标下一次受到的任何伤害减少_50%_。\n\n_+2:_ 圣骑士可以释放法术_庇佑帷幕_，消耗1点充能使目标下一次受到的任何伤害减少_75%_。\n\n_+3:_ 圣骑士可以释放法术_庇佑帷幕_，消耗1点充能使目标下一次受到的任何伤害减少_100%_。
actors.hero.talent.power_of_life.title=誓血圣约
actors.hero.talent.power_of_life.desc=_+1:_ 圣骑士可以释放法术_誓血圣约_，消耗2点充能和圣骑士当前生命值的_20%_，并给予相当于消耗量两倍的护盾。该效果提供的护盾持续期间，造成物理伤害的_20%_将转化为生命值恢复。\n_+2:_ 圣骑士可以释放法术_誓血圣约_，消耗2点充能和圣骑士当前生命值的_40%_，并给予相当于消耗量两倍的护盾。该效果提供的护盾持续期间，造成物理伤害的_40%_将转化为生命值恢复。\n\n_+3:_ 圣骑士可以释放法术_誓血圣约_，消耗2点充能和圣骑士当前生命值的_60%_，并给予相当于消耗量两倍的护盾。该效果提供的护盾持续期间，造成物理伤害的_60%_将转化为生命值恢复。\n\n施放誓血圣约需要至少保留5点生命值。通过誓血圣约效果恢复的生命值不能超过消耗的生命值。
actors.hero.talent.induce_aggro.title=圣战宣告
actors.hero.talent.induce_aggro.desc=_+1:_ 圣骑士可以使用法术_圣战宣告_，消耗1点充能对目标施加 _3回合_众矢之的。对友军效果持续_3倍_时间。\n\n_+2:_ 圣骑士可以使用法术_圣战宣告_，消耗1点充能对目标施加 _4回合_众矢之的。对友军效果持续_3倍_时间。\n\n_+3:_ 圣骑士可以使用法术_圣战宣告_，消耗1点充能对目标施加 _5回合_众矢之的。对友军效果持续_3倍_时间。

### enchanter talents
actors.hero.talent.time_amp.title=时间扭曲
actors.hero.talent.time_amp.desc=_+1:_ 附魔师可以使用法术_时间扭曲_，消耗1点充能对敌人施加_4回合_迟缓效果或对友军施加_2回合_时间气泡效果。\n\n_+2:_ 附魔师可以使用法术_时间扭曲_，消耗1点充能对敌人施加_6回合_迟缓效果或对友军施加_3回合_时间气泡效果。\n\n_+3:_ 附魔师可以使用法术_时间扭曲_，消耗1点充能对敌人施加_8回合_迟缓效果或对友军施加_4回合_时间气泡效果。
actors.hero.talent.weakening_hex.title=衰弱咒语
actors.hero.talent.weakening_hex.desc=_+1:_ 附魔师可以使用法术_衰弱咒语_，消耗2点充能使目标敌人获得10回合_幻惑_。\n_+2:_ 附魔师可以使用法术_衰弱咒语_，消耗2点充能使目标敌人获得10回合_幻惑、虚弱_。\n\n_+3:_ 附魔师可以使用法术_衰弱咒语_，消耗2点充能使目标敌人获得10回合_幻惑、虚弱、易伤_。2
actors.hero.talent.stun.title=灵能冲击
actors.hero.talent.stun.desc=_+1:_ 附魔师可以使用法术_灵能冲击_，消耗1点充能使目标麻痹_4回合_。\n\n_+2:_ 附魔师可以使用法术_灵能冲击_，消耗1点充能使目标麻痹_5回合_。\n\n_+3:_ 附魔师可以使用法术_灵能冲击_，消耗1点充能使目标麻痹_6回合_。
actors.hero.talent.thunder_imbue.title=雷电附体
actors.hero.talent.thunder_imbue.desc=_+1:_ 附魔师可以使用法术_雷电附体_，消耗2点充能使目标获得_10回合_雷电同化效果。\n\n_+2:_ 附魔师可以使用法术_雷电附体_，消耗2点充能使目标获得_20回合_雷电同化效果。\n\n_+3:_ 附魔师可以使用法术_雷电附体_，消耗2点充能使目标获得_30回合_雷电同化效果。
actors.hero.talent.arcane_armor.title=奥术护甲
actors.hero.talent.arcane_armor.desc=_+1:_ 附魔师可以使用法术_奥术护甲_，消耗1点充能获得0-1的_每10回合_衰减的奥术护甲效果。\n\n_+2:_  附魔师可以使用法术_奥术护甲_，消耗1点充能获得0-1的_每20回合_衰减的奥术护甲效果。\n\n_+3:_  附魔师可以使用法术_奥术护甲_，消耗1点充能获得0-1的_每30回合_衰减的奥术护甲效果。\n最大魔法防御力不得超过英雄当前等级
actors.hero.talent.enchant.title=附魔奇术
actors.hero.talent.enchant.desc=_+1:_ 附魔师可以释放法术_附魔奇术_，消耗6点充能为指定武器或护甲附魔。\n\n_+2:_ 附魔师可以释放法术_附魔奇术_，消耗5点充能为指定武器或护甲附魔。\n\n_+3:_ 附魔师可以释放法术_附魔奇术_，消耗4点充能为指定武器或护甲附魔。\n\n仅可对已鉴定且未诅咒的武器或护甲施放。

### cleric additional spells
actors.hero.spells.clericspell.no_target=没有目标
actors.hero.spells.clericspell.not_in_fov=无法指定视野外的位置。

actors.hero.spells.divineblast.name=神圣冲击
actors.hero.spells.divineblast.short_desc=将指定位置周围的敌人击退。
actors.hero.spells.divineblast.desc=牧师可集中精神，在视野范围内指定位置引发冲击波爆炸。\n\n位于爆炸中心的敌人将陷入短暂昏迷，周围单位会被击退_%d格_距离。

actors.hero.spells.divineray.name=辉耀射线
actors.hero.spells.divineray.short_desc=发射光束，对敌人造成伤害并为友军进行治疗。
actors.hero.spells.divineray.desc=祭司可以向期望的方向发射一条穿透角色和墙壁的辉耀光线，长度为_%d格_。\n\n辉耀光线会对经过的所有敌人造成8-16的伤害并使其发光，为友军恢复8-16的体力。亡灵生物和恶魔总是受到最大伤害，超出的治疗量会变成护盾。\n\n光线经过的周围会揭露秘密，并在3回合内保持在祭司的视野中可见。
actors.hero.spells.divineray.cannot_self=辉耀光线无法对自己发射。

actors.hero.spells.holybombspell.name=神圣炸弹
actors.hero.spells.holybombspell.short_desc=对恶魔和亡灵造成强力伤害的爆炸。
actors.hero.spells.holybombspell.desc=牧师可在视野内任意位置召唤神圣炸弹并立即引爆。\n\n受到该爆炸伤害的敌人将被致盲。
actors.hero.spells.holybombspell$holybombspellcooldown.name=神圣炸弹冷却中
actors.hero.spells.holybombspell$holybombspellcooldown.desc=牧师最近已施放过神圣炸弹，需等待冷却结束后再次施放。\n\n剩余回合数：%s。


actors.hero.spells.resurrection.name=复活宣言
actors.hero.spells.resurrection.short_desc=短时间内获得死亡免疫。
actors.hero.spells.resurrection.desc=牧师获得_%d回合_的复活效果，期间免疫死亡。\n\n当复活效果期间牧师生命值归0时，将触发祝福的十字架效果，并以常规的祝福十字架的40%%生命值复活。\n\n复活效果优先级高于神圣十字架。
actors.hero.spells.resurrection$resurrectionbuff.name=复活宣言
actors.hero.spells.resurrection$resurrectionbuff.desc=你正受到神的庇护，处于不死状态！\n\n当复活效果持续期间生命值归零时，将恢复最大生命值的10%%并获得短暂伤害免疫，从而战胜死亡。\n\n剩余回合：%s。
actors.hero.spells.resurrection$resurrectioncooldown.name=复活冷却中
actors.hero.spells.resurrection$resurrectioncooldown.desc=牧师近期已通过复活效果战胜死亡，需等待冷却结束后再次触发。\n\n剩余回合数：%s。

actors.hero.spells.holymantle.name=庇佑帷幕
actors.hero.spells.holymantle.short_desc=为目标赋予1次伤害减免效果。
actors.hero.spells.holymantle.desc=圣骑士可使用庇佑帷幕，对指定目标赋予1次_%d%%_伤害减免的庇佑帷幕效果。\n\n庇佑帷幕效果将在承受任何类型的伤害时触发减免后消失，需注意饥饿伤害。
actors.hero.spells.holymantle$holymantlebuff.name=庇佑帷幕
actors.hero.spells.holymantle$holymantlebuff.desc=该目标正被庇佑帷幕的力量所庇护！\n\n庇佑帷幕将减免下一次受到的_%d%%_任何类型伤害，随后消失。

actors.hero.spells.poweroflife.name=誓血圣约
actors.hero.spells.poweroflife.short_desc=立即将部分生命值转化为大量护盾值。
actors.hero.spells.poweroflife.desc=圣骑士使用生命之力，消耗_%1$dHP_并立即获得_%2$d_点护盾。护盾存在期间，每次物理攻击敌人时将按造成伤害的_%3$d%%_比例恢复生命值。\n\n使用生命之力需至少5点生命值，且恢复量不会超过消耗值。
actors.hero.spells.poweroflife$poweroflifebarrier.name=生命护盾
actors.hero.spells.poweroflife$poweroflifebarrier.desc=你已将生命力转化为临时护盾，可获得更强伤害抵御能力。\n\n生命护盾持续期间，每次物理攻击敌人时将恢复造成伤害的_%1$d%%_。\n\n当前护盾值：%2$d。\n可恢复生命值：%3$d。

actors.hero.spells.induceaggro.name=圣战宣告
actors.hero.spells.induceaggro.short_desc=短时间内强制所有攻击指向指定目标。
actors.hero.spells.induceaggro.desc=圣骑士使用圣战宣告，使其他角色强制攻击指定目标，施加_众矢之的_效果_%d回合_。\n\n对友军单位效果持续时间变为3倍，对boss和小型boss效果时间固定2回合。

actors.hero.spells.spellburst.name=暗影爆破
actors.hero.spells.spellburst.short_desc=清除目标减益并造成伤害。
actors.hero.spells.spellburst.desc=附魔师使用暗影爆破清除目标所有减益，每个被清除的减益造成_%1$d-%2$d_点魔法伤害，对友军始终造成最低伤害。\n\n法术爆发伤害随英雄等级提升而增强。
actors.hero.spells.spellburst.no_debuffs=没有可引爆的减益效果！
actors.hero.spells.spellburst.rankings_desc=因引爆自身减益效果而死亡
actors.hero.spells.spellburst.ondeath=你因暗影爆破而死亡...

actors.hero.spells.timeamp.name=时间扭曲
actors.hero.spells.timeamp.short_desc=使敌人减速或让友军立即行动。
actors.hero.spells.timeamp.desc=附魔师可以用时间扭曲对敌人使用赋予_%1$d回合_的迟缓，或者对友军使用赋予_%2$d回合_的时间气泡。\n\n已经减速的敌人或者拥有时间气泡的友军无法使用。
actors.hero.spells.timeamp.already_have=该目标已处于迟缓或时间气泡效果状态。

actors.hero.spells.weakeninghex.name=衰弱咒语
actors.hero.spells.weakeninghex.short_desc=对目标施加多种减益效果。
actors.hero.spells.weakeninghex.desc=附魔师使用衰弱咒语对指定目标赋予5回合的_%s_效果。

actors.hero.spells.stun.name=灵能冲击
actors.hero.spells.stun.short_desc=使目标麻痹。
actors.hero.spells.stun.desc=附魔师使用灵能冲击使指定目标麻痹_%d回合_。
actors.hero.spells.stun.immune=该目标似乎无法被昏迷。
actors.hero.spells.thunderimbuespell.name=雷电附体
actors.hero.spells.thunderimbuespell.short_desc=为目标附加雷电效果。
actors.hero.spells.thunderimbuespell.desc=附魔师使用雷电附体，使指定目标获得_%d回合_的雷电附体效果，使其物理攻击造成额外伤害。

actors.hero.spells.thunderimbue.name=雷电附体
actors.hero.spells.thunderimbue.short_desc=对目标施加闪电同化效果。
actors.hero.spells.thunderimbue.desc=附魔师使用闪电同化对指定目标赋予_%d回合_的闪电同化效果，使攻击附加额外伤害。

actors.hero.spells.arcanearmorspell.name=奥术护甲
actors.hero.spells.arcanearmorspell.short_desc=暂时提升魔法防御力。
actors.hero.spells.arcanearmorspell.desc=附魔师使用奥术护甲使自身魔法防御力增加0-1点，且_%d回合_衰减1点。多次使用可提升最大魔法防御力。\n\n最大魔法防御力不得超过英雄等级。

actors.hero.spells.enchant.name=附魔奇术
actors.hero.spells.enchant.short_desc=为指定武器或护甲附魔。
actors.hero.spells.enchant.desc=附魔师可以使用附魔奇术对指定装备附加随机附魔或刻印。\n\n赋予只能对已鉴定且未诅咒的武器和防具使用。

###v3.29.0
actors.hero.talent$protectiveslashcooldown.name=冷却时间：远距护盾
actors.hero.talent$protectiveslashcooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合： %s。
actors.hero.talent$kineticattacktracker.name=荡势打击
actors.hero.talent$kineticattacktracker.desc=最近你使用过藤蔓绳索，用近战武器攻击敌人时将造成额外伤害。\n\n剩余回合：%s。
actors.hero.talent$wardinglightcooldown.name=冷却时间：守护之光
actors.hero.talent$wardinglightcooldown.desc=你最近使用了这个天赋，需要等待一段时间才能再次使用。\n\n剩余回合：%s。

###v3.34.0
actors.hero.heroclass.archer=弓手
actors.hero.heroclass.archer_desc_short=弓手是远程攻击的达人，能将近战武器进行_分解_，制作出随机的投掷武器。
actors.hero.heroclass.archer_desc=弓手可以分解近战武器来_制造投掷武器_。\n\n弓手在投掷武器和箭矢上获得_额外暴击几率_，且每次升级时暴击几率都会增加。\n\n弓手开局时携带能赋予箭矢额外效果的_弓手箭筒_。\n\n弓手开局时还携带_破旧的短弓_、3条弹链、布甲、水袋与绒布包。\n\n弓手开局鉴定的物品有：\n_-_ 鉴定卷轴\n_-_ 极速药水\n_-_ 探地卷轴
actors.hero.heroclass.archer_unlock=要解锁弓手，请获取_可装备的弓类武器_。

actors.hero.herosubclass.bowmaster=弓箭大师
actors.hero.herosubclass.bowmaster_short_desc=_弓箭大师_能够提升使用弓的能力，向箭筒注入更多种类的合剂和魔药。
actors.hero.herosubclass.bowmaster_desc=弓箭大师能够为弓手的箭筒注入魔药与合剂，且不会感受到拉弓疲劳。\n\n弓箭大师在使用弓类武器发射箭矢时，每次都能积累箭矢强化层数，每层都会使箭矢造成更多伤害。\n\n当箭矢强化层数达到4层及以上时，可以使用强力射击使下次发射的箭矢必定命中，并造成+100%的额外伤害。之后层数将重置。
actors.hero.herosubclass.juggler=杂耍者
actors.hero.herosubclass.juggler_short_desc=_杂耍者_能够将投掷武器抛掷到空中并来回杂耍，并一次性将其掷出。
actors.hero.herosubclass.juggler_desc=杂耍者朝自身所在位置投掷投掷武器时，武器不会落地，而是会开始被其以杂耍的方式耍弄起来。\n\n最多可同时杂耍3件投掷武器，并且能在单个回合内将所有正在杂耍的投掷武器全部投掷出去。
actors.hero.herosubclass.sharpshooter=神射手
actors.hero.herosubclass.sharpshooter_short_desc=_神射手_能够用弓或枪一次性连射3发。
actors.hero.herosubclass.sharpshooter_desc=神射手可以消耗1回合，对当前装备的远程武器（弓、枪）发动能连射3次的连射攻击。若用连射击杀敌人，则可再次使用该技能。\n\n连射分为两种类型，指定特定位置时，会向该位置用当前装备的远程武器发射3次；指定自身位置时，则会向视野内可攻击的随机敌人，用当前装备的远程武器分最多3次进行发射。若没有敌人，则不会再继续发射。

actors.hero.abilities.archer.dashability.name=快速突进
actors.hero.abilities.archer.dashability.short_desc=弓手可以使用_快速突进_，无需消耗回合即可移动短距离。 
actors.hero.abilities.archer.dashability.desc=弓手可施展快速突进，最多跨越4格距离，无视路径上的敌人与危险地形，直接移动至目标位置。
actors.hero.abilities.archer.dashability.self_target=无法朝自身所在位置发动快速突进。
actors.hero.abilities.archer.dashability.there_is_something=那个位置有东西。
actors.hero.abilities.archer.dashability.rooted=你无法移动！
actors.hero.abilities.archer.dashability.bad_position=无法朝那个位置发动快速突进。
actors.hero.abilities.archer.hunt.name=夺命狩猎
actors.hero.abilities.archer.hunt.short_desc=弓手可以对敌人使用_夺命狩猎_，并赋予各种负面效果。
actors.hero.abilities.archer.hunt.desc=弓手对指定敌人赋予10回合的恐惧、易伤。
actors.hero.abilities.archer.snipe.name=狙击箭矢
actors.hero.abilities.archer.snipe.short_desc=弓手可以使用_狙击箭矢_，制造并发射强力的箭矢。
actors.hero.abilities.archer.snipe.desc=弓箭手向指定位置发射造成10-40伤害的狙击箭矢，根据距离造成最高x2.5倍的伤害，并赋予10回合的残废。
actors.hero.abilities.archer.snipe.self_target=无法向自身所在位置发射。
actors.hero.abilities.archer.snipe.bad_position=无法向该位置发射。

actors.hero.talent.force_saving.title=蓄势一餐
actors.hero.talent.force_saving.desc=_+1:_ 用餐后下一次近战攻击将敌人击退_2格_。\n\n_+2:_ 用餐后下一次近战攻击将敌人击退_3格_。
actors.hero.talent.archers_intuition.title=弓手直觉
actors.hero.talent.archers_intuition.desc=_+1:_ 弓类武器在装备时_立即鉴定_。\n\n_+2:_ 弓类武器在拾取时立即得知_是否被诅咒_。获得_短弓_。
actors.hero.talent.archers_intuition.meta_desc=_其他职业获得此特性时_，即使强化该特性也不会提供短弓。
actors.hero.talent.leg_sweep.title=膝盖中箭
actors.hero.talent.leg_sweep.desc=_+1:_ 如果对敌人首次攻击为伏击，则赋予_2回合_的残废。\n\n_+2:_ 如果对敌人首次攻击为伏击，则赋予_3回合_的残废。\n\n对飞行敌人无效。
actors.hero.talent.survival_technique.title=生存策略
actors.hero.talent.survival_technique.desc=_+1:_ 拾取露珠时_获得5点护盾_。\n\n_+2:_ 拾取露珠时_获得8点护盾_。
actors.hero.talent.dexterity.title=熟练射术
actors.hero.talent.dexterity.desc=_+1:_ 箭矢可重复使用的概率增加_+13%_。\n\n_+2:_ 箭矢可重复使用的概率增加_+25%_。

actors.hero.talent.fighting_meal.title=斗志一餐
actors.hero.talent.fighting_meal.desc=_+1:_ 弓手进食仅消耗1回合，且进食时获得_2回合_的激素涌动。\n\n_+2:_ 弓手进食仅消耗1回合，且进食时获得_3回合_的激素涌动。
actors.hero.talent.fully_potion.title=药剂充饥
actors.hero.talent.fully_potion.desc=_+1:_ 饮用药剂时恢复_30回合_的饥饿值。\n\n_+2:_ 饮用药剂时恢复_50回合_的饥饿值。\n\n将药水投掷至其他位置时不触发此效果。
actors.hero.talent.nature_friendly.title=自然亲和
actors.hero.talent.nature_friendly.desc=_+1:_ 踩踏长草时获得提供_3_点防御力的树肤。\n\n_+2:_ 踩踏长草时获得提供_5_点防御力的树肤。
actors.hero.talent.pushback.title=退敌打击
actors.hero.talent.pushback.desc=_+1:_ 近战攻击时40%概率将敌人击退_1格_。\n\n_+2:_ 近战攻击时40%概率将敌人击退_2格_。\n\n偷袭时概率提升至100%。\n装备弓类武器时改为增加击退距离。
actors.hero.talent.archers_foresight.title=先见之眼
actors.hero.talent.archers_foresight.desc=_+1：_弓手进入新楼层时，有_50%几率_揭示并发现该层的所有陷阱。\n\n_+2：_弓手进入新楼层时，有_80%几率_揭示并发现该层的所有陷阱。
actors.hero.talent.powerful_crit.title=强力投掷
actors.hero.talent.powerful_crit.desc=_+1:_ 投掷武器的暴击伤害增加_+10%_。\n\n_+2:_ 投掷武器的暴击伤害增加_+20%_。

actors.hero.talent.makeshift_bow.title=应急制弓
actors.hero.talent.makeshift_bow.desc=_+1:_ 获得_弓_。\n\n_+2:_ 获得_长弓_。\n\n_+3:_ 获得_巨弓_。
actors.hero.talent.makeshift_bow.meta_desc=_其他职业获得此特性时_，改为增加投掷类武器的命中率+20%/+40%/+60%。
actors.hero.talent.followup_shoot.title=连携射击
actors.hero.talent.followup_shoot.desc=_+1:_ 近战武器命中时，5回合内对该敌人造成的_投掷攻击伤害增加10%_。\n\n_+2:_ 近战武器命中时，5回合内对该敌人造成的_投掷攻击伤害增加20%_。\n\n_+3:_ 近战武器命中时，5回合内对该敌人造成的_投掷攻击伤害增加30%_。

actors.hero.talent.fastshot.title=应急射击
actors.hero.talent.fastshot.desc=_+1:_ 当没有箭矢强化效果时，可发射具有_20%_伤害量的箭矢且不消耗回合。\n\n_+2:_ 当没有箭矢强化效果时，可发射具有_40%_伤害量的箭矢且不消耗回合。\n\n_+3:_ 当没有箭矢强化效果时，可发射具有_60%_伤害量的箭矢且不消耗回合。
actors.hero.talent.expanded_power.title=强弓解放
actors.hero.talent.expanded_power.desc=_+1:_ 箭矢强化的最大层数增加_+1_。\n\n_+2:_ 箭矢强化的最大层数增加_+2_。\n\n_+3:_ 箭矢强化的最大层数增加_+3_。
actors.hero.talent.moving_focus.title=蓄势待发
actors.hero.talent.moving_focus.desc=_+1:_ 在积累箭矢强化叠加层后立即移动时，有_80%概率保留_箭矢强化叠加层。\n\n_+2:_ 在积累箭矢强化叠加层后立即移动时，_保留_箭矢强化叠加层。\n\n_+3:_ 在积累箭矢强化叠加层后立即移动时，箭矢强化叠加层_+1_。\n\n若连续移动而不发射箭矢，叠加层将消失。
actors.hero.talent.bottle_expansion.title=瓶装扩容
actors.hero.talent.bottle_expansion.desc=_+1：_弓箭大师的箭筒每瓶药剂可多强化_3支箭_。\n\n_+2：_弓箭大师的箭筒每瓶药剂可多强化_6支箭_。\n\n_+3：_弓箭大师的箭筒每瓶药剂可多强化_9支箭_。
actors.hero.talent.spectre_arrow.title=宿灵箭矢
actors.hero.talent.spectre_arrow.desc=_+1:_ 使用弓类武器发射箭矢时，有_17%概率_不消耗弹药。\n\n_+2:_ 使用弓类武器发射箭矢时，有_33%概率_不消耗弹药。\n\n_+3:_ 使用弓类武器发射箭矢时，有_50%概率_不消耗弹药。\n\n发射箭矢至少需要1个弹药。
actors.hero.talent.unencumbered_step.title=无碍步履
actors.hero.talent.unencumbered_step.desc=_+1:_ 当周围2格内没有敌人时，移动速度增加_10%_。\n\n_+2:_ 当周围2格内没有敌人时，移动速度增加_20%_。\n\n_+3:_ 当周围2格内没有敌人时，移动速度增加_30%_。

actors.hero.talent.habitual_hand.title=娴熟把戏
actors.hero.talent.habitual_hand.desc=_+1:_ 击杀敌人时立即杂耍_1发_箭矢。\n\n_+2:_ 击杀敌人时立即杂耍_2发_箭矢。\n\n_+3:_ 击杀敌人时立即杂耍_3发_箭矢。\n\n回收的箭矢继承击杀时装备弓箭的性能，若当时装备非弓箭类武器，则获得与当前层数同级+0性能的弓箭。
actors.hero.talent.swift_juggling.title=得心应手
actors.hero.talent.swift_juggling.desc=_+1:_ 杂耍投掷武器时消耗的回合数减少_33%_。\n\n_+2:_ 杂耍投掷武器时消耗的回合数减少_67%_。\n\n_+3:_ 杂耍投掷武器时消耗的回合数减少_100%_。
actors.hero.talent.skillful_juggling.title=危险杂技
actors.hero.talent.skillful_juggling.desc=_+1:_ 可杂耍的投掷武器最大数量增加_1个_。\n\n_+2:_ 可杂耍的投掷武器最大数量增加_2个_。\n\n_+3:_ 可杂耍的投掷武器最大数量增加_3个_。
actors.hero.talent.focus_maintain.title=专注维持
actors.hero.talent.focus_maintain.desc=_+1:_ 杂耍期间的近战命中率变为_-30%_。\n\n_+2:_ 杂耍期间的近战命中率变为_-10%_。\n\n_+3:_ 杂耍期间的近战命中率变为_+10%_。
actors.hero.talent.fancy_performance.title=精彩表演
actors.hero.talent.fancy_performance.desc=_+1:_ 对敌人所在位置进行杂耍攻击时，在该位置掉落_5金币_。\n\n_+2:_ 对敌人所在位置进行杂耍攻击时，在该位置掉落_10金币_。\n\n_+3:_ 对敌人所在位置进行杂耍攻击时，在该位置掉落_15金币_。\n\n即使敌人回避了攻击也会掉落金币，但若攻击导致敌人死亡则不会掉落金币。
actors.hero.talent.tour_performance.title=巡回演出
actors.hero.talent.tour_performance.desc=_+1:_ 每次移动时有_1%_概率杂耍1发箭矢。\n\n_+2:_ 每次移动时有_2%_概率杂耍1发箭矢。\n\n_+3:_ 每次移动时有_3%_概率杂耍1发箭矢。\n\n回收的箭矢继承装备弓箭的性能，若当时装备非弓箭类武器，则获得与当前层数同级+0性能的弓箭。

actors.hero.talent.hurricane.title=连射逐风
actors.hero.talent.hurricane.desc=_+1:_ 通过连射击杀敌人时，获得_1回合_的超高速状态。\n\n_+2:_ 通过连射击杀敌人时，获得_2回合_的超高速状态。\n\n_+3:_ 通过连射击杀敌人时，获得_3回合_的超高速状态。
actors.hero.talent.perfect_shot.title=持续射击
actors.hero.talent.perfect_shot.desc=_+1:_ 连射后装填_1发_弹药。或者连射时有_33%_概率可重复使用箭矢。\n\n_+2:_ 连射后装填_2发_弹药。或者连射时有_67%_概率可重复使用箭矢。\n\n_+3:_ 连射后装填_3发_弹药。或者连射时有_100%_概率可重复使用箭矢。
actors.hero.talent.focus_shot.title=集中射击
actors.hero.talent.focus_shot.desc=_+1:_ 投掷武器命中敌人_7次_后可再次使用连射。\n\n_+2:_ 投掷武器命中敌人_5次_后可再次使用连射。\n\n_+3:_ 投掷武器命中敌人_3次_后可再次使用连射。
actors.hero.talent.bullseye.title=百发百中
actors.hero.talent.bullseye.desc=_+1:_ 连射的命中率提升至_2倍_。\n\n_+2:_ 连射的命中率提升至_5倍_。\n\n_+3:_ 连射_必定命中_。
actors.hero.talent.ranged_lethality.title=穿杨一击
actors.hero.talent.ranged_lethality.desc=_+1:_ 连射攻击会秒杀最大生命值低于_10%_的敌人。\n\n_+2:_ 连射攻击会秒杀最大生命值低于_20%_的敌人。\n\n_+3:_ 连射攻击会秒杀最大生命值低于_30%_的敌人。
actors.hero.talent.channeling.title=引电投掷
actors.hero.talent.channeling.desc=_+1:_ 投掷武器有_10%_概率引发落雷。\n\n_+2:_ 投掷武器有_20%_概率引发落雷。\n\n_+3:_ 投掷武器有_30%_概率引发落雷。

actors.hero.talent.longrange_dash.title=远程冲刺
actors.hero.talent.longrange_dash.desc=_+1:_ 突进的最大距离增加_2格_。\n\n_+2:_ 突进的最大距离增加_4格_。\n\n_+3:_ 突进的最大距离增加_6格_。\n\n_+4:_ 突进的最大距离增加_8格_。
actors.hero.talent.dust_spread.title=扬尘迷眼
actors.hero.talent.dust_spread.desc=_+1:_ 对突进路径上的敌人施加_2回合_的致盲效果。\n\n_+2:_ 对突进路径上的敌人施加_4回合_的致盲效果。\n\n_+3:_ 对突进路径上的敌人施加_6回合_的致盲效果。\n\n_+4:_ 对突进路径上的敌人施加_8回合_的致盲效果。
actors.hero.talent.kinetic_dash.title=突进惯性
actors.hero.talent.kinetic_dash.desc=_+1:_ 连续使用突进时，减少_10%_的充能消耗。\n\n_+2:_ 连续使用突进时，减少_21%_的充能消耗。\n\n_+3:_ 连续使用突进时，减少_33%_的充能消耗。\n\n_+4:_ 连续使用突进时，减少_46%_的充能消耗。

actors.hero.talent.chase.title=持续追逐
actors.hero.talent.chase.desc=_+1:_ 狩猎赋予的恐惧和易伤效果增加_5回合_。\n\n_+2:_ 狩猎赋予的恐惧和易伤效果增加_10回合_。\n\n_+3:_ 狩猎赋予的恐惧和易伤效果增加_15回合_。\n\n_+4:_ 狩猎赋予的恐惧和易伤效果增加_20回合_。
actors.hero.talent.chill_back.title=心惊胆寒
actors.hero.talent.chill_back.desc=_+1:_ 狩猎额外赋予目标_3回合_的冻伤效果。\n\n_+2:_ 狩猎额外赋予目标_6回合_的冻伤效果。\n\n_+3:_ 狩猎额外赋予目标_9回合_的冻伤效果。\n\n_+4:_ 狩猎额外赋予目标_12回合_的冻伤效果。
actors.hero.talent.cannot_escape.title=狩距掌控
actors.hero.talent.cannot_escape.desc=_+1:_ 使用狩猎时获得_2回合_的极速效果。\n\n_+2:_ 使用狩猎时获得_4回合_的极速效果。 \n\n_+3:_ 使用狩猎时获得_6回合_的极速效果。\n\n_+4:_ 使用狩猎时获得_8回合_的极速效果。

actors.hero.talent.enhanced_arrow.title=弓弦拉满
actors.hero.talent.enhanced_arrow.desc=_+1:_ 狙击箭矢的基础伤害量变为_15-50_。\n\n_+2:_ 狙击箭矢的基础伤害量变为_20-60_。\n\n_+3:_ 狙击箭矢的基础伤害量变为_25-70_。\n\n_+4:_ 狙击箭矢的基础伤害量变为_25-80_。
actors.hero.talent.accurate_snipe.title=穿墙狙击
actors.hero.talent.accurate_snipe.desc=_+1:_ 狙击箭矢可以穿透_1层_坚固地形，且命中率提升_50%_。\n\n_+2:_ 狙击箭矢可以穿透_2层_坚固地形，且命中率提升_100%_。\n\n_+3:_ 狙击箭矢可以穿透_3层_坚固地形，且命中率提升_150%_。 \n\n_+4:_ 狙击箭矢可以穿透_4层_坚固地形，且命中率提升_200%_。
actors.hero.talent.knocking_arrow.title=冲击箭矢
actors.hero.talent.knocking_arrow.desc=_+1:_ 狙击箭矢有_25%_概率赋予敌人麻痹效果而非残废。\n\n_+2:_ 狙击箭矢有_50%_概率赋予敌人麻痹效果而非残废。 \n\n_+3:_ 狙击箭矢有_75%_概率赋予敌人麻痹效果而非残废。\n\n_+4:_ 狙击箭矢有_100%_概率赋予敌人麻痹效果而非残废。

actors.hero.talent$followupshoottracker.name=连携射击
actors.hero.talent$followupshoottracker.desc=你最近使用近战武器攻击过敌人。若用投掷武器攻击相同目标，将造成额外伤害。\n\n剩余回合：%s。
actors.hero.talent$forcesavingtracker.name=蓄势一餐
actors.hero.talent$forcesavingtracker.desc=你正在积蓄力量，下次近战攻击时将全力击退敌人。
actors.buffs.bowmasterskill.name=箭矢强化
actors.buffs.bowmasterskill.desc=你正在连续射击并将更强的力量注入箭矢。箭矢强化会在每次发射时叠加，若不发射箭矢则立即解除。\n\n额外伤害量：_%s_。
actors.buffs.bowmasterskill.action_name=强化射击
actors.buffs.juggling.name=杂耍
actors.buffs.juggling.desc=你正在用单手抛接投掷类武器。可在任意时刻将正在抛接的所有武器一次性掷出！\n\n投掷武器时，无论当前抛接的投掷类武器特性如何，均会消耗1回合。若尝试抛接的武器数量超过上限，则最早开始抛接的武器会被收回。\n\n当前抛接中的投掷类武器：_%s_。
actors.buffs.juggling.action_name=抛接杂耍
actors.buffs.sharpshooterbuff.action_name=连射
actors.buffs.sharpshooterbuff.executed=执行
actors.buffs.sharpshooterbuff.no_weapon=要使用能力，需先装备枪械或弓箭。
actors.buffs.sharpshooterbuff.no_bullet=没有装填的弹药。
actors.buffs.sharpshooterbuff.no_arrow=没有可以发射的箭矢。
actors.buffs.sharpshooterbuff$sharpshootingcooldown.name=冷却时间：连射
actors.buffs.sharpshooterbuff$sharpshootingcooldown.desc=你最近使用了能力，在击杀敌人前无法再次使用。
actors.buffs.sharpshooterbuff$sharpshootingcooldown.alt_desc=你最近使用了能力，在击杀敌人或命中一定次数的投掷武器前无法再次使用。\n\n剩余命中次数：_%s_。
actors.hero.heroclass.rat_king=鼠王
actors.hero.heroclass.rat_king_desc=朕有能力独行，何必钻营于一门职业？\n\n朕随身携带着所有能找到的宝物：一个皇室传承的_破损纹章_，一根御前法师制作的_老魔杖_，一件来自皇家宝库的无价的_暗影斗篷_，还有一把来自军械库的_灵能弓_。其他所有杂物，无论新旧，都被塞进了朕那满是奶酪的储物箱里。  \n\n朕明察秋毫，可以从更远的距离检测到陷阱和秘密。  \n\n不仅如此，朕爱惜王国的草木，可以在高草中行走而不践踏之。  \n\n但朕终究只是一只老鼠：初始只有8点生命，每次升级只增加2点生命。
actors.hero.heroclass.rat_king_desc_short=瞧！终极职业的降临，将实现你所有的梦想。由于其可以_获得每个DERanged Pixel Dungeon职业_的机制、天赋和独特物品，鼠王的勇武与才智天下无双。
actors.hero.heroclass.rat_king_unlock=要解锁鼠王，需要在单次游戏中获得_250 000分_。
actors.hero.herosubclass.king=鼠皇大帝
actors.hero.herosubclass.king_short_desc=...\n\n等等，这是什么？\n\n王不会被规则束缚！被迫选择某个方向简直是愚不可及！\n\n朕渴望_一切力量!!!_
actors.hero.herosubclass.king_desc=只选一个转职？这么蹩脚的事朕才不干。朕可以通过天赋挑选任何想要的能力！\n\n（如果同时有多个特殊行动处于激活状态，可以通过对应的状态图标，或长按特殊行动按钮来切换当前使用的特殊行动。）
actors.hero.abilities.ratking.omniability.name=全能
actors.hero.abilities.ratking.omniability.short_desc=既然不必选择，朕何必去选？_全能_让朕可以使用每一种能力！
actors.hero.abilities.ratking.omniability.desc=每次使用该技能时，都会随机生成一个护甲技能，所有天赋都将转化为对应技能的天赋。\n\n只要对应的召唤保持激活状态，召唤物品的技能就会一直可用。
actors.hero.abilities.ratking.omniability.ability_desc=当朕下次使用此能力时，会发生以下情况：
actors.hero.abilities.ratking.wrath.name=鼠王之怒
actors.hero.abilities.ratking.wrath.short_desc=朕把无限的_怒火_倾泻在王国的敌人身上。然而，这需要几个回合的时间。伟大的力量带来伟大的责任！
actors.hero.abilities.ratking.wrath.desc=通过拒绝所有常规能力，朕得到了无上的伟力！使用这个能力，朕可以先在原位置扔下一枚烟雾弹使附近的所有人失明，再闪现至视野内、未被墙壁阻隔的10格内任意位置。出现在落点时，朕的御座将撞击地板产生冲击波，对落点附近的所有敌人造成5-10点伤害，每1点超过10的力量能增加1-2点伤害，并使他们残废5回合。然后，朕将释放魔杖的元素风暴造成10-20点伤害，攻击落点4格范围内的所有生物，随后触发以附近所有敌人为目标的灵魂飞刃。\n\n当目标有多个时，灵魂飞刃的伤害较低，不过这可以通过天赋来加强。
actors.hero.abilities.ratking.wrath.desc_shadow_step=由于朕处于隐身状态，朕能够立即闪现至视野内、未被墙壁阻隔的6格内任意位置。
actors.hero.abilities.rat_king.wrath$ratstatue.name=老鼠雕像
actors.hero.abilities.rat_king.wrath$ratstatue.desc=这件华丽的艺术作品几乎完美地刻画了他作为老鼠的伟岸形象，这将充实地牢博物馆的精品收藏。事实上，由于它太过栩栩如生，敌人似乎很容易把它和真实的东西混淆起来！
actors.hero.talent.royal_privilege.title=皇家特权
actors.hero.talent.royal_privilege.desc=忍饥挨饿对国王来说是不存在的！  \n\n_+1：_当鼠王的生命值低于30%时，进食可以治疗_3点生命_，并且在接下来的3次魔杖造成伤害时提供_2点额外伤害_，在接下来的2次物理攻击命中敌人时提供_3点额外伤害_，并在下次施放圣典法术时提供_3点护盾_。不仅如此，在地牢的前期阶段，能找到放在箱子里的_2份小口粮_和藏在高草里的_4份浆果_。  \n\n_+2：_当鼠王的生命值低于30%时，进食可以治疗_5点生命_，并且在接下来的3次魔杖造成伤害时提供_3点额外伤害_，在接下来的3次物理攻击命中敌人时提供_3点额外伤害_，并在下次施放圣典法术时提供_5点护盾_。不仅如此，在地牢的前期阶段，能找到放在箱子里的_3份小口粮_和藏在高草里的_6份浆果_。
actors.hero.talent.royal_privilege.comment_mage="充——能——"
actors.hero.talent.royal_intuition.title=皇家直觉
actors.hero.talent.royal_intuition.desc=朕日理万机，明察秋毫！  \n\n_+1：_鼠王鉴定武器、盔甲和戒指为_2.75倍_速度，鉴定法杖为_3.75倍_速度！还会在_装备戒指后_马上鉴定它的类型！  \n\n_+2：_鼠王在装备所有装备时_立即鉴定_它们，并且可以在_拿起_戒指时立即确定戒指的类型！  \n\n鼠王还能消耗_3/2点充能_施放神圣直觉，帮助鉴定更多物品！
actors.hero.talent.kings_wisdom.title=王者智慧
actors.hero.talent.kings_wisdom.desc=上兵伐谋，兵法之道！  \n\n_+1：_鼠王对未察觉的敌人的首次攻击造成_1-2点额外伤害_，当鼠王用弓或投掷武器击中一个敌人时，下一次近战攻击对该敌人造成_2点额外伤害_。此外，鼠王使用魔杖或法杖攻击之后，下一次物理攻击会另外造成_1-2点额外伤害_，在攻击前等待一回合则会造成_1-2点额外伤害_。最后，鼠王的护盾破碎后，下一次物理攻击造成_2点额外伤害_，并且被照亮的敌人会受到_3点额外伤害_！  \n\n_+2：_鼠王对未察觉的敌人的首次攻击造成_2点额外伤害_，当鼠王用弓或投掷武器击中一个敌人时，下一次近战攻击对该敌人造成_3点额外伤害_。此外，鼠王使用魔杖或法杖攻击之后，下一次攻击会另外造成_2点额外伤害_，在攻击前等待一回合则会造成_1-2点额外伤害_。最后，鼠王的护盾破碎后，下一次物理攻击造成_3点额外伤害_，并且被照亮的敌人会受到_5点额外伤害_！
actors.hero.talent.noble_cause.title=高贵血统
actors.hero.talent.noble_cause.desc=古之立大事者，不惟有超世之才，亦必有坚忍不拔之志！  \n\n_+1：_鼠王的纹章提供的最大护盾增加_1点_。每当老魔杖耗尽最后一点充能，或在生命值低于50%时使用武器技能，获得_3点护盾_。不仅如此，斗篷被激活时，每_2回合_获得1点护盾，最多_3点_。每当一个植物在视野中被践踏，获得0-2点树肤护甲，每_3回合_减少一次！  \n\n_+2：_鼠王的纹章提供的最大护盾增加_2点_。每当老魔杖耗尽最后一点充能，或在生命值低于50%时使用武器技能，获得_5点护盾_。不仅如此，斗篷被激活时，每_回合_获得1点护盾，最多_5点_。每当一个植物在视野中被践踏，获得0-2点树肤护甲，每_5回合_减少一次！  \n\n鼠王还能消耗1点充能施放_光之护盾_，使其在5回合内对特定敌人提供_2-4_/_3-6_点护甲！
actors.hero.talent.noble_cause.meta_desc=_-倘若这个天赋由没纹章的英雄获得_，那么所有护盾类效果都会享受这个加成。\n_-倘若这个天赋由没有老魔杖的英雄获得_，那么等级最高的法杖耗尽充能时可以享受这个天赋。
actors.hero.talent.royal_focus.title=皇家专注
actors.hero.talent.royal_focus.desc=朕必须时刻准备应对新的威胁！  \n\n_+1：_进食会在不消耗弹药的情况下为枪装填子弹，为接下来的_2次受击_提供3点固定护甲，并使下一次攻击将敌人击退_2格_。敌人身上每有一个负面效果，鼠王就额外造成_1点伤害_，并有_+2%额外几率_造成暴击。此外，在地牢前期阶段，用砍刀砍草时能找到_4份浆果_。  \n\n_+2：_进食会在不消耗弹药的情况下为枪额外装填一发子弹，为接下来的_3次受击_提供3点固定护甲，并使下一次攻击将敌人击退_2格_。敌人身上每有一个负面效果，鼠王就额外造成_1-2点伤害_，并有_+4%额外几率_造成暴击。此外，在地牢前期阶段，用砍刀砍草时能找到_6份浆果_。
actors.hero.talent.royal_perceptivity.title=皇家洞察
actors.hero.talent.royal_perceptivity.desc=朕能洞悉一切显而易见之事！  \n\n_+1：_鼠王装备护甲和武器时会立即鉴定，并得知_3种随机药剂_！如果仍有未知药剂，饮用它们会提供3回合的气体免疫。  \n\n_+2：_鼠王装备护甲和武器时会立即鉴定（拾取时就能得知它们是否被诅咒），并得知_5种随机药剂_！如果仍有未知药剂，饮用它们会提供3回合的气体免疫。饮用（而非投掷）对自己有害的药剂时，也会获得3回合的气体免疫！
actors.hero.talent.ambush.title=伏击
actors.hero.talent.ambush.desc=在他们察觉之前就将其屠戮！  \n\n_+1：_鼠王在纳刀状态下的首次攻击会提供_2回合_激素涌动和相当于_2回合_的瞬间移动，使敌人残废_2回合_，并造成_2点额外伤害_。鼠王攻击生命值低于25%的敌人时，也会造成_2点额外伤害_。而为了完美的伏击，踩到植物的敌人会被缠绕_2回合_！  \n\n_+2：_鼠王在纳刀状态下的首次攻击会提供_3回合_激素涌动和相当于_3回合_的瞬间移动，使敌人残废_3回合_，并造成_3点额外伤害_。鼠王攻击生命值低于25%的敌人时，也会造成_3点额外伤害_。而为了完美的伏击，踩到植物的敌人会被缠绕_3回合_！
actors.hero.talent.well_protected.title=全副武装
actors.hero.talent.well_protected.desc=这就是朕保卫王国免受威胁的方式！  \n\n_+1：_装填枪支或远距离攻击时会提供_3点护盾_（后者有10回合冷却）。鼠王的体格也异常强健：因鼠王之强大获得_0-2点护甲_，因可靠的骑士盾牌获得_0-2点护甲_。当单次攻击造成超过_8点伤害_时，鼠王还会恢复3点生命，该效果有50回合冷却。最后，收集露珠时，鼠王会获得_5点护盾_。  \n\n_+2：_装填枪支或远距离攻击时会提供_5点护盾_（后者有10回合冷却）。鼠王的体格也异常强健：因鼠王之强大获得_0-3点护甲_，因可靠的骑士盾牌获得_0-4点护甲_。当单次攻击造成超过_5点伤害_时，鼠王还会恢复3点生命，该效果有50回合冷却。最后，收集露珠时，鼠王会获得_8点护盾_。
actors.hero.talent.extra_bulk.title=额外壮硕
actors.hero.talent.extra_bulk.desc=每一分防御对朕都很重要！  \n\n_+1：_身上每有一个减益效果，鼠王获得_+1.2倍闪避_！攻击被照亮的敌人时获得_3点护盾_，有_5%几率_不消耗魔杖充能，被攻击后有_2%几率_隐身3回合！最重要的是，生命值增加_2点_！  \n\n_+2：_身上每有一个减益效果，鼠王获得_+1.5倍闪避_！攻击被照亮的敌人时获得_5点护盾_，有_10%几率_不消耗魔杖充能，被攻击后有_4%几率_隐身3回合！最重要的是，生命值增加_4点_！
actors.hero.talent.extra_power.title=额外力量
actors.hero.talent.extra_power.desc=只要肯尝试，任何事物都能成为优势！  \n\n_+1：_鼠王在水坑中造成_1点额外伤害_，使用武器技能时造成_2点额外伤害_，使用藤蔓绳索后造成_1-2点额外伤害_。不仅如此，用枪托殴打敌人会造成_0-2点额外伤害_，击杀敌人时会获得_3回合_激素涌动和1层持续_3回合_的伤害加成。此外，射箭时有_37.5%几率_收回箭矢，高于原来的25%。  \n\n_+2：_鼠王在水坑中造成_1-2点额外伤害_，使用武器技能时造成_3点额外伤害_，使用藤蔓绳索后造成_2点额外伤害_。不仅如此，用枪托殴打敌人会造成_0-4点额外伤害_，击杀敌人时会获得_5回合_激素涌动和1层持续_5回合_的伤害加成。此外，射箭时有_50%几率_收回箭矢，高于原来的25%。
actors.hero.talent.royal_meal.title=皇家宴席
actors.hero.talent.royal_meal.desc=只取进食中最上乘的效果！  \n\n_+1：_鼠王进食只需要1回合（吃浆果不耗时），并提供_5回合_法杖充能，_3回合_神器充能，_1回合_极速，_2回合_激素涌动，以及为武器和圣典提供_0.67点充能_。进食的时候，鼠王受到的伤害_减少75%_。  \n\n_+2：_鼠王进食只需要1回合（吃浆果不耗时），并提供_8回合_法杖充能，_5回合_神器充能，_2回合_极速，_3回合_激素涌动，以及为武器和圣典提供_1点充能_。进食的时候，鼠王受到的伤害_减少100%_！
actors.hero.talent.royal_meal.comment_mage="哟，瞧瞧这个。所有进食效果都打包好了，就等着用呢……"
actors.hero.talent.royal_feast.title=皇家盛宴
actors.hero.talent.royal_feast.desc=区区煎蛋可给不了你这些！  \n\n_+1：_鼠王进食只需要1回合（吃浆果不耗时），并提供_2回合_无限枪支弹药，_下1次攻击_+100%暴击几率，以及接下来3次受击时护甲_+1级_。进食还会移除所有负面效果，并在四个方向上生长出草。  \n\n_+2：_鼠王进食只需要1回合（吃浆果不耗时），如果没有负面效果则恢复3点生命，并提供_3回合_无限枪支弹药，_下2次攻击_+100%暴击几率，以及接下来3次受击时护甲_+2级_。进食还会移除所有负面效果，并在周围一圈生长出草。
actors.hero.talent.kings_vision.title=王者视野
actors.hero.talent.kings_vision.desc=御座之下，跳梁小丑无处遁形！\n\n  _+1：_鼠王能感知到_自身位置2格以内_的所有敌人。搜索范围变成一个_7x7的圆_。使用魔杖命中敌人时，对该敌人获得灵视，持续_10回合_；每次进入新的楼层时，有_50%几率_看到该层所有的陷阱。向敌人扔出任何非投掷武器的物品时，可以使其致盲_2回合_，这个效果有50回合的冷却时间。\n\n  _+2：_鼠王能感知到_自身位置3格以内_的所有敌人。搜索范围变成一个_7x7的方形_。使用魔杖命中敌人时，对该敌人获得灵视，持续_15回合_；每次进入新的楼层时，有_80%几率_看到该层所有的陷阱。向敌人扔出任何非投掷武器的物品时，可以使其致盲_3回合_，这个效果有50回合的冷却时间。\n\n  鼠王还能消耗2点充能施放_神圣感知_，立即获得_8/12回合_的心灵视界，持续50回合。
actors.hero.talent.kings_vision.meta_desc=_倘若这个天赋由其他英雄获得_，搜索范围将会在+1/+2天赋时变成5x5的圆/方。
actors.hero.talent.kings_wrath.title=王之怒
actors.hero.talent.kings_wrath.desc=任何闯入朕王国的掠食者都将受到惩罚！  \n\n_+1：_鼠王每超出护甲力量需求1点力量，获得_0-1点额外护甲_；每超出武器力量需求1点力量，获得_0.5%暴击几率_。纳刀时暴击几率还会提高_10%_。不仅如此，敌人踩到植物后会陷入虚弱和易伤，持续_4回合_。最后，鼠王踩到高草时会获得_2回合_隐身。  \n\n_+2：_鼠王每超出护甲力量需求1点力量，获得_0-1.5点额外护甲_；每超出武器力量需求1点力量，获得_1%暴击几率_。纳刀时暴击几率还会提高_20%_。不仅如此，敌人踩到植物后会陷入虚弱和易伤，持续_6回合_。最后，鼠王踩到高草时会获得_3回合_隐身。
actors.hero.talent.the_protector.title=守护者
actors.hero.talent.the_protector.desc=无论付出什么代价，朕都会保护朕的子民！  \n\n_+1：_鼠王损失的生命越多，受到的伤害就越少，最多减少_17%_的伤害，并且像所有称职的领袖一样，将盟友受到的所有伤害转移到自己身上！此外，鼠王每走一步有_1%几率_短暂看到该层所有敌人，露珠不会被火焰蒸发，踩到草地时获得0-3点树肤护甲，每_3回合_减少一次。最后，鼠王的新陈代谢得到增强：生命恢复速度提高_1.1倍_，饱食度消耗_减慢20%_！  \n\n_+2：_鼠王损失的生命越多，受到的伤害就越少，最多减少_33%_的伤害，并且像所有称职的领袖一样，将盟友受到的所有伤害转移到自己身上，同时将其减半！此外，鼠王每走一步有_2%几率_短暂看到该层所有敌人，露珠和卷轴不会被火焰摧毁，踩到草地时获得0-5点树肤护甲，每_3回合_减少一次。最后，鼠王的新陈代谢得到增强：生命恢复速度提高_1.2倍_，饱食度消耗_减慢40%_！
actors.hero.talent.restoration.title=等价交换
actors.hero.talent.restoration.desc=一切行动都有等价行动和相反行动。反正别人是这么说的。\n\n  _+1_：鼠王使用卷轴会立即获得_3回合_隐身并使得_下2次法杖施法_+2等级；使用药剂会立即恢复破损纹章_50%的护盾_，在周围生长出_最多4格草地_，缠绕相邻的敌人_1回合_，并使鼠王在接下来5回合内的一次近战攻击获得_3倍闪避_和_3倍命中_。鼠王可以用魔杖瞄准自己，立即将其充能转化为护盾，每点充能转化最大生命值的_4%_。\n\n  _+2_：鼠王使用卷轴会立即获得_5回合_隐身并使得_下3次法杖施法_+2等级；使用药剂会立即恢复破损纹章_75%的护盾_，在周围生长出_最多6格草地_，缠绕相邻的敌人_2回合_，并使鼠王在接下来5回合内的一次近战攻击获得_无限闪避_和_无限命中_。鼠王可以用魔杖瞄准自己，立即将其充能转化为护盾，每点充能转化最大生命值的_6%_。  \n\n鼠王还能施放_回溯铭文_，在_10/300回合_内重新施放上一次使用的符石、卷轴或法术，消耗随所用物品而增加！  \n\n阅读升级、嬗变、附魔和蜕变卷轴时，隐身时长、强化的魔杖施法次数和回溯法术消耗翻倍；使用力量、经验、精通和神启药剂时，护盾量、草地数量和缠绕时长翻倍。
actors.hero.talent.restoration.meta_desc=如果这一天赋由没有破损纹章的英雄获取，则给予的护盾量在+1时为5%最大血量，+2时为7.5%最大血量。
actors.hero.talent.temporary_draught.title=临时饮剂
actors.hero.talent.temporary_draught.desc=纵使歌与酒只利于当下，也是旅途的一部分！\n\n  _+1：_阅读卷轴时获得_5发免费子弹_，_接下来1次攻击_的暴击率+100%，并使武器和护甲各_+1级_（各持续10次使用）；使用药剂时回复_5点生命_，并制造_0-1颗_与所用药剂对应的药丸。此外，鼠王可以暂时往水袋中注入种子，饮用时获得一些有趣的效果；饮用药剂（而非投掷）将恢复_30回合_的饥饿值！\n\n  _+2：_阅读卷轴时获得_10发免费子弹_，_接下来2次攻击_的暴击率+100%，并使武器和护甲各_+2级_（各持续10次使用）；使用药剂时回复_8点生命_，并制造_0-2颗_与所用药剂对应的药丸。此外，鼠王可以暂时往水袋中注入种子（有50%概率不消耗种子），饮用时获得一些有趣的效果；饮用药剂（而非投掷）将恢复_50回合_的饥饿值！\n\n  阅读升级、转化、附魔或蜕变卷轴时，子弹数量、必定暴击的攻击次数和额外等级翻倍；使用力量、经验、精通或神意启发合剂时，回复量翻倍。
actors.hero.talent.power_within.title=超凡本能
actors.hero.talent.power_within.desc=一鸟在手，十鸟在林！  \n\n_+1：_破损纹章可以像携带升级一样携带_普通刻印_。当鼠王将新的法杖注入老魔杖时，先前灌注的法杖以0级状态回收，_但只能触发一次。_进入有隐藏房间的新楼层时，有_75%的概率察觉_该层有隐藏房间。只要拥有法杖或神器充能效果，武器充能每_15回合_恢复一次，并且鼠王可以立即切换武器_一次_，冷却20回合。踏上矮草或灰烬时，它们会复生为高草，并立即被踩踏（有_10回合_的冷却时间）。  \n\n_+2：_破损纹章可以像携带升级一样携带_任何刻印_。当鼠王将新的法杖注入老魔杖时，先前灌注的法杖以0级状态回收，_每一英雄等级可触发一次。_进入有隐藏房间的新楼层时，有_100%的概率察觉_该层有隐藏房间。只要拥有法杖或神器充能效果，武器充能每10回合恢复一次，并且鼠王可以立即切换武器_两次_，冷却_20回合_。踏上矮草或灰烬时，它们会复生为高草，并立即被踩踏（有_5回合_的冷却时间）。  \n\n圣典还获得消耗1充能的_神圣祝福_法术：对友方施放时给予_10/15回合_祝福效果并回复_10/15点生命_；对自己施放时给予_6/10回合_祝福效果和_10/15点护盾_。
actors.hero.talent.power_within.meta_desc=_- 如果没有老魔杖的英雄获得这个天赋_，把法杖放进炼金锅时，获得的奥术树脂数量在+1/+2时分别增加1/2个。\n\n_- 如果没有破损纹章的英雄获得这个天赋_，升级护甲时刻印必定保留的等级上限会提高：+1时从+4提高到+6，+2时从+4提高到+7。刻印必定丢失的等级仍为+8。
actors.hero.talent.perfect_collection.title=完美收藏
actors.hero.talent.perfect_collection.desc=朕箱子里的所有工具，皆是完美搭档！  \n\n_+1：_所有枪械的弹匣容量_+1发子弹_，并且在用作近战武器时有_5%概率_装填1发子弹（可以溢出）。纳刀时，鼠王能灵视_鼠王所在位置3格内_的所有敌人。伽马射线枪也会变强：造成_25%额外伤害_并附带放射性中毒，每_5回合_伤害敌人直至其死亡，但冷却时间延长_1回合_。最后，使用藤蔓绳索后，鼠王获得_2回合_极速！  \n\n_+2：_所有枪械的弹匣容量_+2发子弹_，并且在用作近战武器时有_10%概率_装填1发子弹（可以溢出）。纳刀时，鼠王能灵视_鼠王所在位置4格内_的所有敌人。伽马射线枪也会变强：造成_50%额外伤害_并附带放射性中毒，每_4回合_伤害敌人直至其死亡，但冷却时间延长_2回合_。最后，使用藤蔓绳索后，鼠王获得_3回合_极速！
actors.hero.talent.pursuit.title=皇家狩猎
actors.hero.talent.pursuit.desc=敌人？更像是“猎物！”  \n\n_+1：_不会惊醒_距鼠王3格或更远的沉睡敌人_。此外，鼠王的投掷武器获得_+33%耐久度_，物理攻击的斩杀一击有_67%的概率_不消耗回合数，并总是给予鼠王相当于_3回合_的瞬间移动。  \n\n_+2：_不会惊醒_未与鼠王相邻的沉睡敌人_。此外，鼠王的投掷武器获得_+50%耐久度_，物理攻击的斩杀一击有_100%的概率_不消耗回合数，并总是给予鼠王相当于_5回合_的瞬间移动。  \n\n鼠王还可以消耗1充能施放_阳炎射线_，造成_4-8/6-12点伤害_，并使目标失明_4/6回合_。它还会麻痹失明的敌人，并对恶魔和亡灵造成最大伤害！
actors.hero.talent.pursuit.comment_rogue="无声步伐2.0，还附赠手起刀落！"
actors.hero.talent.pursuit.comment_huntress="这些都是好东西..."
actors.hero.talent.noble_call.title=贵族召唤
actors.hero.talent.noble_call.desc=无论逼近的是何种威胁，朕都已准备迎战！  \n\n_+1：_鼠王每_70回合_可以反击一次近战攻击；使用投掷武器时，暴击率提高_13%_，暴击伤害提高_10%_；近战攻击有40%概率将敌人击退_1格_。升级时，鼠王会抹去所有可见敌人_50%的最大生命值_，并且可以消耗2充能施放_神圣冲击_，使目标麻痹并将其击退_1格_！  \n\n_+2：_鼠王每_50回合_可以反击一次近战攻击；使用投掷武器时，暴击率提高_25%_，暴击伤害提高_20%_；近战攻击有40%概率将敌人击退_2格_。升级时，鼠王会抹去所有可见敌人_75%的最大生命值_，并且可以消耗2充能施放_神圣冲击_，使目标麻痹并将其击退_2格_！  \n\n装备弓类武器时，近战击退距离增加2格。
actors.hero.talent.energy_surge.title=能量涌动
actors.hero.talent.energy_surge.desc=朕浑身充盈着力量，并乐于与朕的工具分享！  \n\n_+1：_食物提供_15%额外饥饿值_，法杖充能速度_+10%_，移动速度_+10%_，并获得_1点额外武器充能_！  \n\n_+2：_食物提供_25%额外饥饿值_，法杖充能速度_+20%_，移动速度_+20%_，并获得_2点额外武器充能_！
actors.hero.talent.rk_berserker.title=王的愤怒
actors.hero.talent.rk_berserker.desc=天子一怒，伏尸百万，流血千里！连攻击朕也会让朕变得更强！\n\n  _+1：_鼠王的怒气上限提升至_116%_，力量增加_8%_（向下取整）。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气时最多_提升15%_；每次击中获得的怒气会使破损纹章的冷却缩短_怒气增量的33%_。击杀敌人时额外获得_6.7%怒气_，怒气达到上限时获得激素涌动，持续时间等于_全部怒气的10%_，此能力有50回合冷却。进行等待时，他在下次移动前获得_+1-2点护甲_，且护盾和连击的衰减_慢33%_。怒气满时可以抗拒死亡进入狂暴状态（冷却4英雄等级）！\n\n  _+2：_鼠王的怒气上限提升至_133%_，力量增加_12%_（向下取整）。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气时最多_提升30%_；每次击中获得的怒气会使破损纹章的冷却缩短_怒气增量的67%_。击杀敌人时额外获得_13%怒气_，怒气达到上限时获得激素涌动，持续时间等于_全部怒气的20%_，此能力有50回合冷却。进行等待时，他在下次移动前获得_+2-4点护甲_，且护盾和连击的衰减_慢67%_。怒气满时可以抗拒死亡进入狂暴状态（冷却_3_英雄等级）！\n\n  _+3：_鼠王的怒气上限提升至_150%_，力量增加_18%_（向下取整）。拥有越多怒气，他武器上的附魔或诅咒触发的几率越高，在100%怒气时最多_提升45%_；每次击中获得的怒气会使破损纹章的冷却缩短_怒气增量的100%_。击杀敌人时额外获得_20%怒气_，怒气达到上限时获得激素涌动，持续时间等于_全部怒气的30%_，此能力有50回合冷却。进行等待时，他在下次移动前获得_+3-6点护甲_，且护盾和连击的衰减_慢100%_。怒气满时可以抗拒死亡进入狂暴状态（冷却_2_英雄等级）！\n\n  怒气值超过100%时，每1%怒气使狂暴护盾增加1%并使冷却减少1%，但伤害加成不会超过+50%。
actors.hero.talent.rk_gladiator.title=王的连击
actors.hero.talent.rk_gladiator.desc=知己知彼，百战不殆！\n这一天赋允许鼠王通过近战和投掷武器积攒_连击_，当鼠王积攒了足够连击之后，鼠王将可以使用强大的_连击技_！\n\n   _+1：_当鼠王击杀一名敌人时，连击冷却_延长至30回合_。使用连击技能击杀敌人时，破损纹章的冷却缩短_33%_，并且如果上一招是冲击，可以再次使用冲击！连击数达到7或以上时，_冲击的击退距离提升至3，可将敌人击落深渊，并附带眩晕！_即使不连击，鼠王每高出武器力量需求1点力量，攻击速度就_提升5%_，受到攻击时有_33%概率_获得连击。\n\n  _+2：_当鼠王击杀一名敌人时，连击冷却_延长至45回合_。使用连击技能击杀敌人时，破损纹章的冷却缩短_67%_，并且如果上一招是冲击或招架，可以再次使用它们！连击数达到9或以上时，_招架对多次攻击有效！_即使不连击，鼠王每高出武器力量需求1点力量，攻击速度就_提升10%_，受到攻击时有_67%概率_获得连击。\n\n  _+3：_当鼠王击杀一名敌人时，连击冷却_延长至60回合。_使用连击技能击杀敌人时，破损纹章的冷却缩短_100%_，这意味着其护盾可立即在需要时使用，并且可以再次使用冲击和招架！不仅如此，使用撞击、横扫或暴雨时可_跃过连击数/3格_来接近敌人！即使不连击，鼠王每高出武器力量需求1点力量，攻击速度就_提升15%_，受到攻击时都会获得连击。
actors.hero.talent.rk_veteran.title=升龙拳
actors.hero.talent.rk_veteran.desc=你将被朕的摔技碾碎！\n借助这一天赋，鼠王可以在近战攻击敌人后_立即使用肩撞_，造成与护甲成比例的伤害并造成轻微击退，同时回复少许破损纹章冷却！  \n\n_+1：_肩撞造成相当于_60%护甲值_的伤害，附魔威力_+50%_，并施加2回合_恍惚_。肩撞期间鼠王受到的伤害_减少33%_，若以此击杀敌人，将在3x3范围内产生爆炸，造成_5-20点伤害_！  \n\n_+2：_肩撞向前推进2格而非1格，造成相当于_80%护甲值_的伤害，附魔威力_+100%_，并施加2回合_恍惚与虚弱_。肩撞期间鼠王受到的伤害_减少67%_，若以此击杀敌人，将在3x3范围内产生爆炸，造成_8-30点伤害_！  \n\n_+3：_肩撞向前推进2格而非1格，造成相当于_鼠王的护甲值_的伤害，附魔威力_+150%_，施加2回合_恍惚、虚弱和易伤_，并将敌人击落深渊。肩撞期间鼠王_不受任何伤害_，若以此击杀敌人，将在3x3范围内产生爆炸，造成_10-40点伤害_！  \n\n肩撞的爆炸不会伤害鼠王和鼠王的盟友！
actors.hero.talent.rk_battlemage.title=王的魔法
actors.hero.talent.rk_battlemage.desc=这一天赋使得鼠王的老魔杖近战攻击可以_充能_鼠王的全部法杖。此外，鼠王还根据灌注的法杖获得_特殊的命中效果_！鼠王还获得_魔法连击_，可以使用魔法连击技！\n\n  _+1：_法杖只有1充能时，法杖效果_提升1级_，阅读卷轴会为老魔杖恢复_1点充能_！使用法杖施法后，下一次近战攻击造成额外_16%伤害_且特殊效果提升_50%_。老魔杖近战击中敌人时，获得_0.5回合_神器充能效果。不仅如此，在使用满充能的老魔杖施法时，每级魔杖获得_0.67点护盾_，并产生一个_1x1法术圈_！当鼠王身处法术圈内时，鼠王的法杖充能速度快100%！魔法连击技方面，鼠王可以使用_魔力震荡和魔杖突刺_。\n\n  _+2：_法杖只有1充能时，法杖效果_提升2级_，阅读卷轴会为老魔杖恢复_2点充能_。使用法杖施法后，下一次近战攻击造成额外_33%伤害_且特殊效果提升_100%_。老魔杖近战击中敌人时，获得_1回合_神器充能效果。不仅如此，在使用满充能的老魔杖施法时，每级魔杖获得_1.33点护盾_，并产生一个_1x1法术圈_！当鼠王身处法术圈内时，鼠王的法杖充能速度快100%，且施法时有50%概率不消耗充能！魔法连击技方面，鼠王可以使用_魔力震荡、魔杖突刺、魔力增幅和魔力释放_。\n\n  _+3：_法杖只有1充能时，法杖效果_提升3级_，阅读卷轴会为老魔杖恢复_3点充能_。使用法杖施法后，下一次近战攻击造成额外_50%伤害_且特殊效果提升_150%_。老魔杖近战击中敌人时，获得_1.5回合_神器充能效果。不仅如此，在使用满充能的老魔杖施法时，每级魔杖获得_2点护盾_，并产生一个_3x3法术圈_！当鼠王身处法术圈内时，鼠王的法杖充能速度快100%，且施法时有50%概率不消耗充能！魔法连击技方面，鼠王可以使用_魔力震荡、魔杖突刺、魔力增幅、魔力释放、魔力爆发和魔力解放_。
actors.hero.talent.rk_warlock.title=皇家存在
actors.hero.talent.rk_warlock.desc=不是只有矮人王能让子民效忠！\n这一天赋使得鼠王的魔法可以用黑暗邪咒_标记_敌人，让鼠王能从他们身上_偷取生命_！\n\n  _+1：_鼠王可以与一名_2格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_13%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_0.33回合_的饥饿值，并使目标造成的伤害_降低10%_。被灵魂标记的单位死亡时，有_10%概率_触发一次进食效果，并有_13%概率_成为一只被腐化的怨灵。最后，每次击中有_10%概率_使敌人狂乱3回合，且在计算灵魂标记的几率和持续时间时，鼠王的法杖视为_高1级_。\n\n  _+2：_鼠王可以与一名_4格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_27%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_0.67回合_的饥饿值，并使目标造成的伤害_降低19%_。被灵魂标记的单位死亡时，有_20%概率_触发一次进食效果，并有_27%概率_成为一只被腐化的怨灵。最后，每次击中有_20%概率_使敌人狂乱3回合，且在计算灵魂标记的几率和持续时间时，鼠王的法杖视为_高2级_。\n\n  _+3：_鼠王可以与一名_6格内_的友方单位瞬间交换位置。其他单位的近战攻击同样会触发灵魂标记，但只有_40%效率_。每对被灵魂标记的单位造成1点伤害，都会回复相当于_1回合_的饥饿值，并使目标造成的伤害_降低27%_。被灵魂标记的单位死亡时，有_30%概率_触发一次进食效果，并有_40%概率_成为一只被腐化的怨灵。最后，每次击中有_30%概率_使敌人狂乱3回合，且在计算灵魂标记的几率和持续时间时，鼠王的法杖视为_高3级_。
actors.hero.talent.rk_wizard.title=书虫之傲
actors.hero.talent.rk_wizard.desc=天下学问，尽在朕手！\n有了这一天赋，鼠王每拥有一本魔法书（上限10本），法杖充能速度便提升1.05倍；使用魔法书还会使法杖在短时间内获得_+20%伤害_！\n\n  _+1：_魔法书的效果_增强50%_，伤害加成持续_10回合_，使用魔法书时有_33%几率_施放与鼠王法杖对应的魔法书效果。近战命中时魔法书冷却缩短_1回合_；用法杖魔法命中时恢复_1点生命_，并乘以所消耗的充能数与命中的目标数。此外，击杀敌人时有_1/6几率_在其位置生成_法杖充能_点！\n\n  _+2：_魔法书的效果_增强100%_，伤害加成持续_15回合_，使用魔法书时有_66%几率_施放与鼠王法杖对应的魔法书效果。近战命中时魔法书冷却缩短_2回合_；用法杖魔法命中时恢复_2点生命_，并乘以所消耗的充能数与命中的目标数。此外，击杀敌人时有_1/3几率_在其位置生成_法杖充能_或_神器充能_点！\n\n  _+3：_魔法书的效果_增强150%_，伤害加成持续_15回合_，使用魔法书时必定施放与鼠王法杖对应的魔法书效果。近战命中时魔法书冷却缩短_3回合_；用法杖魔法命中时恢复_3点生命_，并乘以所消耗的充能数与命中的目标数。此外，击杀敌人时有_1/2几率_在其位置生成_法杖充能_、_神器充能_或_即时护盾_点！
actors.hero.talent.rk_assassin.title=闪光的王
actors.hero.talent.rk_assassin.desc=不得直视朕的御驾！\n这一天赋使得鼠王隐身时可以准备刺杀，并且足够努力时可以秒杀敌人！\n\n  _+1：_根据潜伏时长的不同，现在生命值低于_4/13/27/67%_的目标都有几率被处决（原为3/10/20/40%），刺杀时的闪现距离由1/2/3/4格提升至_1/3/4/6格_，伤害加成提升至_11/22/38/55%_（原为_10/20/35/50%_）。被技能刺杀的敌人掉落率提升2/4/8/16%，并且刺杀时有_33%几率_获得一层披风充能，可超出充能上限。使用神器后的_3回合_内，装备的所有戒指都会提升1级。此外，每层披风充能的持续时间延长_1回合_。\n\n  _+2：_根据潜伏时长的不同，现在生命值低于_5/17/30/83%_的目标都有几率被处决，刺杀时的闪现距离提升至_2/4/6/8格_，伤害加成提升至_12/24/36/60%_（原为_10/20/35/50%_）。被技能刺杀的敌人掉落率提升4/8/16/32%，并且刺杀时有_66%几率_获得一层披风充能，可超出充能上限。使用神器后的_6回合_内，装备的所有戒指都会提升1级。此外，每层披风充能的持续时间延长_2回合_。\n\n  _+3：_根据潜伏时长的不同，现在生命值低于_6/20/40/100%_的目标都有几率被处决，刺杀时的闪现距离提升至_2/5/7/10格_，伤害加成提升至_13/26/39/65%_（原为_10/20/35/50%_）。被技能刺杀的敌人掉落率提升6/12/24/48%，并且刺杀时必定获得一层披风充能，可超出充能上限。使用神器后的_9回合_内，装备的所有戒指都会提升1级。此外，每层披风充能的持续时间延长_3回合_。
actors.hero.talent.rk_freerunner.title=王的步伐
actors.hero.talent.rk_freerunner.desc=这一天赋使得鼠王奔跑时可以积攒动量。然后鼠王可以一键进入逸动状态，大幅提升移动速度！可惜使用完这一项能力之后需要恢复。\n\n  _+1：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得额外_1点闪避_，使用投掷武器和弓时获得额外的_50%命中与10%伤害_；被敌人攻击时还会获得2回合_极速_。在隐身时每回合获得2层动量，闪避攻击会使疲劳减少_1回合_，开始逸动时获得_1回合_无限闪避！不装备暗影斗篷也能使用斗篷的隐身技能，但未装备时斗篷的充能速率会降至_25%_。\n\n  _+2：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得_2点闪避_，使用投掷武器和弓时获得额外的_100%命中与20%伤害_；被敌人攻击时会获得2回合_极速与激素涌动_。未装备时斗篷的充能速率为_50%_，_隐身时逸动效果持续的回合数不会下降_，闪避攻击会使疲劳减少_2回合_，开始逸动时获得_2回合_无限闪避！\n\n  _+3：_处于逸动状态时，鼠王的力量每超过护甲需求1点便获得_3点闪避_，使用投掷武器和弓时获得额外的_150%命中与30%伤害_；被敌人攻击时会获得2回合_极速、激素涌动与无限闪避_。未装备时斗篷的充能速率为_75%_，_隐身时不论是否处于逸动状态，移动速度都会翻倍_，闪避攻击会使疲劳减少_3回合_，开始逸动时获得_3回合_无限闪避！
actors.hero.talent.rk_chaser.title=鼠技
actors.hero.talent.rk_chaser.desc=朕的暗刃取之不尽！\n这一天赋使得鼠王原地等待时可以隐身6回合；这一小把戏有15回合冷却。\n\n  _+1：_偷袭使目标中毒_3回合_，并使鼠王获得_1回合_隐身与极速（冷却10回合）。若偷袭击杀敌人，鼠王恢复_3点生命_，获得_1回合_灵视，视野内所有敌人_易伤_1回合（冷却5回合）。\n\n  _+2：_偷袭使目标中毒_4回合_，并使鼠王获得_2回合_隐身与极速（冷却10回合）。若偷袭击杀敌人，鼠王恢复_6点生命_，获得_2回合_灵视，视野内所有敌人_易伤并被麻痹_1回合（冷却5回合）。隐身小把戏的冷却也由15回合缩短至10回合！\n\n  _+3：_偷袭使目标中毒_5回合_，并使鼠王获得_3回合_隐身与极速（冷却10回合）。若偷袭击杀敌人，鼠王恢复_9点生命_，获得_3回合_灵视，视野内所有敌人_易伤并被麻痹_1回合，同时鼠王获得_2回合时间气泡_（冷却5回合）。隐身小把戏的冷却也由15回合缩短至10回合，并且每次偷袭都会使此列表中其他能力的冷却缩短1回合！
actors.hero.talent.rk_sniper.title=虽远必诛
actors.hero.talent.rk_sniper.desc=这一天赋使得鼠王的弓可以忽略护甲，并可以在投掷攻击后进行特殊的追击！\n\n  _+1：_视野范围_扩大25%_。投掷武器_有33%几率_共享灵能弓上的附魔（若是用附魔十字弩发射的飞镖则不会）。使用一件升级过的投掷武器攻击时，其上的每级升级都会使狙击标记的持续时间延长1回合，并使特殊攻击伤害提升16.67%，最高在+2时达到_33%伤害加成_。鼠王还可以在近战范围内踢开中矢的敌人，拔出其身上的投掷武器并将其击退_1格_；此能力有10回合冷却。此外，投掷武器和弓箭首次命中时有_33%几率_使敌人失明2回合，对被标记的敌人造成_额外10%伤害_，贴身使用时_只减少30%命中_（原为减少50%）。\n\n  _+2：_视野范围_扩大50%_。投掷武器_有67%几率_共享灵能弓上的附魔。使用一件升级过的投掷武器攻击时，其上的每级升级都会使特殊攻击伤害提升16.67%，最高在+4时达到_67%伤害加成_。鼠王还可以在近战范围内踢开中矢的敌人，拔出其身上的投掷武器并将其击退_2格_；此能力有10回合冷却。此外，投掷武器和弓箭首次命中时有_67%几率_使敌人失明2回合，对被标记的敌人造成_额外20%伤害_，贴身使用时_只减少10%命中_（原为减少50%）。\n\n  _+3：_视野范围_扩大75%_。投掷武器_必定能够_共享灵能弓上的附魔。使用一件升级过的投掷武器攻击时，其上的每级升级都会使特殊攻击伤害提升16.67%，最高在+6时达到_100%伤害加成_。鼠王还可以在近战范围内踢开中矢的敌人，拔出其身上的投掷武器并将其击退_3格_；此能力有10回合冷却。此外，投掷武器和弓箭首次命中时必定使敌人失明2回合，对被标记的敌人造成_额外30%伤害_，贴身使用时_增加10%命中_（原为减少50%）。
actors.hero.talent.rk_warden.title=自然之王
actors.hero.talent.rk_warden.desc=这一天赋使得鼠王视野能穿过高草，且踩踏每种植物效果都被替换为独特特效！\n\n  _+1：_在踏入草丛时，获得等同于_50%_等级的树肤效果，该效果每1回合衰减。拾取露珠时额外恢复_1点生命_，生命值满时，露珠可以为鼠王提供护盾，上限为_20%_最大生命值。当鼠王向地面射击时，获得3x3区域的视野_5回合_，冷却时间20回合，并将_3x3区域_内的敌人吸引到目标格。涂药飞镖拥有_2倍耐久值_，种子有_10%几率_被真正的草丛而非耕地包围！\n\n  _+2：_在踏入草丛时，获得等同于_100%_等级的树肤效果。拾取露珠时额外恢复_2点生命_，并可提供护盾，上限为_40%_最大生命值。向地面射击时，获得3x3区域的视野_10回合_，并将_5x5区域_内的敌人吸引到目标格。涂药飞镖拥有_3倍耐久值_，种子有_20%几率_被真正的草丛而非耕地包围！\n\n  _+3：_在踏入草丛时，获得等同于_150%_等级的树肤效果。拾取露珠时额外恢复_3点生命_，并可提供护盾，上限为_60%_最大生命值。向地面射击时，获得3x3区域的视野_15回合_，并将_7x7区域_内的敌人吸引到目标格。涂药飞镖拥有_4倍耐久值_，种子有_30%几率_被真正的草丛而非耕地包围！
actors.hero.talent.rk_fighter.title=武术大师
actors.hero.talent.rk_fighter.desc=朕无需兵刃也能所向披靡！\n有了这一天赋，鼠王赤手……赤爪的伤害大幅提升，并会短暂麻痹受_王者智慧_加成影响的敌人。\n\n  _+1：_力量每超过10点便获得1点闪避，力量每超过护甲需求1点攻击速度提升_5%_。徒手命中时，戒指获得_+1级_，持续_1回合_，并有_33%几率_获得1回合瞬间移动，并根据当前戒指发动酷炫攻击！此外，闪避攻击有_20%几率_使下一次徒手攻击不消耗回合。\n\n  _+2：_力量每超过10点便获得1点闪避，力量每超过护甲需求1点攻击速度提升_10%_。徒手命中时，戒指获得_+1级_层数，持续_2回合_（最高+2级），并有_67%几率_获得1回合瞬间移动，并根据当前戒指发动酷炫攻击！若未命中也无妨，有_20%几率_在下一回合获得瞬间闪避。此外，闪避攻击有_40%几率_使下一次徒手攻击不消耗回合。\n\n  _+3：_力量每超过10点便获得1点闪避，力量每超过护甲需求1点攻击速度提升_15%_，徒手伤害还会增加等同于戒指等级的数值。徒手命中时，戒指获得_+1级_层数，持续_2回合_（最高+3级），并_必定_获得1回合瞬间移动，并根据当前戒指发动酷炫攻击！若未命中也无妨，有_20%几率_在下一回合获得瞬间闪避。此外，闪避攻击有_60%几率_使下一次徒手攻击不消耗回合，并获得1回合隐身。
actors.hero.talent.rk_champion.title=双持之舞
actors.hero.talent.rk_champion.desc=这一天赋使得鼠王能同时装备两件武器并瞬间切换，使武器技能更加多变！鼠王还额外获得2点武器充能！\n\n  _+1：_武器充能速度_提升62%_，使用武器技能后，5回合内下一次近战攻击拥有_2倍命中_；若紧接着再次攻击，将处决任何生命值_低于13%_的普通敌人。若手中一件武器比另一件_低2阶或以上_，则两者共享升级等级。切换武器会使下一次攻击_快33%_（冷却10回合），同时使用两种不同的技能会奖励_0.17点武器充能_！此外，两件武器类型相同时，武器充能速度进一步提升_1.25倍_。\n\n  _+2：_武器充能速度_提升74%_，使用武器技能后，5回合内下一次近战攻击拥有_5倍命中_；若紧接着再次攻击，将处决任何生命值_低于27%_的普通敌人。若手中一件武器比另一件_低1阶或以上_，则两者共享升级等级。切换武器会使下一次攻击_快67%_（冷却10回合），同时使用两种不同的技能会奖励_0.33点武器充能_！此外，两件武器类型相同时，武器充能速度进一步提升_1.25倍_，且使用时两件武器都会触发命中效果。\n\n  _+3：_武器充能速度_提升88%_，使用武器技能后，5回合内下一次近战攻击拥有_无限命中_；若紧接着再次攻击，将处决任何生命值_低于40%_的普通敌人。若手中一件武器与另一件_同阶或更低阶_，则两者共享升级等级。切换武器会使下一次攻击_快100%_（冷却10回合），同时使用两种不同的技能会奖励_0.5点武器充能_！此外，两件武器类型相同时，武器充能速度进一步提升_1.25倍_，使用时两件武器都会触发命中效果，且攻击速度提升2倍。
actors.hero.talent.rk_monk.title=阴阳
actors.hero.talent.rk_monk.desc=朕的专注，其他君王望尘莫及！\n这个天赋让鼠王通过击杀怪物积累内力，并用它来自保或反击！\n\n  _+1：_每装备一件_3阶或以下_的装备，鼠王获得的内力增加_50%_；每_100回合_被动获得内力，当内力达到_100%_时，鼠王的招式将得到强化。在5回合内先后使用武器技能和消耗_4点以上内力_的武僧招式时，鼠王回复1点内力，且每消耗1点内力获得_5点护盾_。最后，当鼠王的生命值和内力都处于_100%_时，鼠王可以达到天地人和的境界！\n\n  _+2：_每装备一件_2阶或以下_的装备，鼠王获得的内力增加_100%_（_3阶_装备增加_50%_）；每_80回合_被动获得内力，当内力达到_80%_时，鼠王的招式将得到强化。在5回合内先后使用武器技能和消耗_3点以上内力_的武僧招式时，鼠王回复1点内力，且每消耗1点内力获得_7点护盾_。最后，当鼠王的生命值和内力都处于_80%或以上_时，鼠王可以达到天地人和的境界！\n\n  _+3：_每装备一件_1阶或以下_的装备，鼠王获得的内力增加_150%_（_3阶_装备同样增加_50%_，_2阶_装备增加_100%_）；每_67回合_被动获得内力，当内力达到_60%_时，鼠王的招式将得到强化。在5回合内先后使用武器技能和消耗_2点以上内力_的武僧招式时，鼠王回复1点内力，且每消耗1点内力获得_9点护盾_。最后，当鼠王的生命值和内力都处于_60%或以上_时，鼠王可以达到天地人和的境界！\n\n  处于天地人和状态时，移动速度和攻击速度均提高50%。\n  强化后的空振会附带武器的附魔，强化后的凝神瞬间完成，强化后的登云距离增加4格，强化后的盘龙造成更多伤害并击退周围所有目标，强化后的冥思会恢复鼠王20%已损失的生命值，并使鼠王在此期间受到的伤害减少80%。\n  鼠王没有装备实际武器时，不会获得更多内力。
actors.hero.talent.rk_fencer.title=突刺成王
actors.hero.talent.rk_fencer.desc=无论如何，朕都将勇往直前！\n这个天赋让鼠王消耗武器充能，瞬间_冲刺_一小段距离。成功冲刺后，下一次攻击必定命中并造成更多伤害！\n\n  _+1：_冲刺初始消耗_0.8点充能_，最远可达_3格_，可穿过任何空地，冲刺攻击造成_+15.5%伤害_。使用冲刺后，_下一回合_的冲刺所需充能减半（减免不可叠加），使用武器技能会使下一次冲刺的充能消耗减半。此外，鼠王的力量每超出武器和护甲力量需求1点，就获得_+0.5闪避_。\n\n  _+2：_冲刺初始消耗_0.63点充能_，最远可达_3格_，可穿过任何空地和敌人，冲刺攻击造成_+21.3%伤害_。使用冲刺后，_接下来2回合_的冲刺所需充能减半（减免不可叠加），并在终点产生冲击波，对3x3范围内的敌人造成_10%武器伤害_。使用武器技能会使下一次冲刺的充能消耗减半。此外，鼠王的力量每超出武器和护甲力量需求1点，就获得_+1闪避_。\n\n  _+3：_冲刺初始消耗_0.5点充能_，最远可达_3格_，可穿过敌人和墙壁，冲刺攻击造成_+27.3%伤害_。使用冲刺后，_接下来3回合_的冲刺所需充能减半（减免不可叠加），并在终点产生冲击波，对3x3范围内的敌人造成_10%武器伤害_并使其易伤3回合。使用武器技能会使下一次冲刺的充能消耗减半。此外，鼠王的力量每超出武器和护甲力量需求1点，就获得_+1.5闪避_。
actors.hero.talent.rk_priest.title=启迪
actors.hero.talent.rk_priest.desc=这个天赋让朕能够使用更多远程和魔法法术。\n\n首先，鼠王每50回合可以免费施放一次_神导之光_，鼠王的远程法术会照亮敌人，鼠王还可以用法杖和神器等魔法道具消耗照亮效果，造成等同于其等级+5的伤害。\n\n至于可用的法术：\n  _-_ _破晓辐光_：_2_点充能，驱散黑暗，照亮并眩晕视野内所有敌人。\n  _-_ _神圣净化_：_2_点充能，净化鼠王和盟友_1/3/5回合_，并为鼠王和盟友提供_10/20/30点护盾_。\n  _-_ _神圣标枪_：_4_点充能，投出一枚造成_30-55/45-83/60-110点伤害_的飞弹。对亡灵和恶魔造成最大伤害，冷却时间30回合。\n  _-_ _神圣领域_：_2_点充能，在_3x3/5x5/7x7范围_内创造持续20回合的神圣领域。神圣领域会治疗盟友，为鼠王提供护盾，缠绕敌人，并使范围内长出草，可被火焰摧毁。\n  _-_ _祈愿诗篇_：_1_点充能，瞬间施放，使盟友身上的增益和敌人身上的减益延长_3/4/5回合_。效果不可叠加。\n  _-_ _辉耀射线_：_3_点充能，发射一道长_4/8/12格_的穿墙射线，可发现隐藏的秘密，照亮敌人并造成8-16点伤害（对亡灵和恶魔造成16点），并为盟友恢复8-16点生命。\n  _-_ _神圣炸弹_：_3/2/1_点充能，创造一枚真正的神圣炸弹（在5x5范围内造成伤害，对亡灵和恶魔额外造成50%伤害），照亮爆炸中的敌人；冷却时间50回合。\n  _-_ _复活宣言_：_3_点充能，让鼠王在_接下来3/4/5回合_内拒绝死亡：在此效果下生命值降至0以下时，鼠王将立即恢复10%生命值并获得3回合无敌；触发后此法术进入300回合冷却。
actors.hero.talent.rk_paladin.title=天谴
actors.hero.talent.rk_paladin.desc=这个天赋让朕能够使用专注于近战的法术！\n\n首先，_神圣武器_和_神圣护甲_法术不再覆盖已有的附魔，效果更强，并且可以通过使用其他法术来延长。此外，圣典在未装备时也可以使用，但充能速度只有_25/50/75%_。\n\n至于可用的法术：\n  _-_ _至圣斩击_：_2_点充能，进行一次必中的神圣近战攻击，_+300%附魔威力_，并根据鼠王的等级造成额外伤害，对亡灵和恶魔造成最大伤害。\n  _-_ _圣疗之触_：_1_点充能，立即为选定的生物恢复_15/20/25点生命_（鼠王自己则获得护盾），最多可叠加3次。\n  _-_ _守御灵光_：_2_点充能，为鼠王和2格内所有盟友提供_20/30/40%_的减伤效果，并使鼠王护甲铭文的效果提升_50/75/100%_，持续20回合。\n  _-_ _神圣屏障_：_3_点充能，创造一道长达_3/5/7格_的实体墙，可推开敌人，持续20回合。\n  _-_ _庇佑帷幕_：_1_点充能，使鼠王受到的下一次攻击伤害减少_50%/75%/100%_。\n  _-_ _誓血圣约_：_2_点充能，将鼠王当前生命值的_20/40/60%_转化为双倍的护盾；护盾持续期间，鼠王通过物理攻击造成伤害的_20/40/60%_会转化为生命恢复，且不会超过为此法术消耗的生命值。\n  _-_ _圣战宣告_：_1_点充能，对目标施加_3/4/5回合_的圣战效果，若目标是盟友，持续时间变为三倍。
actors.hero.talent.rk_enchanter.title=符文解读
actors.hero.talent.rk_enchanter.desc=这个天赋让朕能够使用施加各种效果的法术！\n首先，鼠王可以使用_神导之光_、_时间扭曲_、_衰弱咒语_或_灵能冲击_施加持续5回合的随机减益，减益数量随法术的充能消耗而提高。\n\n至于可用的法术：\n  _-_ _暗影爆破_：_2_点充能，移除目标身上所有减益并造成伤害，伤害随鼠王的等级提高，并按移除的减益数量倍增。若此法术击杀目标，则返还充能。\n  _-_ _时间扭曲_：_1_点充能，使敌人迟缓_4/6/8回合_，并为盟友提供_2/3/4回合_的时间气泡。\n  _-_ _衰弱咒语_：_2_点充能，+1时施加幻惑，+2时施加虚弱，+3时施加易伤，持续10回合。\n  _-_ _灵能冲击_：_1_点充能，使敌人麻痹_4/5/6回合_。\n  _-_ _雷电附体_：_2_点充能，施加_雷电附体_效果，持续_10/20/30回合_。\n  _-_ _奥术护甲_：_1_点充能，使鼠王获得_1层奥术护甲_，每_10/20/30回合_衰减一层；最多可叠加至等同于鼠王的等级。\n  _-_ _附魔奇术_：_6/5/4_点充能，为选定的已鉴定且未被诅咒的武器或护甲附魔。
actors.hero.talent.rk_outlaw.title=绿眼皮特
actors.hero.talent.rk_outlaw.desc=每当子弹命中目标，这个天赋就会让朕积累_死亡轮盘_层数。当轮盘达到6层时，下一发子弹将秒杀非首领敌人，并为朕当前的枪装填弹药！\n\n  _+1：_鼠王的子弹可以穿透_紧邻鼠王的_墙壁，开枪后_1回合内_移动会装填一发子弹。死亡轮盘的层数每_8回合_而非6回合衰减一次，满层子弹拥有_2倍命中_，成功击杀时会使视野内敌人迟缓_4回合_。若死亡轮盘达到3层或以上，闪避一次攻击会使鼠王的下一发子弹秒杀生命值低于_13%_的敌人。最后，子弹有_1%概率_直接秒杀目标，且不会触发死亡轮盘的效果。\n\n  _+2：_鼠王的子弹可以穿透_距离鼠王1格_的墙壁，开枪后_2回合内_移动会装填一发子弹。死亡轮盘的层数每_10回合_而非6回合衰减一次，满层子弹拥有_3倍命中_，成功击杀时会使视野内敌人迟缓_8回合_。若死亡轮盘达到3层或以上，闪避一次攻击会使鼠王的下一发子弹秒杀生命值低于_27%_的敌人。最后，子弹有_2%概率_直接秒杀目标，且不会触发死亡轮盘的效果。\n\n  _+3：_鼠王的子弹可以穿透_距离鼠王2格_的墙壁，开枪后_3回合内_移动会装填一发子弹。死亡轮盘的层数每_12回合_而非6回合衰减一次，满层子弹拥有_4倍命中_，成功击杀时会使视野内敌人迟缓_12回合_。若死亡轮盘达到3层或以上，闪避一次攻击会使鼠王的下一发子弹秒杀生命值低于_40%_的敌人。最后，子弹有_3%概率_直接秒杀目标，且不会触发死亡轮盘的效果。\n\n  强大的敌人会受到_+20%伤害_，而不是被死亡轮盘子弹秒杀，也不会为鼠王的枪装填弹药。\n  没有弹药时无法触发装填效果。
actors.hero.talent.rk_gunslinger.title=火药之舞
actors.hero.talent.rk_gunslinger.desc=有了这个天赋，朕移动后可以立即用投掷武器和枪械攻击，但命中率会大幅降低！\n\n  _+1：_鼠王每次移动有_3%概率_向枪中装填一发子弹，瞬发射击拥有_37.5%命中_。装填空枪时，有_1/6概率_使下一发子弹成为_冰冻弹_；打空枪中所有子弹时，鼠王获得_8点护盾_！此外，击杀敌人会让鼠王获得_1回合_无限弹药，且鼠王的力量每超出护甲力量需求_3点_，移动速度提高5%。\n\n  _+2：_鼠王每次移动有_6%概率_向枪中装填一发子弹，瞬发射击拥有_50%命中_。装填空枪时，有_1/3概率_使下一发子弹成为_冰冻弹_或_烈焰弹_；打空枪中所有子弹时，鼠王获得_16点护盾_！此外，击杀敌人会让鼠王获得_2回合_无限弹药，且鼠王的力量每超出护甲力量需求_2点_，移动速度提高5%。\n\n  _+3：_鼠王每次移动有_9%概率_向枪中装填一发子弹，瞬发射击拥有_67.5%命中_。装填空枪时，有_1/2概率_使下一发子弹成为_冰冻弹_、_燃烧弹_或_重击弹_；打空枪中所有子弹时，鼠王获得_27点护盾_！此外，击杀敌人会让鼠王获得_3回合_无限弹药，且鼠王的力量每超出护甲力量需求_1点_，移动速度提高5%。\n\n  没有弹药时无法触发装填效果。
actors.hero.talent.rk_specialist.title=皇家谍报
actors.hero.talent.rk_specialist.desc=有了这个天赋，只要身边没有敌人，朕就可以在高草丛中等待以伪装自己。这会让朕隐形，但移动或攻击时效果会消失！\n\n  _+1：_鼠王的枪声不再惊动敌人，视野范围增加_25%_，隐蔽性增加_1_。在隐蔽状态下射击，伤害会提高至_1.025倍_的子弹飞行距离次方。此外，尝试隐蔽会使鼠王真正隐形_3回合_，冷却15回合；解除隐蔽会使鼠王获得_2回合极速_，冷却30回合。\n\n  _+2：_鼠王的枪声不再惊动敌人，视野范围增加_50%_，隐蔽性增加_2_，且鼠王可以在敌人面前隐蔽。在隐蔽状态下射击，伤害会提高至_1.05倍_的子弹飞行距离次方。此外，尝试隐蔽会使鼠王真正隐形_6回合_，冷却15回合；解除隐蔽会使鼠王获得_4回合极速_，冷却30回合。\n\n  _+3：_鼠王的枪声不再惊动敌人，视野范围增加_75%_，隐蔽性增加_3_，且鼠王可以在敌人面前隐蔽。在隐蔽状态下射击，伤害会提高至_1.075倍_的子弹飞行距离次方，保持隐蔽不再消耗饥饿度。此外，尝试隐蔽会使鼠王真正隐形_9回合_，冷却15回合；解除隐蔽会使鼠王获得_6回合极速_，冷却30回合。\n\n  隐蔽子弹的伤害加成上限为+150%。
actors.hero.talent.rk_slasher.title=誓约胜利之剑的祝福
actors.hero.talent.rk_slasher.desc=朕虽没有传说之剑，但它的精神依然通过剑气延续！\n这个天赋让鼠王通过攻击积累能量，然后将其_释放为剑气飞弹_，对路径上的所有敌人造成物理伤害！\n\n  _+1：_鼠王最多可储存_90点伤害_作为剑气能量，并将造成物理伤害的_133%_转化为能量。剑气飞弹消耗_80%的剑气能量_，每次命中有_33%概率_触发鼠王武器的附魔，并将其造成总伤害的_13%_返还为剑气能量；若鼠王处于纳刀状态，飞弹将造成_额外5点魔法伤害_！最后，鼠王的暴击伤害提高_5%_。\n\n  _+2：_鼠王最多可储存_120点伤害_作为剑气能量，并将造成物理伤害的_166%_转化为能量。剑气飞弹消耗_70%的剑气能量_，每次命中有_67%概率_触发鼠王武器的附魔，并将其造成总伤害的_20%_返还为剑气能量；若鼠王处于纳刀状态，飞弹将造成_额外10点魔法伤害_！最后，鼠王的暴击伤害提高_10%_。\n\n  _+3：_鼠王最多可储存_150点伤害_作为剑气能量，并将造成物理伤害的_200%_转化为能量。剑气飞弹消耗_60%的剑气能量_，每次命中都会触发鼠王武器的附魔，并将其造成总伤害的_25%_返还为剑气能量；若鼠王处于纳刀状态，飞弹将造成_额外15点魔法伤害_！最后，鼠王的暴击伤害提高_15%_。\n\n  如果鼠王拥有索敌附魔，剑气飞弹将可穿过任何墙壁！
actors.hero.talent.rk_master.title=影舞
actors.hero.talent.rk_master.desc=朕要刺穿视野内的一切！\n这项天赋让鼠王能在纳刀时_传送到地图上的任何地方_。如果传送后没有命中敌人，传送将进入冷却。鼠王的纳刀攻击会_变为瞬发，并拥有大幅提高的暴击率_，但如果这次攻击未能暴击，这些加成将进入冷却；若传送处于冷却中，鼠王同样无法获得加成。\n\n  _+1：_强化的纳刀攻击暴击率提高到_1.6倍_，暴击时额外造成_15%伤害_。若该攻击未暴击，强化效果将进入_25回合_冷却。击杀敌人有_33%几率_保留纳刀效果。若鼠王对空地使用纳刀传送，强化效果将进入90回合冷却。每次成功的强化攻击都能让鼠王看到_3格半径_内的所有敌人，并使下一次强化攻击获得5%伤害加成，最多叠加至_25%_。\n\n  _+2：_强化的纳刀攻击暴击率提高到_1.75倍_，暴击时额外造成_30%伤害_。若该攻击未暴击，强化效果将进入_20回合_冷却。击杀敌人有_67%几率_保留纳刀效果。若鼠王对空地使用纳刀传送，强化效果将进入80回合冷却。每次成功的强化攻击都能让鼠王看到_6格半径_内的所有敌人，并使下一次强化攻击获得5%伤害加成，最多叠加至_50%_。\n\n  _+3：_强化的纳刀攻击暴击率提高到_2倍_，暴击时额外造成_45%伤害_。若该攻击未暴击，强化效果将进入_15回合_冷却。击杀敌人有_100%几率_保留纳刀效果。若鼠王对空地使用纳刀传送，强化效果将进入70回合冷却。每次成功的强化攻击都能让鼠王看到_9格半径_内的所有敌人，并使下一次强化攻击获得5%伤害加成，最多叠加至_75%_。\n\n  加速伤害加成会在10回合后或传送冷却开始时重置。
actors.hero.talent.rk_slayer.title=烈焰之力
actors.hero.talent.rk_slayer.desc=只靠专注有时还不够！\n这项天赋能让鼠王进入_鬼人化_状态，造成的伤害减半，但攻击速度翻倍，且每回合受到1点伤害。鬼人化期间，鼠王的暴击攻击不消耗回合，并获得相当于鼠王等级一半的额外闪避，敌人的闪避每比鼠王高1点，鼠王的暴击率就+1%。生命降到1点或手动关闭该效果将触发冷却。\n\n  _+1：_进入鬼人化的冷却时间为_24回合_，开启鬼人化时，鼠王会获得_1回合_的无限闪避。鬼人化期间，成功暴击可获得1点护盾（最多叠加至_20%最大生命值_），鼠王的力量每超出护甲需求1点，获得_+1闪避_，并获得_+10%暴击率_，闪避攻击时获得_2回合_的极速。\n\n  _+2：_进入鬼人化的冷却时间为_19回合_，开启鬼人化时，鼠王会获得_2回合_的无限闪避。鬼人化期间，成功暴击可获得1点护盾（最多叠加至_40%最大生命值_），鼠王的力量每超出护甲需求1点，获得_+2闪避_，并获得_+20%暴击率_，闪避攻击时获得_3回合_的极速。\n\n  _+3：_进入鬼人化的冷却时间为_15回合_，开启鬼人化时，鼠王会获得_3回合_的无限闪避。鬼人化期间，成功暴击可获得1点护盾（最多叠加至_60%最大生命值_），鼠王的力量每超出护甲需求1点，获得_+3闪避_，并获得_+30%暴击率_，闪避攻击时获得_4回合_的极速。
actors.hero.talent.rk_engineer.title=光合作用
actors.hero.talent.rk_engineer.desc=朕能用藤蔓绳索建造东西，所需绳索数量不一，耗时2回合并消耗6点饥饿。如果朕持有任何采矿工具，耗时和饥饿消耗减半！\n\n  可建造的列表包括：\n  _-_ _路障_：_10根绳索_，建造并摧毁木制路障。\n  _-_ _地面_：_0根绳索_，将地面变为深渊，将深渊变为地面。\n  _-_ _沙墙_：_4/4/2根绳索_，一堵能阻挡敌人的墙；+2/+3时生命值和护甲翻倍。\n  _-_ _绊线陷阱_：_4/4/2根绳索_，一种地面陷阱，能使敌人残废并流血；+2/+3时基础流血伤害增加3。\n  _-_ _瞭望塔_：_8/8/4根绳索_，一座能让鼠王看见周围地块的建筑；+2/+3时视野范围从9x9增加到13x13。\n  _-_ _加农火炮_：_15根绳索_，一座固定炮塔，可发射炸弹，在3x3范围内造成_40-100/40-150/40-150点伤害_，共有_6/6/3发炮弹_。\n  _-_ _机枪_：_10根绳索_，一座固定的自动炮塔，会自动射击敌人，造成_4-4(+0/+1.33)/6-6(+0/+2)/6-6(+0/+2) 点伤害_；+3时射程增加。\n  _-_ _迫击炮_：_50根绳索_，一座固定炮塔，可发射炸弹，在3x3范围内造成_20-100/20-150/20-150点伤害_，共有_10/10/5发炮弹_。\n\n  每次攻击还有_5/10/15%几率_使草地生长。
actors.hero.talent.rk_explorer.title=失落护符的掠夺者
actors.hero.talent.rk_explorer.desc=这座地牢里的宝藏，一件也不能落下！\n这项天赋让鼠王能_用藤蔓绳索把近战武器打到尽可能远的地方_！不过，每次超出正常攻击范围的攻击都会消耗绳索。\n\n  _+1：_鼠王的砍刀拥有_额外1格射程_，并从中获得_20%额外_的藤蔓绳索。用绳索延伸近战攻击时，每格消耗_0.8根绳索_，用绳索拉扯敌人会使其残废_2回合_。此外，绳索用于其本职用途时鼠王只消耗一半，并且鼠王能用它们使相邻敌人缠绕_3回合_（这总会消耗5根绳索）。最后，鼠王在高草中的移动速度_加快20%_！\n\n  _+2：_鼠王的砍刀拥有_额外2格射程_，并从中获得_30%额外_的藤蔓绳索。用绳索延伸近战攻击时，每格消耗_0.7根绳索_，用绳索拉扯敌人会使其残废_3回合_。此外，绳索用于其本职用途时鼠王只消耗一半，且不消耗回合，并且鼠王能用它们使相邻敌人缠绕_6回合_（这总会消耗5根绳索）。最后，鼠王在高草中的移动速度_加快44%_！\n\n  _+3：_鼠王的砍刀拥有_额外3格射程_，并从中获得_40%额外_的藤蔓绳索。用绳索延伸近战攻击时，每格消耗_0.6根绳索_，用绳索拉扯敌人会使其残废_4回合_。此外，绳索用于其本职用途时鼠王只消耗一半，不消耗回合，还能穿墙，并且鼠王能用它们使相邻敌人缠绕_9回合_（这总会消耗5根绳索）。最后，鼠王在高草中的移动速度_加快73%_！
actors.hero.talent.rk_researcher.title=皇家化学
actors.hero.talent.rk_researcher.desc=混合、搭配、附魔！\n这项天赋让鼠王能从踩到的植物上_获得效果_，就像_自然支配_那样，并且鼠王的攻击会施加_腐蚀淤泥_。\n\n  _+1：_鼠王对亡灵和无机敌人造成_10%额外伤害_，物理攻击会施加_7.5回合_的腐蚀淤泥。踩踏草地会立即获得_0.2回合的神器充能_，用铲子挖草时有_20%几率_留下翻过的草地，而不是将其完全清除。鼠王还能把水挖走，有_5%几率_在水的位置生成露珠。最后，被淤泥沾染的敌人移动速度_减慢10%_。\n\n  _+2：_鼠王对亡灵和无机敌人造成_20%额外伤害_，物理攻击会施加_10回合_的腐蚀淤泥。踩踏草地会立即获得_0.4回合的神器充能_，用铲子挖草时有_40%几率_留下翻过的草地，而不是将其完全清除。鼠王还能把水挖走，有_10%几率_在水的位置生成露珠。最后，被淤泥沾染的敌人移动速度_减慢20%_。\n\n  _+3：_鼠王对亡灵和无机敌人造成_30%额外伤害_，物理攻击会施加_12.5回合_的腐蚀淤泥。踩踏草地会立即获得_0.6回合的神器充能_，用铲子挖草时有_60%几率_留下翻过的草地，而不是将其完全清除。鼠王还能把水挖走，有_15%几率_在水的位置生成露珠。最后，被淤泥沾染的敌人移动速度_减慢30%_。
actors.hero.talent.rk_deathknight.title=帝国瘟疫使者
actors.hero.talent.rk_deathknight.desc=这项天赋让朕能从被朕击杀并掉落战利品或经验的敌人身上_收集灵魂_。这些灵魂会保护朕免于死亡，使朕以5%生命值复活！\n\n  _+1：_使用近战武器攻击时，鼠王获得_5%护甲值_的额外伤害，并有_10%几率_在击败敌人后将其腐化。灵魂复活会额外为鼠王恢复_3点生命_，赋予鼠王20回合的寒霜之力，召唤_1只腐化怨灵_，并使视野内所有敌人陷入_虚弱_状态10回合。最后，生命降至0时，鼠王会拒绝死亡，直到复活前_1回合_。\n\n  _+2：_使用近战武器攻击时，鼠王获得_10%护甲值_的额外伤害，并有_20%几率_在击败敌人后将其腐化。灵魂复活会额外为鼠王恢复_6点生命_，赋予鼠王20回合的寒霜之力，向所有敌人散播寒气，召唤_2只腐化怨灵_，并使视野内所有敌人陷入_虚弱和易伤_状态10回合。最后，生命降至0时，鼠王会拒绝死亡，直到复活前_2回合_。\n\n  _+3：_使用近战武器攻击时，鼠王获得_15%护甲值_的额外伤害，并有_30%几率_在击败敌人后将其腐化。灵魂复活会额外为鼠王恢复_9点生命_，赋予鼠王20回合的寒霜之力，向所有敌人散播寒气并瞬间冻结他们，召唤_4只腐化怨灵_，并使视野内所有敌人陷入_虚弱、易伤和恐惧_状态10回合。最后，生命降至0时，鼠王会拒绝死亡，直到复活前_3回合_。
actors.hero.talent.rk_horseman.title=皇家骑兵
actors.hero.talent.rk_horseman.desc=这项天赋让朕能骑乘虚幻的战马_发动强力冲锋_，冲锋会贯穿所有敌人直至撞上墙壁，但每行进一格会对朕造成5点伤害。战马也会替朕承受伤害，但它死亡时朕会受到坠落伤害。\n\n  _+1：_骑乘冲锋造成鼠王普通攻击_120%的伤害_，每击中一个敌人减少_1-3点惯性伤害_，并且每行进_6格_就会将1格外的敌人冲击震飞。鼠王的灵魂战马拥有_3-24点护甲_，从马上摔落时鼠王受到的伤害_减少25%_。此外还有个不错的奖励：鼠王的力量每超出护甲需求1点，移动速度提升至_1.03倍_。\n\n  _+2：_骑乘冲锋造成鼠王普通攻击_140%的伤害_，每击中一个敌人减少_2-6点惯性伤害_，并且每行进_4格_就会将1格外的敌人冲击震飞。鼠王的灵魂战马拥有_4-32点护甲_，从马上摔落时鼠王受到的伤害_减少50%_。此外还有个不错的奖励：鼠王的力量每超出护甲需求1点，移动速度提升至_1.06倍_。\n\n  _+3：_骑乘冲锋造成鼠王普通攻击_160%的伤害_，每击中一个敌人减少_3-9点惯性伤害_，并且每行进_2格_就会将1格外的敌人冲击震飞。鼠王的灵魂战马拥有_4-32点护甲_，从马上摔落时鼠王受到的伤害_减少75%_。此外还有个不错的奖励：鼠王的力量每超出护甲需求1点，移动速度提升至_1.09倍_。
actors.hero.talent.rk_crusader.title=战斗使徒
actors.hero.talent.rk_crusader.desc=你的罪孽，如今是朕的力量！\n这项天赋让鼠王能_消耗5点经验来祈祷_，获得3回合的神圣祝福。受到祝福期间，鼠王会将物理攻击所造成伤害的_40%_转化为治疗！\n\n  _+1：_受到祝福期间，鼠王对亡灵和恶魔造成_33%额外伤害_，祝福攻击溢出的治疗会转化为最多_20%最大生命值_的护盾。祈祷期间，鼠王受到的元素伤害_减少33%_，被击中时，_鼠王的下一次攻击_将附带闪电伤害，并会即刻杀死生命值低于_13%_的敌人。击败敌人后祈祷将额外获得3回合神圣祝福。最后，鼠王的护甲获得_+1额外等级_！\n\n  _+2：_受到祝福期间，鼠王对亡灵和恶魔造成_67%额外伤害_，祝福攻击溢出的治疗会转化为最多_40%最大生命值_的护盾。祈祷期间，鼠王受到的元素伤害_减少67%_，被击中时，_鼠王接下来的2次攻击_将附带闪电伤害，并会即刻杀死生命值低于_27%_的敌人。击败敌人后祈祷将额外获得3回合神圣祝福，且不消耗经验。最后，鼠王的护甲获得_+2额外等级_！\n\n  _+3：_受到祝福期间，鼠王对亡灵和恶魔造成_100%额外伤害_，祝福攻击溢出的治疗会转化为最多_60%最大生命值_的护盾。祈祷期间，鼠王受到的元素伤害_为零_，被击中时，_鼠王接下来的3次攻击_将附带闪电伤害，并会即刻杀死生命值低于_40%_的敌人。击败敌人后祈祷将额外获得3回合神圣祝福，不消耗经验并为鼠王恢复3点生命。最后，鼠王的护甲获得_+3额外等级_！
actors.hero.talent.rk_savior.title=仁慈统治者
actors.hero.talent.rk_savior.desc=鼠王国里，一个都不能落下！\n这项天赋让鼠王能用射线枪_征募敌人_来帮助鼠王；成功几率随目标已损失生命值的增加而提高。\n\n  _+1：_鼠王在一层中最多可拥有_3名被征募者_，生命值低于_10%_的敌人必定会被征募；被征募的角色会缓慢恢复_20%最大生命值_。鼠王的伽马射线枪治疗量_提高20%_，对盟友使用时会施加_3回合_的中毒和激素涌动，并给予60%命中率和30%伤害加成_1回合_。最后，攻击敌人会为所有可见盟友恢复_3点生命_（治疗量随其与鼠王的距离递减）。\n\n  _+2：_鼠王在一层中最多可拥有_4名被征募者_，生命值低于_15%_的敌人必定会被征募；被征募的角色会缓慢恢复_40%最大生命值_。鼠王的伽马射线枪治疗量_提高40%_，对盟友使用时会施加_6回合_的中毒和激素涌动，并给予60%命中率和30%伤害加成_2回合_。最后，攻击敌人会为所有可见盟友恢复_6点生命_（治疗量随其与鼠王的距离递减）。\n\n  _+3：_鼠王在一层中最多可拥有_5名被征募者_，生命值低于_20%_的敌人必定会被征募；被征募的角色会缓慢恢复_60%最大生命值_。鼠王的伽马射线枪治疗量_提高60%_，对盟友使用时会施加_9回合_的中毒和激素涌动，并给予60%命中率和30%伤害加成_3回合_。最后，攻击敌人会为所有可见盟友恢复_9点生命_（治疗量随其与鼠王的距离递减）。
actors.hero.talent.rk_therapist.title=人形沙包
actors.hero.talent.rk_therapist.desc=这个天赋让朕在受伤时能对自己使用_急救_，为自己疗伤！当然有冷却时间，但击杀任何敌人都能清除冷却。\n\n  _+1：_使用急救时，鼠王会在_2回合_内恢复_最近一次受到伤害的50%_，清除自身所有负面效果，受到的伤害减少50%，并在_下一回合_内瞬间移动，且鼠王身边所有敌人会受到相当于_总治疗量_的伤害。该能力的最大冷却时间为_50回合_。\n\n  _+2：_使用急救时，鼠王会在_3回合_内恢复_最近一次受到伤害的60%_，清除自身所有负面效果，获得2回合的气体免疫，受到的伤害减少50%，并在_接下来2回合_内瞬间移动，且鼠王身边所有敌人会受到相当于_2倍总治疗量_的伤害。该能力的最大冷却时间为_30回合_。\n\n  _+3：_使用急救时，鼠王会在_4回合_内恢复_最近一次受到伤害的70%_，清除自身所有负面效果，获得2回合的气体和负面效果免疫，受到的伤害减少50%，并在_接下来3回合_内瞬间移动，且鼠王身边所有敌人会受到相当于_3倍总治疗量_的伤害。该能力的最大冷却时间为_20回合_。
actors.hero.talent.rk_medicalofficer.title=认真对待
actors.hero.talent.rk_medicalofficer.desc=这个天赋让朕能够下达军事指令，在地牢中完成特定的任务。击杀敌人可以获得下达指令的权利，最多累积6条指令。\n\n  指令包括：\n  _-_ _招募_：_1+点充能_，召唤一名可中距离射击的普通士兵；每有一名招募的士兵存活，消耗增加1点。\n  _-_ _医疗支援_：_1点充能_，迅速为鼠王的指令所召唤的所有士兵恢复20%的生命值。\n  _-_ _移动_：_1/0/0点充能_，命令所有士兵前往指定目标；+3时甚至可以指挥当前不可见的士兵。\n  _-_ _兴奋剂_：_1点充能_，使所有可见的士兵获得+60%命中和+30%伤害，持续_5/10/15回合_。\n  _-_ _工兵_：_1点充能_，在指定位置建造_机枪/加农炮/迫击炮_塔。\n  _-_ _晋升_：_3/3/2点充能_，将普通士兵晋升为狙击手、守护者或爆破手；+2/+3时会将晋升后的士兵恢复至满血。\n  _-_ _爆炸_：_5点充能_，制造一枚超级炸药，部署后10回合会在_7x7/13x13/19x19范围_内爆炸。\n  _-_ _近距空中支援_：_3点充能_，在指定目标处投下炸弹，目标最远可距离鼠王_5/8/11格_。\n\n  作为小小的奖励，鼠王可以用投掷武器攻击敌人或盟友，使其陷入_众矢之的_状态，持续_5/10/15回合_（若是盟友则为_1/2/3回合_）。
actors.hero.talent.rk_bowmaster.title=箭术精湛
actors.hero.talent.rk_bowmaster.desc=朕可不只是擅长自然之弓！\n这个天赋_消除_射箭带来的_疲劳_，让鼠王能为_箭袋灌注_灵药和药剂，并使鼠王的箭获得提升伤害的连击。箭矢连击达到4层后，鼠王可以为下一支箭灌注额外的力量，使其_必定命中_并造成额外伤害！\n\n  _+1：_箭矢连击上限为_5_，没有箭矢连击时射击会产生一支瞬发箭，造成_20%伤害_，灌注到箭袋中的药剂可多持续_6次使用_。积攒箭矢连击时，有_80%几率_在下次移动时保留连击，且周围5x5范围内没有敌人时鼠王获得_+10%移动速度_。最后，鼠王的箭有_16%几率_不消耗弹药。\n\n  _+2：_箭矢连击上限为_6_，没有箭矢连击时射击会产生一支瞬发箭，造成_40%伤害_，灌注到箭袋中的药剂可多持续_12次使用_。积攒箭矢连击时，鼠王会在下次移动时保留连击，且周围5x5范围内没有敌人时鼠王获得_+20%移动速度_。最后，鼠王的箭有_33%几率_不消耗弹药。\n\n  _+3：_箭矢连击上限为_7_，没有箭矢连击时射击会产生一支瞬发箭，造成_60%伤害_，灌注到箭袋中的药剂可多持续_18次使用_。积攒箭矢连击时，鼠王会在下次移动时获得1层箭矢连击，且周围5x5范围内没有敌人时鼠王获得_+30%移动速度_。最后，鼠王的箭有_50%几率_不消耗弹药。\n\n  鼠王仍需在移动后射箭，否则会失去基于移动的加成。\n  每投入一点该天赋，鼠王还会免费获得一把_短弓/长弓/巨弓_。
actors.hero.talent.rk_juggler.title=飞斧之舞
actors.hero.talent.rk_juggler.desc=弹幕？说到底还是战斧弹幕！\n有了这个天赋，鼠王可以通过新的物品动作在身边_杂耍投掷武器_，然后一次性全部扔出去！\n\n  _+1：_鼠王最多可同时杂耍_4件投掷武器_，并以_70%命中率_全部扔出，每次命中产生_5金币_。将武器加入杂耍栈需要_0.67回合_。移动时有_1%几率_向杂耍栈加入一支箭，击杀敌人必定向栈中加入_1支箭_。此外，近战命中敌人会使鼠王的投掷攻击在5回合内多造成_10%伤害_！\n\n  _+2：_鼠王最多可同时杂耍_5件投掷武器_，并以_90%命中率_全部扔出，每次命中产生_10金币_。将武器加入杂耍栈需要_0.33回合_。移动时有_2%几率_向杂耍栈加入一支箭，击杀敌人必定向栈中加入_2支箭_。此外，近战命中敌人会使鼠王的投掷攻击在5回合内多造成_20%伤害_！\n\n  _+3：_鼠王最多可同时杂耍_6件投掷武器_，并以_110%命中率_全部扔出，每次命中产生_15金币_。将武器加入杂耍栈_不消耗回合_。移动时有_3%几率_向杂耍栈加入一支箭，击杀敌人必定向栈中加入_3支箭_。此外，近战命中敌人会使鼠王的投掷攻击在5回合内多造成_30%伤害_！\n\n  为杂耍栈生成箭矢会消耗鼠王的弹药。
actors.hero.talent.rk_sharpshooter.title=警觉的遐想
actors.hero.talent.rk_sharpshooter.desc=这个天赋解锁特殊的_连射_技能，可以向一个方向射出多发子弹或箭矢（取决于朕持有的武器），若以自己为目标，则会向周围所有方向随机扫射。击杀任何敌人可为该技能充能。\n\n  _+1：_用箭矢连射击杀敌人使鼠王获得_2回合_瞬间移动。枪械连射结束后，鼠王会向枪中装填_1发子弹_，箭矢连射的箭有_33%几率_被回收。此外，每命中_7次远程射击_可额外为连射充能，鼠王的连射拥有_2倍命中_，并会秒杀_生命值低于10%_的敌人。最后，鼠王的远程武器有_10%几率_对敌人降下闪电，造成20%-60%的额外伤害！\n\n  _+2：_用箭矢连射击杀敌人使鼠王获得_3回合_瞬间移动。枪械连射结束后，鼠王会向枪中装填_2发子弹_，箭矢连射的箭有_67%几率_被回收。此外，每命中_5次远程射击_可额外为连射充能，鼠王的连射拥有_5倍命中_，并会秒杀_生命值低于20%_的敌人。最后，鼠王的远程武器有_20%几率_对敌人降下闪电，造成20%-60%的额外伤害！\n\n  _+3：_用箭矢连射击杀敌人使鼠王获得_4回合_瞬间移动。枪械连射结束后，鼠王会向枪中装填_3发子弹_，箭矢连射的箭有_100%几率_被回收。此外，每命中_3次远程射击_可额外为连射充能，鼠王的连射拥有_无限命中_，并会秒杀_生命值低于30%_的敌人。最后，鼠王的远程武器有_30%几率_对敌人降下闪电，造成20%-60%的额外伤害！
actors.hero.talent.betterer_choice.title=赢得的胜利
actors.hero.talent.betterer_choice.desc=_+1：_完美完成任务或首领战将奖励英雄一块_附魔符石_。\n\n_+2：_完美完成任务或首领战将奖励英雄一块_附魔符石_和一张_蜕变秘卷_。\n\n_+3：_完美完成任务或首领战将奖励英雄一块_附魔符石_、一张_蜕变秘卷_和一瓶_神意启发合剂_。
actors.hero.talent.betterer_choice.comment=“这就是我开启所有难度修改器的原因。”
actors.hero.talent.aftershock.title=余震
actors.hero.talent.aftershock.desc=_+1:_ 冲击波影响_1-2格_内的所有人，并且有_20%_的几率触发诸如附魔和连击之类的命中效果。此外，它会造成_15%_的额外伤害，并且有_20%_的几率击晕而不是致残。\n\n_+2:_ 冲击波会影响_2格_内的所有人，并且有_40%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_30%_的额外伤害，并且有_40%_的几率击晕而不是致残。\n\n_+3:_ 冲击波影响_2-3格_内的所有人，并且有_60%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_45%_的额外伤害，并且有_60%_的几率击晕而不是致残。\n\n_+4:_ 冲击波会影响_3格_内的所有人，并且有_80%_的几率触发诸如附魔和连击之类的命中效果。此外,它会造成_60%_的额外伤害，并且有_80%_的几率击晕而不是致残。
actors.hero.talent.rat_blast.title=老鼠爆炸
actors.hero.talent.rat_blast.desc=_+1:_ 元素风暴半径增加到_5格_，增加_25%_的威力，每个受爆炸影响的角色为鼠王提供_2.5点_护盾，上限5个角色。\n\n_+2:_ 元素风暴半径增加到_6格_，增加_50%_的威力，每个受爆炸影响的角色为鼠王提供_5点_护盾，上限6个角色。\n\n_+3:_ 元素风暴半径增加到_7格_，增加_75%_威力，并且每一个受爆炸影响的角色为鼠王提供_8点_护盾，上限7个角色。\n\n_+4:_ 元素风暴半径增加到_8格_，增加_100%_威力，并且每一个受爆炸影响的角色为鼠王提供_10点_护盾，上限8个角色。
actors.hero.talent.smoke_and_mirrors.title=烟雾镜像
actors.hero.talent.smoke_and_mirrors.desc=_+1:_ 闪现后，留下一个有_ 20 点生命与 1-3 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_1回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少20%消耗。\n\n_+2:_ 闪现后，留下一个有_ 40 点生命与 2-6 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_2回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少36%消耗。\n\n_+3:_ 闪现后，留下一个有_ 60 点生命与 3-9 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_3回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少50%消耗。\n\n_+4:_ 闪现后，留下一个有_ 80 点生命与 4-12 点护甲_的替身木桩。此外，在完成鼠王之怒后，获得_4回合的加速和隐身_效果。如果在隐形状态下使用鼠王之怒，将立即闪现到一个新的有效位置，而不是释放怒火，并减少60%消耗。
actors.hero.talent.sea_of_blades.title=灵刃之海
actors.hero.talent.sea_of_blades.desc=_+0:_ 灵魂飞刃的伤害和命中效果的总效果是_100%_，平均分配给所有目标。\n\n_+1:_ 灵魂飞刃的总效果增加到_150%_，并且有_30%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加25%_，并且可以穿透_2格固体_。\n\n_+2:_ 灵魂飞刃的总效果增加到_200%_，并且有_60%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加50%_，并且可以穿透_4格固体_。\n\n_+3:_ 灵魂飞刃的总效果增加到_250%_，并且有_90%概率_使用灵能弓上的附魔。灵魂飞刃的精准_增加75%_，并且可以穿透_6格固体_。\n\n_+4:_ 灵魂飞刃的总效果增加到_300%_，并且有_100%概率_使用灵能弓上的附魔。并且_增加10%_的触发几率。灵魂飞刃的精准_增加100%_，并且可以穿透_8格固体_。\n\n单个目标不会分配到超过100%的灵刃效果。
actors.mobs.abyssalspawner.name=深渊卵巢
actors.mobs.abyssalspawner.desc=这团扭曲的现实混合体会从混沌的虚空和逝去的灵魂中造出深渊生物。\n\n深渊卵巢看起来很吓人，但它无法移动，也不能直接自卫。不过它的密度极高、再生很快，很难被迅速杀死，而且受到威胁时会更快地生出敌人。\n\n_最终击杀它可以获得一份特殊奖励。_
actors.mobs.abyssalspawner$clump.name=符文簇
actors.mobs.abyssalspawner$clump.desc=这块深渊物质的碎片似乎注入了奇异而熟悉的强化力量。一个簇的能量不足以实际升级你的装备。也许两个可以组合成可用的东西？
actors.mobs.abyssalspawner$clump.piece1=你收集了一个符文簇，但需要更多才能制作升级物品。
actors.mobs.abyssalspawner$clump.piece2=两个收集到的符文簇似乎融合在一起，创造了一个升级卷轴！
actors.mobs.darkestelf.name=黑暗精灵
actors.mobs.darkestelf.desc=这个存在黑得连眼睛都看不见，里面只有绝望和虚无。黑暗精灵会借助深渊的混沌魔法，召唤出黏滑、会分裂的暗黑史莱姆来协助作战。
actors.mobs.darkslime.name=暗黑史莱姆
actors.mobs.darkslime.desc=地牢黑暗能量的化身。每一次非魔法攻击都会把它分裂成两只略小、但同样危险的史莱姆。不过，它受到奥术魔法的伤害会高得多。
actors.mobs.spectrerat.name=魔化老鼠
actors.mobs.spectrerat.desc=这具老鼠尸体被深渊魔法复活了。在空闲状态下，它会在原地抽搐，试图爬起来。一旦被激怒，这种啮齿动物就会喷出有害的腐败气体，造成魔法伤害和负面效果。
actors.mobs.spectrerat.bolt_kill=腐化飞弹杀死了你...
actors.mobs.ghostchicken.name=雏鸡幽灵
actors.mobs.ghostchicken.desc=雏鸡幽灵是一种深渊幽灵，它可以以难以置信的速度移动，吸收所有的伤害，并对敌人施以穿透护甲的缩小诅咒。
actors.mobs.phantom.name=深渊幻影
actors.mobs.phantom.desc=深渊幻影是深渊的天然居民。它们是完全不可见的，只在它们所在的位置散发出少量的灰尘。一旦被唤醒，他们会散布辐射性瘴气，以保护自己免受近战打击。为了躲开它们，你可以离开房间，因为深渊幻影的体积对门来说太大了。
actors.mobs.trappet.name=陷阱捕猎者
actors.mobs.trappet.desc=这个类人生物可以使用无数的陷阱来围住他的敌人。他们没有伤害法术，所以你可以通过近战攻击来对抗那些捕猎者。
actors.mobs.lostspirit.name=迷失灵魂
actors.mobs.lostspirit.desc=迷失灵魂是深渊的精英怪物之一。它们由人类的灵魂组成，这些灵魂被此地的灭绝之光和虚空能量吞噬，因此能够用光束赋予你的敌人精英变异，让它们更强。变异可以让生物喷火、在水中游动、吸收伤害，或是使用混沌魔法。\n\n迷失灵魂保留着一丝人性，所以生命值很低，也不会攻击你或你的盟友；但它们施法时会给自己套上护盾，重伤时会主动撤退，并同时从更深层召来其他深渊怪物助战。\n\n远程攻击对它们的效果远不如近战。
actors.mobs.abyssalnightmare.name=深渊梦魇
actors.mobs.abyssalnightmare.desc=深渊梦魇是深渊中的精英怪物之一。它们对任何魔法伤害和除狂乱以外的所有减益都有很高的抗性，还能复制自身来增强攻势。它们的韧性会随着生命流失而下降：受到的伤害越多，之后每次挨打受到的伤害也越多。\n\n由于梦魇与深渊本身融为一体，它们能感知外界的任何动静并主动寻找对手。躲在墙后没有用，梦魇会把墙吞掉来接近你。
actors.mobs.blinkingman.name=闪烁者
actors.mobs.blinkingman.desc=这些深渊恶魔擅长保持距离。它们投出的灵魂标枪有几率把目标推开；如果敌人贴近到近战范围，闪烁者会朝随机方向传送开，然后继续攻击。
actors.mobs.dragon.name=深渊巨龙
actors.mobs.dragon.desc=深渊巨龙是深渊中的精英怪物之一。它们喷出的深渊之火会造成霜火燃烧，并在你周围生成幼龙；它们的近战攻击还会波及你附近的盟友。
actors.mobs.dragon$smalldragon.name=深渊幼龙
actors.mobs.dragon$smalldragon.desc=虽然不如成年的深渊巨龙强壮，但巨龙能直接把它们生成在你身边，照样很麻烦。
actors.mobs.finalfroggit.name=末世魔蛙
actors.mobs.finalfroggit.bolt_kill=灭绝雷霆消灭了你...
actors.mobs.finalfroggit.desc=很久以前，这些青蛙是城市下层的人造守卫。矮人文明覆灭后，末世魔蛙被黑暗能量吞没，化为了灭绝之光的化身。\n\n只要这种生物还在，你就无法下到更深层。
actors.mobs.finalfroggit$eradication.name=灭绝
actors.mobs.finalfroggit$eradication.desc=你暴露在更强的光线下。\n\n此效果持续期间，末世魔蛙对你造成的伤害会越来越高。\n\n剩余回合：%1$s。\n\n受到伤害倍率：%2$sx。
actors.buffs.shrink.name=缩小
actors.buffs.shrink.desc=周围的一切似乎都变大了，这让人很难继续前进。\n\n被缩小的角色受到的所有伤害都会增加，精准和闪避降低，近战攻击和魔法造成的伤害也会减少。\n\n缩小是永久性的，只有死亡才能结束它。
actors.buffs.timedshrink.name=缩小
actors.buffs.timedshrink.desc=周围的一切似乎都变大了，这让人很难继续前进。\n\n被缩小的角色受到的所有伤害都会增加，精准和闪避降低，近战攻击和魔法造成的伤害也会减少。\n\n缩小剩余回合：%s。
actors.blobs.frostfire.name=冰霜之火
actors.blobs.frostfire.desc=一团霜火冷焰正在这里肆虐。
actors.blobs.miasma.name=瘴气
actors.blobs.miasma.desc=暗能量的斑点正在这里聚集。不要触碰瘴气，它会给其中的每个目标带来负面影响。
actors.buffs.frostburn.name=霜火燃烧
actors.buffs.frostburn.heromsg=你被霜火点燃了！
actors.buffs.frostburn.burnsup=%s 被霜火烧毁了！
actors.buffs.frostburn.ondeath=你在凛冬般的极寒中被烧死了……
actors.buffs.frostburn.rankings_desc=烧至干冰
actors.buffs.frostburn.desc=霜火的伤害可能不如普通火焰，但它会猛烈燃烧并冻结你的双手。\n\n霜火每回合都会造成伤害，直到它熄灭。走进水里无法扑灭霜火，只有在你所在的格子上摔碎一瓶药剂才能扑灭它。除水爆魔药外，任何药剂摔碎后都可以。\n\n另外，霜火可能会点燃与其接触的易燃地形或物品。\n\n剩余霜火回合：%1$s。\n速度减少：%2$s%%
actors.buffs.warriorparry.name=格挡充能
actors.buffs.warriorparry.action_name=格挡
actors.buffs.warriorparry.desc=作为一名战士，战斗的魔法增强了你的防御能力。\n\n你只需要1点充能来格挡一次攻击；任何攻击都可以被格挡，包括魔法攻击，成功格挡将根据被格挡攻击的伤害给予你一定量的护盾。\n\n当前充能：_%1$s/%2$d_。这个充能取决于充能速率和破损纹章的最大护盾值。
actors.buffs.warriorparry$blocktrock.name=凝神格挡
actors.buffs.warriorparry$blocktrock.desc=只要这个效果持续，下一次攻击将被格挡。\n\n但是朝任何方向移动都会使这个效果消失，哦哦哦...
actors.mobs.ech.name=回声
actors.mobs.ech.desc=哎呀
actors.hero.hero.level_down=等级下降！
actors.hero.hero.low_level=等级下降！精准-，闪避-，最大生命值-5！
actors.buffs.hpdebuff.name=健康恶化
actors.buffs.hpdebuff.desc=异界魔法正在削弱你的体质。\n\n当这个减益激活时，你的最大生命值会减少_%d_，只要你的最大生命值高于1，这会随着你受到的伤害增加而叠加。\n\n剩余回合数：%s。
actors.blobs.gravery.desc=空气中弥漫着灰烬与绝望。
actors.blobs.gravery.ondeath=你变成了幽灵...
actors.blobs.gravery.rankings_desc=向死亡献祭了自己
actors.mobs.npcs.mysterymerchant.name=神秘商人
actors.mobs.npcs.mysterymerchant.desc=他倒也没有那么神秘，但他绝对来自另一个世界。这似乎多少解释了这位商人为何对英雄及其能力如此了如指掌。
actors.mobs.npcs.mysterymerchant.intro=你好，又一位英雄。看来你也踏上了寻找著名的英度尔护符的冒险之旅。你和其他冒险者一样，怀着天真却令人钦佩的渴望，不惜一切代价也要找到它……\n\n许多人都在苦苦寻找自己的身份，那份让自己与众不同的个性或技能。而我在这里，就是为了帮你做到这一点，当然，要收取一点小小的费用……
actors.mobs.npcs.mysterymerchant.suggest=那么，你想如何处置你的技能？是想舍弃一些天赋，还是渴望学习全新的东西？现在只需_%d金币_，不过每次服务的价格都会越来越高。
actors.mobs.npcs.mysterymerchant.degrade_talent=削弱天赋
actors.mobs.npcs.mysterymerchant.transmute_talent=蜕变天赋
actors.mobs.npcs.mysterymerchant.choose_degrade_desc=选择一项现有天赋进行削弱。这会返还投入其中的点数，但会减弱或移除该天赋的效果。
actors.mobs.npcs.mysterymerchant.degrade_complete=好了，你的%s已被削弱！
actors.mobs.npcs.mysterymerchant.transmute_complete=好了，你的%s已被彻底转化为%s！
